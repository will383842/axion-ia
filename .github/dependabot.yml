version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    # Majors bloquées volontairement (2026-07-31).
    #
    # Les 4 PR dependabot alors ouvertes (PR 166, 366, 403, 404) échouaient TOUTES
    # sur Gate A, chacune pour une raison différente, mais toujours la même cause
    # de fond : un saut de major groupé avec des pairs qui ne peuvent pas suivre.
    #   - PR 166 : typescript ^5 -> ^7 alors que @typescript-eslint reste en 8.x
    #              => TypeError "Cannot read properties of undefined (reading 'Cjs')"
    #   - PR 366 : eslint ^9 -> ^10 alors que eslint-plugin-react est transitif
    #              (via eslint-config-next, non bumpable par dependabot)
    #              => "Error while loading rule 'react/display-name'"
    #   - PR 403 : prisma 5.22 -> 7.9 ; en Prisma 7 `url`/`directUrl` sortent de
    #              schema.prisma vers prisma.config.ts et PrismaClient exige un
    #              `adapter`. Cela touche le contrat "stub.invalid" de l'ADR 0026
    #              (le stub Proxy se déclenche sur DATABASE_URL) + Gate D.
    #              => chantier avec ADR dédié, jamais un bump automatique.
    #   - PR 404 : vitest 2 -> 4 mais `vite` n'est PAS une dépendance directe,
    #              dependabot ne peut donc pas l'aligner
    #              => ERR_PACKAGE_PATH_NOT_EXPORTED './module-runner'
    #
    # Effet de bord grave : ces 4 zombies saturaient open-pull-requests-limit (5)
    # et empêchaient dependabot d'ouvrir toute autre mise à jour.
    #
    # `version-update:semver-major` ne filtre QUE les mises à jour de version.
    # Les alertes de sécurité Dependabot ne sont pas concernées et continuent
    # de passer, y compris si le correctif implique une major.
    #
    # Une montée de major reste possible : en PR manuelle, délibérée, une seule
    # à la fois, avec ses pairs alignés à la main.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ── stripe : gelé tant que l'intégration DORT (2026-08-18) ──────────────
      #
      # Stripe est NEUTRALISÉ par défaut (`src/lib/stripe.ts`,
      # `isStripeConfigured()` exige `STRIPE_ENABLED=true`) : les paiements se
      # font par virement + saisie manuelle en admin. Le code Stripe est en
      # place mais ne s'exécute pas.
      #
      # 🔑 Le SDK Stripe type `apiVersion` comme UN SEUL littéral par version.
      # Résultat : la moindre montée MINEURE casse le typecheck —
      #   PR #731, stripe 22.1.1 → 22.5.0 :
      #   src/lib/stripe.ts(43,5): error TS2322:
      #     Type '"2026-04-22.dahlia"' is not assignable to type '"2026-07-29.dahlia"'.
      # …et pousse à bumper `STRIPE_API_VERSION` par réflexe pour reverdir la CI.
      #
      # Or `src/lib/stripe.ts` l'interdit explicitement : « Bump = ADR explicit
      # + revue webhook event shapes. Stripe pousse parfois des breaking changes
      # sur les events ; on contrôle. » Un bump réflexe changerait le
      # comportement du jour où Stripe sera réactivé, sans que personne n'ait
      # relu les formes d'événements. Le rouge de CI faisait pression pour
      # violer un contrat écrit — on retire la pression, pas le contrat.
      #
      # On ne fige QUE les montées de version (minor/patch ; major déjà couvert
      # ci-dessus). Les alertes de SÉCURITÉ Dependabot ne portent pas de
      # `update-types` et continuent donc de passer.
      #
      # ⏭️ À RETIRER le jour où Stripe est réactivé (`STRIPE_ENABLED=true`) :
      #    monter alors le SDK et `STRIPE_API_VERSION` ensemble, en PR
      #    délibérée, avec l'ADR et la revue des webhooks.
      - dependency-name: "stripe"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    # UN SEUL LOT — incident du 2026-08-18 (main inconstructible ~6 h).
    #
    # Ce bloc portait quatre groupes (next-stack / typescript / tooling / tests).
    # Quatre groupes = quatre PR par exécution, et CHACUNE réécrit
    # `pnpm-lock.yaml`. Le 18/08, trois d'entre elles (#677, #675, #678) ont été
    # fusionnées en VINGT-QUATRE SECONDES. Chacune était verte contre le `main`
    # qu'elle connaissait, et aucune paire n'entrait en conflit git : les blocs
    # ajoutés au lockfile ne se touchaient pas. Mais deux ajoutaient la MÊME
    # entrée `baseline-browser-mapping@2.11.14` à des endroits différents. Git a
    # additionné les deux ; YAML refuse une clé répétée.
    #
    #     ERR_PNPM_BROKEN_LOCKFILE  duplicated mapping key (4307:3)
    #
    # Conflit SÉMANTIQUE : invisible à une fusion ligne à ligne, par
    # construction. Résultat : `main` ne s'installait plus, ne se construisait
    # plus, ne se déployait plus, et les 7 PR ouvertes étaient gelées.
    #
    # Dependabot rebase bien ses PR quand la base bouge — mais de façon
    # ASYNCHRONE. Vingt-quatre secondes ne lui en laissent pas le temps. La
    # course est perdue avant d'être vue.
    #
    # Un seul groupe = une seule PR par exécution = un seul lockfile à fusionner.
    # La course ne peut plus naître, quelle que soit la vitesse des fusions.
    #
    # ⚠️ Ce que ce réglage ne couvre PAS : la même collision entre deux PR de
    # FONCTIONNALITÉ (le 18/08 aussi, #709 et #692 se sont contredites sur un
    # décompte d'étapes). Seul `strict: true` sur la protection de `main` couvre
    # ce cas-là. Voir la PR de cet ajout pour l'arbitrage.
    #
    # ⚠️ Contrepartie assumée : un seul mauvais bump bloque tout le lot. Le
    # remède reste celui déjà pratiqué plus haut — une entrée `ignore` ciblée,
    # le temps que le pair rattrape.
    groups:
      npm-tout:
        patterns:
          - "*"
    commit-message:
      prefix: chore(deps)
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
