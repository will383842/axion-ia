# Lance Claude Code (CLI) sur un runner GitHub, payé par les CRÉDITS DE L'API Claude (pas le forfait Max).
# Repris d'axion-crm-pro (claude-credit-api.yml, PR #804, #805, #806), avec les pièges déjà payés là-bas :
#   - claude-code-action renvoie « credit balance » alors que la clé marche : on lance la CLI directement ;
#   - le bac à sable de la CLI exige bubblewrap + socat et l'autorisation des espaces de noms (AppArmor) ;
#   - GITHUB_TOKEN ne peut pas créer de PR : Claude pousse une branche, la session pilote ouvre la PR
#     (et la CI se déclenche normalement, puisque la PR est ouverte par un humain) ;
#   - aucun pas après Claude ne reçoit de secret, SAUF la relance sur le compte suivant (rare : crédit épuisé) ;
#     la sortie du modèle n'est jamais affichée.
# Déclenchement MANUEL seulement, par le propriétaire du dépôt, depuis main. Plusieurs exécutions peuvent tourner en parallèle.
# Ne JAMAIS activer le mode debug sur ce workflow, ni publier d'artefact.
#
# Usage (depuis une session pilote) :
#   gh workflow run claude-credit-api.yml -R will383842/axion-ia --ref main \
#     -f consigne="$(cat consigne.md)" -f modele=claude-sonnet-5-5 -f compte=A -f tours_max=150
# CE DÉPÔT EST PUBLIC et ses journaux d'Actions aussi : la consigne est lue dans $GITHUB_EVENT_PATH,
# jamais via `env:` (qui l'afficherait en clair), et aucun texte de réponse n'est journalisé.
# La consigne doit nommer la branche à pousser et demander le corps de PR dans un fichier versionné
# (par ex. .pr/<branche>.md) ; la session pilote ouvre ensuite la PR avec ce corps.

name: Claude (crédit API)

on:
  workflow_dispatch:
    inputs:
      consigne:
        description: "Consigne complète (texte). Doit nommer la branche à pousser. Jamais affichée dans le journal."
        required: true
      modele:
        description: "Modèle"
        type: choice
        options: [claude-sonnet-5-5, claude-opus-5-5]
        default: claude-sonnet-5-5
      compte:
        description: "Compte API essayé en premier (A : expire le 01/12 ; B ensuite)"
        type: choice
        options: [A, B]
        default: A
      tours_max:
        description: "Nombre maximal de tours"
        type: choice
        options: ["40", "80", "150", "250"]
        default: "150"

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: 10.33.4

jobs:
  claude:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Dépendances installées AVANT Claude, hors du bac à sable : dedans, le magasin pnpm (hors du dépôt)
      # est en lecture seule et `pnpm install` échoue (ENOENT/EROFS, mesuré le 26/11). Sans cette étape,
      # le robot ne peut lancer ni typecheck, ni lint, ni vitest, ni build.
      - name: Installer les dépendances du projet (hors bac à sable)
        env:
          SKIP_ENV_VALIDATION: "true"
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          test -x node_modules/.bin/next && test -x node_modules/.bin/vitest && test -x node_modules/.bin/tsc

      # ⚠️ DÉPÔT PUBLIC : la consigne ne passe JAMAIS par `env:` ni par `${{ inputs.consigne }}` dans un
      #    script — les deux s'affichent en clair dans le journal public. On la lit dans le fichier
      #    d'événement du runner ($GITHUB_EVENT_PATH), qui n'est ni affiché ni exposé par l'API publique.
      - name: Écrire la consigne (fichier non suivi par git, jamais affiché)
        run: |
          jq -r '.inputs.consigne // empty' "$GITHUB_EVENT_PATH" > .consigne-claude.md
          echo ".consigne-claude.md" >> .git/info/exclude
          test -s .consigne-claude.md || { echo "::error::Consigne vide."; exit 1; }
          echo "Consigne écrite : $(wc -c < .consigne-claude.md) octets."

      - name: Installer Claude Code, le bac à sable et l'identité git
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap socat >/dev/null
          command -v socat >/dev/null || { echo "socat manquant"; exit 1; }
          command -v bwrap >/dev/null || { echo "bubblewrap manquant"; exit 1; }
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          npm i -g --no-audit --no-fund @anthropic-ai/claude-code >/dev/null 2>&1
          claude --version >/dev/null
          # Identité PROPRE À CE RUN (le Verdict ne compte que les branches dont le commit de tête porte
          # ce committer, daté après le départ) : plusieurs sessions et plusieurs exécutions poussent en parallèle.
          git config user.name "robot-credit-api"
          git config user.email "robot-credit-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@users.noreply.github.com"
          git config user.email > "$RUNNER_TEMP/robot-email.txt"
          date -u +%s > "$RUNNER_TEMP/robot-debut.txt"
          # Diagnostic d'échec : forme de la clé (oui/non, jamais sa valeur) et message d'erreur de la CLI,
          # affiché SEULEMENT si Claude a fait au plus 1 tour (échec au démarrage : pas de travail du modèle à protéger).
          cat > "$RUNNER_TEMP/diagnostic.sh" <<'EOF'
          diagnostic_cle() {
            local k="${ANTHROPIC_API_KEY:-}"
            if [ -z "$k" ]; then echo "::warning::Clé API : secret ABSENT ou vide."; return; fi
            case "$k" in sk-ant-*) forme=oui ;; *) forme=non ;; esac
            case "$k" in *[[:space:]]*) blanc=oui ;; *) blanc=non ;; esac
            echo "Clé API : commence par sk-ant- : $forme ; contient un espace ou un retour à la ligne : $blanc ; longueur > 80 : $([ ${#k} -gt 80 ] && echo oui || echo non)."
          }
          diagnostic_echec() {
            local f="$1" err="$2" tours
            tours=$(jq -r '[.[] | select(.type=="result") | .num_turns // 0] | add // 0' "$f" 2>/dev/null || echo 0)
            echo "::error::Claude n'a produit aucun résultat réussi (tours : $tours)."
            if [ "${tours%%.*}" -le 1 ] 2>/dev/null; then
              jq -r '.[] | select(.type=="result") | "Erreur : \(.subtype // "?") : \((.result // "") | tostring | .[0:300])"' "$f" 2>/dev/null || true
              [ -s "$err" ] && { echo "Dernières lignes d'erreur de la CLI :"; tail -n 8 "$err" | cut -c1-300; }
            fi
            rm -f "$err"
          }
          # Résumé de l'exécution : NOMBRES et noms d'outils seulement. Le dépôt est PUBLIC (journaux publics) :
          # le texte de la réponse de Claude n'est JAMAIS affiché.
          resume_claude() {
            jq -r '.[] | select(.type=="result") |
              "Résumé de Claude : \(.subtype // "?" | tostring | .[0:40]), erreur=\(.is_error), tours=\(.num_turns // 0), coût=\(.total_cost_usd // 0) $, durée=\((.duration_ms // 0) / 1000 | floor) s, longueur de la réponse=\((.result // "") | tostring | length) caractères",
              "Outils refusés : \([.permission_denials[]? | .tool_name | tostring | .[0:40]] | unique | join(", ") | if . == "" then "aucun" else . end)"' "$1" 2>/dev/null || true
          }
          EOF
          git ls-remote --heads origin | sort > "$RUNNER_TEMP/branches-avant.txt"

      - name: Claude (premier compte)
        id: run1
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ inputs.compte == 'B' && secrets.ANTHROPIC_API_KEY_COMPTE_B || secrets.ANTHROPIC_API_KEY_COMPTE_A }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          MODELE: ${{ inputs.modele }}
          TOURS: ${{ inputs.tours_max }}
        run: |
          f="$RUNNER_TEMP/execution-run1.json"
          source "$RUNNER_TEMP/diagnostic.sh"
          diagnostic_cle
          env -u GITHUB_ENV -u GITHUB_STEP_SUMMARY -u GITHUB_PATH -u GITHUB_OUTPUT timeout 4200 claude -p "Ta consigne est dans le fichier .consigne-claude.md à la racine du dépôt. Lis-le et exécute-le. Ne le committe jamais. Tu ne peux pas ouvrir de PR : pousse la branche demandée et écris le corps de PR dans le fichier versionné demandé. Les dépendances sont DÉJÀ installées et le client Prisma généré : ne relance pas pnpm install (le magasin pnpm est en lecture seule) ; lance directement pnpm typecheck, pnpm lint, pnpm vitest run <fichiers>. Si tu changes de branche et que pnpm-lock.yaml diffère, signale-le dans le corps de PR au lieu de réinstaller." \
            --model "$MODELE" --max-turns "$TOURS" \
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,Agent,TodoWrite \
            --output-format json > "$RUNNER_TEMP/brut-run1.json" 2> "$RUNNER_TEMP/err-run1.txt" || true
          jq -s '.' "$RUNNER_TEMP/brut-run1.json" > "$f" 2>/dev/null || echo '[]' > "$f"
          rm -f "$RUNNER_TEMP/brut-run1.json"
          echo "execution_file=$f" >> "$GITHUB_OUTPUT"
          resume_claude "$f"
          if jq -e 'any(.[]; .type == "result" and .is_error == false)' "$f" >/dev/null 2>&1; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          else
            diagnostic_echec "$f" "$RUNNER_TEMP/err-run1.txt"
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"; exit 1
          fi
          rm -f "$RUNNER_TEMP/err-run1.txt"

      - name: Crédit épuisé ou plafond de dépenses atteint ? choisir le compte suivant
        id: bascule
        if: always()
        env:
          FICHIER: ${{ steps.run1.outputs.execution_file }}
          COMPTE: ${{ inputs.compte }}
        run: |
          suivant=""
          if [ -n "$FICHIER" ] && [ -f "$FICHIER" ] && jq -e '
               any(.[]; .type == "result" and .is_error == true
                        and ((.result // "") | test("credit balance|usage limit|spend limit"; "i")))' "$FICHIER" >/dev/null 2>&1; then
            case "$COMPTE" in A) suivant=B ;; B) suivant=A ;; esac
            echo "Crédit épuisé ou plafond atteint sur le compte $COMPTE : bascule vers $suivant."
          fi
          echo "suivant=$suivant" >> "$GITHUB_OUTPUT"

      - name: Claude (compte suivant)
        id: run2
        if: steps.bascule.outputs.suivant != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ steps.bascule.outputs.suivant == 'B' && secrets.ANTHROPIC_API_KEY_COMPTE_B || secrets.ANTHROPIC_API_KEY_COMPTE_A }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          MODELE: ${{ inputs.modele }}
          TOURS: ${{ inputs.tours_max }}
        run: |
          f="$RUNNER_TEMP/execution-run2.json"
          source "$RUNNER_TEMP/diagnostic.sh"
          diagnostic_cle
          env -u GITHUB_ENV -u GITHUB_STEP_SUMMARY -u GITHUB_PATH -u GITHUB_OUTPUT timeout 4200 claude -p "Ta consigne est dans le fichier .consigne-claude.md à la racine du dépôt. Lis-le et exécute-le. Ne le committe jamais. Tu ne peux pas ouvrir de PR : pousse la branche demandée et écris le corps de PR dans le fichier versionné demandé. Les dépendances sont DÉJÀ installées et le client Prisma généré : ne relance pas pnpm install (le magasin pnpm est en lecture seule) ; lance directement pnpm typecheck, pnpm lint, pnpm vitest run <fichiers>. Si tu changes de branche et que pnpm-lock.yaml diffère, signale-le dans le corps de PR au lieu de réinstaller." \
            --model "$MODELE" --max-turns "$TOURS" \
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,Agent,TodoWrite \
            --output-format json > "$RUNNER_TEMP/brut-run2.json" 2> "$RUNNER_TEMP/err-run2.txt" || true
          jq -s '.' "$RUNNER_TEMP/brut-run2.json" > "$f" 2>/dev/null || echo '[]' > "$f"
          rm -f "$RUNNER_TEMP/brut-run2.json"
          echo "execution_file=$f" >> "$GITHUB_OUTPUT"
          resume_claude "$f"
          if jq -e 'any(.[]; .type == "result" and .is_error == false)' "$f" >/dev/null 2>&1; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          else
            diagnostic_echec "$f" "$RUNNER_TEMP/err-run2.txt"
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"; exit 1
          fi
          rm -f "$RUNNER_TEMP/err-run2.txt"

      - name: Bilan (nombres seulement, aucun secret)
        if: always()
        env:
          F1: ${{ steps.run1.outputs.execution_file }}
          F2: ${{ steps.run2.outputs.execution_file }}
          COMPTE: ${{ inputs.compte }}
          SUIVANT: ${{ steps.bascule.outputs.suivant }}
        run: |
          rm -f .consigne-claude.md
          # Les fichiers viennent d'une machine où Claude avait Bash : on n'en garde que des nombres revalidés.
          num() { if [[ "$1" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then printf '%s' "$1"; else printf 0; fi; }
          cout() { [ -n "$1" ] && [ -f "$1" ] && jq -r '[.[] | select(.type=="result") | .total_cost_usd // 0] | add // 0' "$1" 2>/dev/null || echo 0; }
          tours() { [ -n "$1" ] && [ -f "$1" ] && jq -r '[.[] | select(.type=="result") | .num_turns // 0] | add // 0' "$1" 2>/dev/null || echo 0; }
          {
            echo "### Coût Claude (crédit API)"
            echo "- Compte $COMPTE : $(num "$(cout "$F1")") \$ US, $(num "$(tours "$F1")") tours"
            if [[ "$SUIVANT" =~ ^(A|B)$ ]]; then
              echo "- Compte $SUIVANT (bascule) : $(num "$(cout "$F2")") \$ US, $(num "$(tours "$F2")") tours"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict (échec si Claude n'a rien produit)
        if: always()
        env:
          C1: ${{ steps.run1.outputs.conclusion }}
          C2: ${{ steps.run2.outputs.conclusion }}
          F1: ${{ steps.run1.outputs.execution_file }}
          F2: ${{ steps.run2.outputs.execution_file }}
        run: |
          if [ "$C1" != "success" ] && [ "$C2" != "success" ]; then
            echo "::error::Aucune exécution de Claude n'a réussi : voir le diagnostic de l'étape « Claude (premier compte) »."; exit 1; fi
          # Toute consigne doit pousser une branche (code, ou verdict/<nom> pour une relecture) : sinon, échec.
          git ls-remote --heads origin | sort > "$RUNNER_TEMP/branches-apres.txt"
          candidates=$(comm -13 "$RUNNER_TEMP/branches-avant.txt" "$RUNNER_TEMP/branches-apres.txt" | awk '{print $2}' | sed 's#refs/heads/##')
          # Le push d'une AUTRE session ne doit pas faire passer un robot qui n'a rien poussé : on ne garde
          # que les branches dont le commit de tête a pour committer le robot de CE run, daté après son départ.
          robot_email=$(cat "$RUNNER_TEMP/robot-email.txt" 2>/dev/null || true)
          debut=$(cat "$RUNNER_TEMP/robot-debut.txt" 2>/dev/null || echo 0)
          nouvelles=""
          for b in $candidates; do
            git fetch -q --depth=1 origin "refs/heads/$b" 2>/dev/null || continue
            read -r ce ct < <(git log -1 --format='%ce %ct' FETCH_HEAD)
            if [ -n "$robot_email" ] && [ "$ce" = "$robot_email" ] && [ "${ct:-0}" -ge "$debut" ]; then
              nouvelles="$nouvelles $b"; fi
          done
          if [ -z "$nouvelles" ]; then
            # Exception : relecture en lecture seule dont la réponse contient « VERDICT ».
            for x in "$F1" "$F2"; do
              if [ -n "$x" ] && [ -f "$x" ] && jq -e 'any(.[]; .type == "result" and ((.result // "") | tostring | test("VERDICT")))' "$x" >/dev/null 2>&1; then
                echo "Claude a terminé (relecture sans branche : verdict présent dans la réponse)."; exit 0; fi
            done
            echo "::error::Claude a fini sans pousser aucune branche ni rendre de VERDICT : voir « Résumé de Claude » et « Outils refusés » plus haut."; exit 1; fi
          echo "Claude a terminé. Branches poussées (créées ou mises à jour) :"; printf '  %s\n' $nouvelles
