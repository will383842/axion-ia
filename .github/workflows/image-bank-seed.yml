name: Image Bank · Seed + Enrich (SEO/AEO/GEO)

# Pipeline image-bank post-deploy :
#   1. Cleanup disque Hetzner (prune containers/images stoppés — safe)
#   2. Install tsx dans /tmp du container (HOME=/tmp évite ENOSPC /home)
#   3. Seed DB (upsert 133 ImageAssets + translations squelette)
#   4. Enrichissement Claude Vision FR (alt, metaTitle, metaDescription,
#      ogTitle, ogDescription, aiSummary, embeddedText, keywords)
#
# Déclenchements :
#   - Automatique : après chaque deploy réussi de deploy-coolify.yml
#   - Manuel      : GitHub Actions → Run workflow (avec options)
#
# Idempotent : seed upsert par slug, enrich skip les images avec metaTitle.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — affiche le plan sans écrire en DB"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_enrich:
        description: "Skip enrichissement Claude Vision (seed seul)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_enrich:
        description: "Force re-enrichissement de toutes les images"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

  # Trigger automatique après deploy réussi.
  workflow_run:
    workflows: ["Build & Deploy · GHCR + Coolify (axion-ia.com)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  seed-and-enrich:
    name: Seed image bank + Enrich SEO/AEO/GEO
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Ne tourne que si le deploy a réussi (ou si déclenché manuellement).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Setup SSH ────────────────────────────────────────────────────────────

      - name: Setup SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if [ -z "${HETZNER_SSH_KEY:-}" ]; then
            echo "::error::Secret HETZNER_SSH_KEY manquant."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -T 8 178.105.55.15 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o BatchMode=yes -o ConnectTimeout=10 root@178.105.55.15 'echo SSH_OK'

      # ── Wait for container restart (workflow_run uniquement) ─────────────────

      - name: Wait for container restart after deploy
        if: github.event_name == 'workflow_run'
        run: |
          echo "⏳ Attente 3 min pour que Coolify redémarre le container…"
          sleep 180
          echo "✓ Prêt."

      # ── Cleanup disque Hetzner (SAFE — ne touche pas les containers running) ──

      - name: Libérer espace disque Hetzner
        run: |
          ssh -o BatchMode=yes root@178.105.55.15 bash <<'ENDSSH'
            echo "=== Disk avant ==="
            df -h / | tail -1
            echo "=== Prune containers/images/builder stoppés (running containers préservés) ==="
            docker container prune -f 2>&1 | tail -3 || true
            docker image prune -f 2>&1 | tail -3 || true
            docker builder prune -f 2>&1 | tail -3 || true
            echo "=== Disk après ==="
            df -h / | tail -1
          ENDSSH

      # ── Find container ───────────────────────────────────────────────────────

      - name: Find axion-ia container
        id: container
        env:
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          ROWS=$(ssh -o BatchMode=yes root@178.105.55.15 \
            'docker ps --format "{{.Names}}|{{.Status}}"' 2>&1)
          NAME=$(echo "$ROWS" | awk -F'|' -v uuid="$COOLIFY_APP_UUID" \
            '$1 ~ "^"uuid {print $1; exit}')
          if [ -z "$NAME" ]; then
            echo "::error::Container $COOLIFY_APP_UUID introuvable."
            echo "$ROWS"
            exit 1
          fi
          echo "✓ Container: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # ── Pre-check DB ─────────────────────────────────────────────────────────

      - name: Pre-check DB counts
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          echo "── Counts avant seed ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' node -e \
            \"const {PrismaClient}=require('/app/node_modules/@prisma/client');
            const p=new PrismaClient();
            Promise.all([
              p.imageAsset.count(),
              p.imageAssetTranslation.count({where:{metaTitle:{not:null}}})
            ]).then(([a,e])=>{console.log('imageAsset:',a,'enrichies:',e);process.exit(0)})
            .catch(()=>process.exit(0))\"" 2>&1 || true

      # ── Installer tsx dans /tmp du container ──────────────────────────────────
      # Le container prod est un standalone Next.js slim : pas de tsx ni pnpm.
      # HOME=/tmp → npm cache dans /tmp/.npm (évite ENOSPC sur /home/nextjs).

      - name: "[DRY RUN] Afficher le plan"
        if: inputs.dry_run == 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          echo "::notice::DRY_RUN — 133 images à seeder, enrichissement FR à venir"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' ls /app/prisma/seeds/image-bank/ 2>/dev/null" 2>&1 || true

      - name: Installer tsx + @anthropic-ai/sdk dans /tmp/tsx-cli
        if: inputs.dry_run != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          set -euo pipefail
          echo "── Install tsx + sdk (HOME=/tmp pour éviter ENOSPC /home/nextjs) ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' sh -c \
            'rm -rf /tmp/tsx-cli && mkdir -p /tmp/tsx-cli && cd /tmp/tsx-cli && \
             HOME=/tmp npm init -y 2>/dev/null && \
             HOME=/tmp npm install --no-save --no-audit --no-fund tsx @anthropic-ai/sdk 2>&1 | tail -8 && \
             ln -sfn /app/prisma /tmp/prisma && \
             echo SETUP_OK'" 2>&1
          echo "✓ tsx + @anthropic-ai/sdk installés, symlink /tmp/prisma → /app/prisma"

      # ── Step 1 : Seed ─────────────────────────────────────────────────────────

      - name: Copier seed-images.ts → container
        if: inputs.dry_run != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=no \
            prisma/seeds/image-bank/seed-images.ts \
            root@178.105.55.15:/tmp/seed-images.ts
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker cp /tmp/seed-images.ts '$CONTAINER':/app/prisma/seeds/image-bank/seed-images.ts"
          echo "✓ seed-images.ts copié"

      - name: Exécuter seed (133 ImageAssets)
        if: inputs.dry_run != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          set -euo pipefail
          echo "── Seed 133 ImageAssets (upsert idempotent) ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' sh -c \
            'cd /app && /tmp/tsx-cli/node_modules/.bin/tsx \
             prisma/seeds/image-bank/seed-images.ts 2>&1'" 2>&1
          echo "── Seed terminé ──"

      # ── Step 2 : Enrich ───────────────────────────────────────────────────────

      - name: Copier enrich-seeded-images.mts → /tmp/tsx-cli container
        if: inputs.dry_run != 'true' && inputs.skip_enrich != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          set -euo pipefail
          # Copier dans /tmp/tsx-cli/ (à côté de node_modules) :
          #   - @anthropic-ai/sdk résolu via ./node_modules/
          #   - ../prisma/generated/client résolu via symlink /tmp/prisma → /app/prisma
          scp -o BatchMode=yes -o StrictHostKeyChecking=no \
            scripts/enrich-seeded-images.mts \
            root@178.105.55.15:/tmp/enrich-seeded-images.mts
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker cp /tmp/enrich-seeded-images.mts \
             '$CONTAINER':/tmp/tsx-cli/enrich-seeded-images.mts"
          echo "✓ enrich-seeded-images.mts copié dans /tmp/tsx-cli du container"

      - name: Enrichissement SEO/AEO/GEO via Claude Vision (FR)
        if: inputs.dry_run != 'true' && inputs.skip_enrich != 'true'
        timeout-minutes: 20
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
          FORCE_FLAG: ${{ inputs.force_enrich == 'true' && '--force' || '' }}
        run: |
          set -euo pipefail
          echo "── Enrichissement Claude Vision (skip images déjà enrichies) ──"
          # Depuis /tmp/tsx-cli/ : node_modules/.bin/tsx + @anthropic-ai/sdk résolu
          # Symlink /tmp/prisma → /app/prisma résout l'import ../prisma/generated/client
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec -e ENRICH_DELAY_MS=2000 '$CONTAINER' sh -c \
            'cd /tmp/tsx-cli && ./node_modules/.bin/tsx \
             enrich-seeded-images.mts $FORCE_FLAG 2>&1'" 2>&1
          echo "── Enrichissement terminé ──"

      # ── Post-check ───────────────────────────────────────────────────────────

      - name: Post-check DB counts
        if: always()
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          echo "── Counts après seed + enrich ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' node -e \
            \"const {PrismaClient}=require('/app/node_modules/@prisma/client');
            const p=new PrismaClient();
            Promise.all([
              p.imageAsset.count(),
              p.imageAssetTranslation.count({where:{languageCode:'fr'}}),
              p.imageAssetTranslation.count({where:{languageCode:'fr',metaTitle:{not:null}}})
            ]).then(([a,t,e])=>{
              console.log('imageAsset:',a,'trFr:',t,'enrichies:',e);
              process.exit(0);
            }).catch(()=>process.exit(0))\"" 2>&1 || true
