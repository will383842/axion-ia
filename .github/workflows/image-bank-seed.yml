name: Image Bank · Seed + Enrich (SEO/AEO/GEO)

# Pipeline image-bank post-deploy :
#   1. Disk prune Hetzner (containers/images stoppés — safe)
#   2. Seed DB 133 ImageAssets via tsx (TypeScript)
#   3. Enrichissement via enrich-images.cjs (Node.js pur, fetch natif, 0 npm install)
#
# Déclenchements :
#   - Automatique : après chaque deploy réussi de deploy-coolify.yml
#   - Manuel : GitHub Actions → Run workflow
#
# Idempotent : seed upsert par slug, enrich skip images avec metaTitle existant.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (affiche plan, pas d'écriture DB)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_enrich:
        description: "Skip enrichissement (seed seul)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_enrich:
        description: "Force re-enrichissement de toutes les images"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

  workflow_run:
    workflows: ["Build & Deploy · GHCR + Coolify (axion-ia.com)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  seed-and-enrich:
    name: Seed image bank + Enrich SEO/AEO/GEO
    runs-on: ubuntu-latest
    timeout-minutes: 55   # seed ~2min + tsx install ~2min + 133×17s enrich ~38min + buffer

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── SSH ──────────────────────────────────────────────────────────────────

      - name: Setup SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if [ -z "${HETZNER_SSH_KEY:-}" ]; then
            echo "::error::Secret HETZNER_SSH_KEY manquant."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -T 8 178.105.55.15 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o BatchMode=yes -o ConnectTimeout=10 root@178.105.55.15 'echo SSH_OK'

      - name: Wait for container restart after deploy
        if: github.event_name == 'workflow_run'
        run: |
          echo "⏳ Attente 3 min pour que Coolify redémarre le container…"
          sleep 180
          echo "✓ Prêt."

      # ── Disk cleanup ─────────────────────────────────────────────────────────

      - name: Libérer espace disque Hetzner
        run: |
          ssh -o BatchMode=yes root@178.105.55.15 bash <<'ENDSSH'
            echo "=== Disk avant ===" && df -h / | tail -1
            docker container prune -f 2>&1 | tail -2 || true
            docker image prune -f 2>&1 | tail -2 || true
            docker builder prune -f 2>&1 | tail -2 || true
            echo "=== Disk après ===" && df -h / | tail -1
          ENDSSH

      # ── Find container ────────────────────────────────────────────────────────

      - name: Find axion-ia container
        id: container
        env:
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          ROWS=$(ssh -o BatchMode=yes root@178.105.55.15 \
            'docker ps --format "{{.Names}}|{{.Status}}"' 2>&1)
          NAME=$(echo "$ROWS" | awk -F'|' -v uuid="$COOLIFY_APP_UUID" \
            '$1 ~ "^"uuid {print $1; exit}')
          if [ -z "$NAME" ]; then
            echo "::error::Container $COOLIFY_APP_UUID introuvable."
            echo "$ROWS"; exit 1
          fi
          echo "✓ Container: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # ── Pre-check DB ──────────────────────────────────────────────────────────

      - name: Pre-check DB counts
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          echo "── Counts avant seed ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' node -e \
            \"try{const{PrismaClient}=require('/app/prisma/generated/client');
            const p=new PrismaClient();
            Promise.all([p.imageAsset.count(),
              p.imageAssetTranslation.count({where:{metaTitle:{not:null}}})
            ]).then(([a,e])=>{console.log('imageAsset:',a,'enrichies:',e);process.exit(0)})
            .catch(()=>process.exit(0));}
            catch(e){console.log('pre-check skip:',e.message.slice(0,60));process.exit(0);}\"" 2>&1 || true

      # ── [DRY RUN] ─────────────────────────────────────────────────────────────

      - name: "[DRY RUN] Afficher le plan"
        if: inputs.dry_run == 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          echo "::notice::DRY_RUN — 133 images à seeder + enrichissement FR"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' ls /app/prisma/seeds/image-bank/ 2>/dev/null" 2>&1 || true

      # ── Step 1 : Seed (tsx) ───────────────────────────────────────────────────
      # tsx est absent du container prod (standalone slim).
      # Installation fresh dans /tmp/tsx-cli avec npm cache dans /tmp/.npm.
      # Le seed est déjà dans le container (/app/prisma copié au build)
      # mais on copie la dernière version depuis le repo pour garantir 133 entrées.

      - name: Installer tsx dans /tmp du container
        if: inputs.dry_run != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          set -euo pipefail
          echo "── Install tsx (HOME=/tmp évite ENOSPC /home/nextjs) ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' sh -c \
            'rm -rf /tmp/tsx-cli /tmp/.npm && mkdir -p /tmp/tsx-cli && cd /tmp/tsx-cli && \
             HOME=/tmp npm init -y 2>/dev/null && \
             HOME=/tmp npm install --no-save --no-audit --no-fund tsx 2>&1 | tail -5 && \
             echo TSX_READY'" 2>&1
          echo "✓ tsx installé dans /tmp/tsx-cli"

      - name: Copier seed-images.ts → container
        if: inputs.dry_run != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=no \
            prisma/seeds/image-bank/seed-images.ts \
            root@178.105.55.15:/tmp/seed-images.ts
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker cp /tmp/seed-images.ts '$CONTAINER':/app/prisma/seeds/image-bank/seed-images.ts"
          echo "✓ seed-images.ts copié"

      - name: Exécuter seed (133 ImageAssets)
        if: inputs.dry_run != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          set -euo pipefail
          echo "── Seed 133 ImageAssets (upsert idempotent) ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' sh -c \
            'cd /app && /tmp/tsx-cli/node_modules/.bin/tsx \
             prisma/seeds/image-bank/seed-images.ts 2>&1'" 2>&1
          echo "── Seed terminé ──"

      # ── Step 2 : Enrich (node CJS pur — pas de tsx) ───────────────────────────
      # enrich-images.cjs = CommonJS pur :
      #   - fetch() natif Node.js 22 (pas @anthropic-ai/sdk)
      #   - require('/app/prisma/generated/client') (pas d'import ESM)
      # Zéro npm install → disque pas touché → fiable à chaque run.

      - name: Copier enrich-images.cjs → container
        if: inputs.dry_run != 'true' && inputs.skip_enrich != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=no \
            scripts/enrich-images.cjs \
            root@178.105.55.15:/tmp/enrich-images.cjs
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker cp /tmp/enrich-images.cjs '$CONTAINER':/tmp/enrich-images.cjs"
          echo "✓ enrich-images.cjs copié dans /tmp du container"

      - name: Enrichissement SEO/AEO/GEO via Claude Vision (FR)
        if: inputs.dry_run != 'true' && inputs.skip_enrich != 'true'
        timeout-minutes: 45
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
          FORCE_FLAG: ${{ inputs.force_enrich == 'true' && '--force' || '' }}
        run: |
          set -euo pipefail
          echo "── Enrichissement Claude Vision — node /tmp/enrich-images.cjs ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec -e ENRICH_DELAY_MS=1500 '$CONTAINER' sh -c \
            'cd /app && node /tmp/enrich-images.cjs $FORCE_FLAG 2>&1'" 2>&1
          echo "── Enrichissement terminé ──"

      # ── Post-check ────────────────────────────────────────────────────────────

      - name: Post-check DB counts
        if: always()
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          echo "── Counts après seed + enrich ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' node -e \
            \"try{const{PrismaClient}=require('/app/prisma/generated/client');
            const p=new PrismaClient();
            Promise.all([p.imageAsset.count(),
              p.imageAssetTranslation.count({where:{languageCode:'fr'}}),
              p.imageAssetTranslation.count({where:{languageCode:'fr',metaTitle:{not:null}}})
            ]).then(([a,t,e])=>{
              console.log('imageAsset:',a,'| trFr:',t,'| enrichies:',e);
              process.exit(0);
            }).catch(()=>process.exit(0));}
            catch(e){console.log('post-check skip:',e.message.slice(0,60));process.exit(0);}\"" 2>&1 || true
