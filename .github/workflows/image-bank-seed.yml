name: Image Bank · Seed + Enrich (SEO/AEO/GEO)

# Pipeline image-bank post-deploy :
#   1. Seed DB (upsert 133 ImageAssets + translations squelette)
#   2. Enrichissement Claude Vision (alt, metaTitle, metaDescription, ogTitle,
#      ogDescription, aiSummary, embeddedText, keywords) — skip déjà enrichies.
#
# Déclenchements :
#   - Automatique : après chaque deploy réussi de deploy-coolify.yml
#   - Manuel      : GitHub Actions → Run workflow (avec option dry_run)
#
# Idempotent : seed upsert par slug, enrich skip les images avec metaTitle.
# Coût Anthropic ~133 × $0.003 = ~$0.40 (run initial). Subsequent runs = ~$0.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — affiche le plan sans écrire en DB"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_enrich:
        description: "Skip enrichissement Claude Vision (seed seul)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force_enrich:
        description: "Force re-enrichissement de toutes les images"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  # Trigger automatique après deploy réussi.
  workflow_run:
    workflows: ["Build & Deploy · GHCR + Coolify (axion-ia.com)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  seed-and-enrich:
    name: Seed image bank + Enrich SEO/AEO/GEO
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Ne tourne que si le deploy a réussi (ou si déclenché manuellement).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Setup SSH ────────────────────────────────────────────────────────────

      - name: Setup SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if [ -z "${HETZNER_SSH_KEY:-}" ]; then
            echo "::error::Secret HETZNER_SSH_KEY manquant."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -T 8 178.105.55.15 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o BatchMode=yes -o ConnectTimeout=10 root@178.105.55.15 'echo SSH_OK'

      # ── Wait for container restart (workflow_run uniquement) ─────────────────

      - name: Wait for container restart after deploy
        if: github.event_name == 'workflow_run'
        run: |
          echo "⏳ Attente 3 min pour que Coolify redémarre le container…"
          sleep 180
          echo "✓ Prêt."

      # ── Find container ───────────────────────────────────────────────────────

      - name: Find axion-ia container
        id: container
        env:
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          ROWS=$(ssh -o BatchMode=yes root@178.105.55.15 \
            'docker ps --format "{{.Names}}|{{.Status}}"' 2>&1)
          NAME=$(echo "$ROWS" | awk -F'|' -v uuid="$COOLIFY_APP_UUID" \
            '$1 ~ "^"uuid {print $1; exit}')
          if [ -z "$NAME" ]; then
            echo "::error::Container $COOLIFY_APP_UUID introuvable."
            echo "$ROWS"
            exit 1
          fi
          echo "✓ Container: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # ── Pre-check ────────────────────────────────────────────────────────────

      - name: Pre-check DB counts
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          echo "── Counts avant seed ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' node -e \
            \"const {PrismaClient}=require('./node_modules/@prisma/client');
            const p=new PrismaClient();
            Promise.all([
              p.imageAsset.count(),
              p.imageAssetTranslation.count({where:{metaTitle:{not:null}}})
            ]).then(([a,e])=>{console.log('imageAsset:',a,'enrichies:',e);process.exit(0)})
            .catch(()=>process.exit(0))\"" 2>&1 || true

      # ── Step 1 : Seed ─────────────────────────────────────────────────────────

      - name: "[DRY RUN] Afficher le plan seed"
        if: inputs.dry_run == 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          echo "::notice::DRY_RUN — 133 images à seeder (aucune écriture DB)"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' ls /app/prisma/seeds/image-bank/ 2>/dev/null" 2>&1 || true

      - name: Copier seed-images.ts → container
        if: inputs.dry_run != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=no \
            prisma/seeds/image-bank/seed-images.ts \
            root@178.105.55.15:/tmp/seed-images.ts
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker cp /tmp/seed-images.ts '$CONTAINER':/app/prisma/seeds/image-bank/seed-images.ts"
          echo "✓ seed-images.ts copié"

      - name: Exécuter seed (133 ImageAssets)
        if: inputs.dry_run != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          set -euo pipefail
          echo "── Seed 133 ImageAssets (idempotent) ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' sh -c \
            'cd /app && ./node_modules/.bin/tsx prisma/seeds/image-bank/seed-images.ts 2>&1'" 2>&1
          echo "── Seed terminé ──"

      # ── Step 2 : Enrich ───────────────────────────────────────────────────────

      - name: Copier enrich-seeded-images.mts → container
        if: inputs.dry_run != 'true' && inputs.skip_enrich != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' mkdir -p /app/scripts"
          scp -o BatchMode=yes -o StrictHostKeyChecking=no \
            scripts/enrich-seeded-images.mts \
            root@178.105.55.15:/tmp/enrich-seeded-images.mts
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker cp /tmp/enrich-seeded-images.mts \
            '$CONTAINER':/app/scripts/enrich-seeded-images.mts"
          echo "✓ enrich-seeded-images.mts copié"

      - name: Enrichissement SEO/AEO/GEO via Claude Vision (FR)
        if: inputs.dry_run != 'true' && inputs.skip_enrich != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
          FORCE_FLAG: ${{ inputs.force_enrich == 'true' && '--force' || '' }}
        run: |
          set -euo pipefail
          echo "── Enrichissement Claude Vision (skip images déjà enrichies) ──"
          # ENRICH_DELAY_MS=2000 → ~133×2s = ~4.5 min (dans le timeout 25min)
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec -e ENRICH_DELAY_MS=2000 '$CONTAINER' sh -c \
            'cd /app && ./node_modules/.bin/tsx scripts/enrich-seeded-images.mts $FORCE_FLAG 2>&1'" 2>&1
          echo "── Enrichissement terminé ──"

      # ── Post-check ───────────────────────────────────────────────────────────

      - name: Post-check DB counts
        if: always()
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          echo "── Counts après seed + enrich ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' node -e \
            \"const {PrismaClient}=require('./node_modules/@prisma/client');
            const p=new PrismaClient();
            Promise.all([
              p.imageAsset.count(),
              p.imageAssetTranslation.count({where:{languageCode:'fr'}}),
              p.imageAssetTranslation.count({where:{languageCode:'fr',metaTitle:{not:null}}})
            ]).then(([assets,trFr,enriched])=>{
              console.log('imageAsset:',assets,'trFr:',trFr,'enrichies:',enriched);
              process.exit(0);
            }).catch(()=>process.exit(0))\"" 2>&1 || true
