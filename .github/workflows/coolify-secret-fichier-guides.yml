name: Coolify — poser le secret des liens de fichier des guides (manuel)

# ═══════════════════════════════════════════════════════════════════════════════
#  POURQUOI CE WORKFLOW EXISTE
# ═══════════════════════════════════════════════════════════════════════════════
#
# `GUIDES_RESEAU_FICHIER_SECRET` est un secret PUREMENT INTERNE au site : il sert
# à signer les liens de téléchargement des PDF de guides (stockage « volume »).
# Il doit être DIFFÉRENT de `GUIDES_RESEAU_HMAC_SECRET`. Personne n'a besoin de le
# connaître : la valeur est générée sur le runner, masquée aussitôt, posée dans
# Coolify, et n'est ni stockée dans un secret GitHub ni affichée nulle part.
#
# Il n'écrit RIEN si la variable existe déjà en Production (« déjà posée »).
# Le remplacer à la main n'invaliderait que les liens de 10 minutes en cours.
#
# ⚠️ IL NE REDÉPLOIE PAS : la variable est prise en compte au prochain
#    déploiement (voir `coolify-poser-variable.yml`, même raison).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier la configuration
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          manque=0
          for nom in COOLIFY_API_TOKEN COOLIFY_URL COOLIFY_APP_UUID; do
            if [ -z "${!nom:-}" ]; then echo "::error::secret $nom absent"; manque=1; fi
          done
          [ "$manque" -eq 0 ] || exit 1
          echo "Configuration présente."

      - name: Poser le secret s'il est absent
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          CLE=GUIDES_RESEAU_FICHIER_SECRET
          # Le corps d'une réponse Coolify n'est JAMAIS imprimé (risque de secrets dans le journal).
          reponse=$(curl -sS -m 20 -w '\n%{http_code}' \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/envs")
          code=$(printf '%s' "$reponse" | tail -n1)
          corps=$(printf '%s' "$reponse" | sed '$d')
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::l'API a répondu $code"
            exit 1
          fi
          # is_preview distingue Production et Preview : seule la Production compte.
          existe=$(printf '%s' "$corps" | jq --arg k "$CLE" '[.[] | select(.key == $k and .is_preview == false)] | length')
          if [ "$existe" -gt 0 ]; then
            echo "déjà posée"
            exit 0
          fi

          valeur=$(openssl rand -hex 32)
          echo "::add-mask::${valeur}"
          # Le corps passe par un fichier : la valeur ne figure jamais sur une ligne de commande.
          # Pas de `is_build_time` : l'API le refuse (422).
          jq -n --arg k "$CLE" --arg v "$valeur" \
            '{key: $k, value: $v, is_preview: false, is_literal: true}' > "$RUNNER_TEMP/corps.json"
          code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/corps.json" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/envs")
          rm -f "$RUNNER_TEMP/corps.json"
          echo "HTTP $code"
          case "$code" in
            200 | 201) ;;
            *) echo "::error::écriture refusée ($code)"; exit 1 ;;
          esac

          # Relire par le NOM (jamais la valeur) : une écriture qui rend 200 sans persister existe.
          corps=$(curl -sS -m 20 \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/envs")
          trouve=$(printf '%s' "$corps" | jq --arg k "$CLE" '[.[] | select(.key == $k and .is_preview == false)] | length')
          [ "$trouve" -ge 1 ] || { echo "::error::variable absente APRÈS écriture"; exit 1; }
          echo "posée"
