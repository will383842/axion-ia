name: Nightly · Gate D

# Audit E2E 2026-05-11 P0-CONF-09 — 5/7 steps `if: false` activés.
#
# Avant ce patch :
#   - Full Playwright `if: false`
#   - OWASP ZAP `if: false`
#   - mail-tester `if: false`
#   - backup-drill `if: false`
#   - Lighthouse history `if: false`
# → Gate D fantôme, faux signal vert toutes les nuits.
#
# Stratégie d'activation :
#   - Chaque step a maintenant un toggle `if: ${{ vars.NIGHTLY_<STEP>_ENABLED == 'true' }}`
#     (variable repo Settings → Secrets and variables → Actions → Variables).
#     Permet à Will d'activer step-par-step en évitant un fail global jour 1.
#   - Defaults : tout actif sauf `mail-tester` (envoie un vrai mail, à laisser
#     opt-in jusqu'à création boîte dpo@axion-ia.com).
#   - `continue-on-error: false` partout (hard fail Gate D).
#
# Pré-requis VPS / config :
#   - STAGING_URL (variable repo) : URL staging si déployée, sinon prod.
#   - DATABASE_URL_TEST_RESTORE (secret) : DB jetable pour restore-drill.
#   - E2E_BASE_URL passe via env (nom lu par playwright.config.ts — voir F18 :
#     ce job a envoye PLAYWRIGHT_BASE_URL pendant au moins 10 nuits, ce qui le
#     faisait retomber sur localhost:3000 sans build et echouer en connexion
#     refusee, gate a11y comprise).

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 🔴 Audit certification 2026-07-26 (X5) — ce job REMPLACE `playwright-staging`.
  #
  # L'ancien job s'appelait « Full Playwright (chromium) vs prod » et n'a jamais
  # ouvert une URL de axion-ia.com : il exportait un nom d'environnement que rien
  # ne lit (playwright.config.ts lit E2E_BASE_URL). Playwright retombait sur
  # http://localhost:3000, y démarrait son webServer alors que ce job ne fait
  # aucun build → « Could not find a production build » → 76 nuits d'échec en
  # ERR_CONNECTION_REFUSED, gate a11y comprise.
  #
  # POURQUOI ON NE S'EST PAS CONTENTÉ DE CORRIGER LE NOM DE LA VARIABLE (fait le
  # 2026-07-26, F18) : la suite complète lance les 21 specs. Braquées sur la prod,
  # elles SOUMETTENT le formulaire de contact (tests/e2e/flows/contact-submission
  # .spec.ts remplit nom/email/message, coche le consentement et clique « Envoyer »
  # — donc écriture en base de PRODUCTION et envoi d'email, chaque nuit, avec des
  # données personnelles fictives), tentent des connexions sur la console admin
  # (flows/admin-auth, flows/admin-routes) et comparent des captures prod à des
  # baselines prises en local (admin-baseline-screenshots).
  # Ajouter un build à ce job n'est pas une option : le SSG (~18k routes) exige le
  # free-disk, le bind-mount sur /mnt et le heap 6144 empilés dans ci.yml — gate-b
  # met 21 min rien que pour ça, ce job plafonne à 30.
  # On ne garde donc que ce qui mesure la prod SANS RIEN Y ÉCRIRE : l'audit
  # axe-core, en lecture seule.
  a11y-prod:
    name: A11y axe-core WCAG 2.2 AA vs prod (15 pages, lecture seule)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.NIGHTLY_A11Y_ENABLED != 'false' && vars.NIGHTLY_PLAYWRIGHT_ENABLED != 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: axe-core vs prod — 0 violation serious/critical
        env:
          # 🔴 Audit 2026-07-26 (F18) : playwright.config.ts lit E2E_BASE_URL, pas
          # PLAYWRIGHT_BASE_URL. Avec le mauvais nom, Playwright retombait sur
          # http://localhost:3000, demarrait son webServer (aucun build en CI) et
          # TOUS les tests echouaient en ERR_CONNECTION_REFUSED — dont la gate a11y
          # « 0 serious/critical ». Le job s'appelait « vs prod » sans jamais
          # atteindre la prod.
          E2E_BASE_URL: https://axion-ia.com
        # On cible le FICHIER, pas le tag : le filtre `--grep @a11y` est OUVERT
        # (tests/e2e/sprint-a-user-journeys.spec.ts le porte déjà, et rien
        # n'empêche qu'une spec qui écrit le porte demain). Un job pointé sur la
        # PROD ne doit pas dépendre d'un filtre que personne ne relit.
        # `--retries=1` (au lieu des 2 retries CI de playwright.config.ts) borne le
        # budget : 15 tests × 2 tentatives / 4 workers ≈ 14 min, sous les 30 min du
        # job. Avec 3 tentatives à 90 s, un premier passage tout rouge frôlait le
        # timeout — soit le « rouge d'infra » que ce lot supprime.
        run: pnpm exec playwright test tests/e2e/a11y.spec.ts --project=chromium --retries=1
      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-prod-report
          path: playwright-report/
          # 30 jours = confort de diagnostic. ⚠️ Ce n'est PAS une pièce du dossier
          # Qualiopi : l'indicateur 26 porte sur le référent handicap, les réseaux
          # et la procédure d'adaptation (src/server/qualiopi/config/registry.ts,
          # lignes 191-198), pas sur l'accessibilité numérique du site. Et un
          # artefact GitHub à 30 jours n'est pas consultable par l'auditrice.
          retention-days: 30

  pnpm-audit:
    name: pnpm audit (deps CVE scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # `--ignore-scripts` — SANS LUI CE JOB N'AUDITE RIEN DU TOUT.
      #
      # `package.json` déclare `"prepare": "husky"`. Avec `--prod`, pnpm
      # n'installe pas les devDependencies — dont husky — puis exécute quand même
      # le script `prepare` : la commande `husky` n'existe pas, l'install sort en
      # `ELIFECYCLE` (sans message explicite), et le job meurt AVANT l'étape
      # d'audit.
      #
      # Conséquence constatée le 2026-07-31 : le scan CVE était rouge six nuits
      # d'affilée et n'avait donc JAMAIS tourné. Un job rouge donne l'illusion
      # d'un signal ; ici il n'y avait aucune couverture.
      #
      # On ignore les scripts plutôt que de neutraliser `prepare` dans
      # `package.json` (`husky || true`) : ça garde les hooks git intacts pour
      # tout le monde en local, et l'audit n'a de toute façon besoin que du
      # lockfile résolu, jamais d'un script de cycle de vie.
      - run: pnpm install --frozen-lockfile --prod --ignore-scripts
      - name: pnpm audit (production deps) — hard fail high/critical
        run: |
          set -e
          pnpm audit --prod --audit-level high --json > audit.json
          high=$(grep -oE '"severity":"(high|critical)"' audit.json | wc -l || true)
          echo "High/critical vulnerabilities: $high"
          if [ "$high" -gt 0 ]; then
            echo "::error::Nightly audit found $high high/critical CVEs"
            cat audit.json
            exit 1
          fi

  zap-baseline:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.NIGHTLY_ZAP_ENABLED != 'false' }}
    steps:
      - uses: actions/checkout@v6
      - name: ZAP baseline vs prod
        # owasp/zap2docker-stable image renamed → use zaproxy/zap-stable
        run: |
          docker run --rm -t \
            -v ${{ github.workspace }}:/zap/wrk \
            zaproxy/zap-stable zap-baseline.py \
            -t "${{ vars.STAGING_URL || 'https://axion-ia.com' }}" \
            -I -m 10 -T 25 \
            -r zap-report.html || ZAP_EXIT=$?
          # ZAP exit 0=clean, 1=warnings, 2=errors. On accepte les warnings
          # mais on bloque sur les errors (vrais issues sécu).
          if [ "${ZAP_EXIT:-0}" -ge 2 ]; then exit 1; fi
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-report
          path: zap-report.html
          retention-days: 14

  mail-tester:
    name: Mail deliverability probe (mail-tester.com)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # OPT-IN par défaut (envoie un vrai email à mail-tester.com).
    # Active via `gh variable set NIGHTLY_MAIL_TESTER_ENABLED --body true`.
    if: ${{ vars.NIGHTLY_MAIL_TESTER_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Send sample email + fetch mail-tester score
        env:
          MAIL_TESTER_TO: ${{ secrets.MAIL_TESTER_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
        run: pnpm tsx scripts/test-email-e2e.ts

  backup-drill:
    name: Backup restore drill (test DB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.NIGHTLY_BACKUP_DRILL_ENABLED != 'false' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axionia_drill
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: axionia_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Install aws-cli (R2 S3-compatible)
        run: aws --version 2>/dev/null || (sudo apt-get update && sudo apt-get install -y awscli)
      - name: Pull latest Postgres backup from Cloudflare R2 + drill restore
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 2026-05-15 fix audit D5+D6 (P0-2) : on bascule sur le script R2 dédié.
        # `restore-postgres-test.sh` (variante SSH Storage Box) reste pour le
        # drill manuel mensuel sur le VPS. Voir _AUDIT/CI-SECRETS-REQUIRED.md
        # pour la liste des 7 secrets requis (R2_*, BACKUP_ENCRYPTION_PASSPHRASE,
        # TELEGRAM_*) — sans eux, fail attendu avec message explicite.
        run: |
          chmod +x scripts/restore-postgres-test-r2.sh
          DATABASE_URL_TEST=postgresql://axionia_drill:drill@localhost:5432/axionia_drill \
            bash scripts/restore-postgres-test-r2.sh

  lighthouse-history:
    name: Lighthouse history (5 URLs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ vars.NIGHTLY_LHCI_ENABLED != 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: LHCI collect + upload temp storage
        # Audit A1 P2-5 (2026-05-15) — `pnpm exec lhci` au lieu de
        # `npx --yes @lhci/cli@0.15`. @lhci/cli est en devDependencies
        # (^0.15.1) et résolu par le `pnpm install --frozen-lockfile`
        # ci-dessus, donc plus de download supply-chain runtime.
        run: |
          pnpm exec lhci collect \
            --url=https://axion-ia.com/fr \
            --url=https://axion-ia.com/en \
            --url=https://axion-ia.com/fr/audit \
            --url=https://axion-ia.com/fr/reserver \
            --url=https://axion-ia.com/fr/implantations/ile-de-france/paris \
            --numberOfRuns=3 \
            --settings.preset=desktop
          pnpm exec lhci upload --target=temporary-public-storage
          # Assertions soft pour le history nocturne : on log, on fail pas
          # (les hard fails se font dans deploy-coolify.yml).
          pnpm exec lhci assert || echo "::warning::LHCI assertions failed (history mode)"

  qualiopi-chaine-complete:
    # 🔴 `pnpm e2e:qualiopi` existait depuis des mois et N'AVAIT AUCUN APPELANT.
    #
    # Le script provisionne une base pgvector jetable et fait tourner TOUTE la
    # chaîne Qualiopi — 14 documents réglementaires, attestations calculées sur
    # les heures réelles, factures OPCO / entreprise / France Travail, les 22
    # indicateurs, le manifeste du mode auditeur, le BPF — et rend les PDF.
    # C'est la seule preuve de bout en bout que le dépôt possède sur cette
    # chaîne, et personne ne la jouait.
    #
    # Lancée à la main le 2026-08-21, elle mourait à l'étape facture : le script
    # semait `qualiopi.siret = "SIRET-TEST-PLACEHOLDER"`, valeur que le registre
    # refuse depuis son durcissement du 2026-08-17 — et que `getQualiopiConfig`
    # écartait EN SILENCE au profit du défaut vide. Corrigé dans la même PR.
    #
    # En nocturne et pas en PR : le script démarre un conteneur Postgres et rend
    # une trentaine de PDF. C'est trop lent pour le temps de PR, et ce qu'il
    # protège — la conformité des pièces opposables — ne régresse pas à l'heure.
    name: Chaîne Qualiopi complète (14 documents, factures, 22 indicateurs, BPF)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.NIGHTLY_QUALIOPI_CHAINE_ENABLED != 'false' }}
    env:
      SKIP_ENV_VALIDATION: "true"
      BULLMQ_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Chaîne complète sur base jetable
        run: pnpm e2e:qualiopi
      - name: Pièces produites (PDF + résumé JSON)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualiopi-chaine-${{ github.run_id }}
          path: _AUDIT/VERIF-QUALIOPI-CHAINE-COMPLETE/
          retention-days: 14

  notify-failure:
    name: Notify nightly failure
    runs-on: ubuntu-latest
    # ⚠️ Un job absent de cette liste échoue SANS PRÉVENIR : la notification ne
    # se déclenche que sur les `needs`. Ajouter tout job nocturne ici, sinon il
    # rougit dans une interface que personne n'ouvre.
    needs:
      [
        a11y-prod,
        pnpm-audit,
        zap-baseline,
        mail-tester,
        backup-drill,
        lighthouse-history,
        qualiopi-chaine-complete,
      ]
    if: failure()
    steps:
      - name: Post Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::warning::No TELEGRAM_BOT_TOKEN — skipping notif"
            exit 0
          fi
          curl -sf -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🌙 Nightly Gate D FAILED — run ${{ github.run_id }} : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "disable_web_page_preview=true"
