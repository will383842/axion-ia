name: Nightly · Gate D

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

jobs:
  nightly:
    name: Nightly checks vs staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # D5 cert 2026-05-08 — stubs `echo` convertis en `if: false` explicites
      # pour éviter les faux positifs verts (audit D5 anti-pattern majeur).
      # Chaque step listé reste planifié mais désactivé jusqu'à implémentation.
      - name: Full Playwright vs staging (NOT IMPLEMENTED — Sprint 21)
        if: false
        env:
          E2E_BASE_URL: https://staging.axion-ia.com
        run: pnpm test:e2e
      - name: pnpm audit
        run: pnpm audit --json > audit.json || true
      - name: OWASP ZAP full scan (NOT IMPLEMENTED — Sprint 21)
        if: false
        run: docker run -t owasp/zap2docker-stable zap-baseline.py -t https://staging.axion-ia.com
      - name: Mail-tester 7 templates x 2 locales (NOT IMPLEMENTED — Sprint 19)
        if: false
        run: pnpm tsx scripts/mail-tester.ts
      - name: Backup restore drill (NOT IMPLEMENTED — Sprint 23)
        if: false
        run: pnpm tsx scripts/backup-drill.ts
      - name: Lighthouse history (NOT IMPLEMENTED — Sprint 23)
        if: false
        run: pnpm lhci:autorun --upload.target=temporary-public-storage
      - name: Notify nightly status
        if: failure()
        run: |
          echo "Nightly Gate D failure — manual review required."
          echo "Will : Sprint 21/19/23 stubs to wire."
