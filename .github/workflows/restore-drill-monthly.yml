# Drill mensuel de restauration multi-composant (ADR 0032).
#
# Prouve que les backups sont restaurables (pas juste « ils existent ») et écrit
# un RestoreDrill dans l'admin via /api/internal/backups/drills (HMAC).
# Gardé par la repo var MONTHLY_RESTORE_DRILL_ENABLED (default actif).
#
# Secrets requis (cf. _AUDIT/CI-SECRETS-REQUIRED.md) :
#   R2_* , BACKUP_ENCRYPTION_PASSPHRASE, BACKUP_INGEST_SECRET, TELEGRAM_* (opt)
name: restore-drill-monthly

on:
  schedule:
    - cron: "0 4 1 * *" # 1er du mois 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-postgres:
    name: Drill restore Postgres (R2 → PG éphémère)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.MONTHLY_RESTORE_DRILL_ENABLED != 'false' }}
    services:
      postgres:
        # pgvector/pgvector:pg16 (pas postgres:16-alpine) : le dump prod contient
        # la table KnowledgeEmbedding (type `vector`). Sans l'extension pgvector,
        # le pg_restore échoue à créer les tables extension-dépendantes → drill faux
        # négatif. Cf. runbook R33 (un cold-restore réel exige aussi pgvector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axionia_drill
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: axionia_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Install aws-cli
        run: aws --version 2>/dev/null || (sudo apt-get update && sudo apt-get install -y awscli)
      - name: Drill restore + report RestoreDrill
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Reporting dashboard (prod) :
          BACKUP_REPORT_URL: https://axion-ia.com
          BACKUP_INGEST_SECRET: ${{ secrets.BACKUP_INGEST_SECRET }}
          BACKUP_SOURCE: github_ci
        run: |
          chmod +x scripts/restore-postgres-test-r2.sh scripts/backup-lib.sh
          export COMPONENT="postgres" COMPONENT_LABEL="POSTGRES-DRILL"
          # shellcheck source=scripts/backup-lib.sh
          source scripts/backup-lib.sh
          START=$(date +%s)
          set +e
          DATABASE_URL_TEST=postgresql://axionia_drill:drill@localhost:5432/axionia_drill \
            bash scripts/restore-postgres-test-r2.sh
          RC=$?
          set -e
          DUR=$(( $(date +%s) - START ))
          if [ "$RC" -eq 0 ]; then
            report_restore_drill "passed" "null" "$DUR" "r2" "latest-daily"
            notify_telegram "✅ Drill mensuel Postgres OK (${DUR}s)" "🟢"
          else
            report_restore_drill "failed" "null" "$DUR" "r2" "latest-daily" "restore_rc_${RC}"
            notify_telegram "🔴 Drill mensuel Postgres ÉCHEC (rc=${RC})" "🔴"
            exit "$RC"
          fi

  secrets-integrity:
    name: Vérif intégrité archive secrets (R2, sans déchiffrement)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.MONTHLY_RESTORE_DRILL_ENABLED != 'false' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install aws-cli
        run: aws --version 2>/dev/null || (sudo apt-get update && sudo apt-get install -y awscli)
      - name: Head-object dernière archive secrets + report
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_IMMUTABLE: ${{ secrets.R2_BUCKET_IMMUTABLE }}
          BACKUP_REPORT_URL: https://axion-ia.com
          BACKUP_INGEST_SECRET: ${{ secrets.BACKUP_INGEST_SECRET }}
          BACKUP_SOURCE: github_ci
        run: |
          chmod +x scripts/backup-lib.sh
          export COMPONENT="secrets" COMPONENT_LABEL="SECRETS-DRILL"
          # shellcheck source=scripts/backup-lib.sh
          source scripts/backup-lib.sh
          if [ -z "${R2_BUCKET_IMMUTABLE:-}" ]; then
            echo "::warning::R2_BUCKET_IMMUTABLE non configuré — skip"
            exit 0
          fi
          LATEST=$(s3 s3 ls "s3://${R2_BUCKET_IMMUTABLE}/secrets/" | awk '{print $4}' | sort -r | head -1)
          if [ -n "${LATEST}" ]; then
            SIZE=$(s3 s3api head-object --bucket "${R2_BUCKET_IMMUTABLE}" --key "secrets/${LATEST}" \
              --query 'ContentLength' --output text 2>/dev/null || echo 0)
            if [ "${SIZE}" -gt 0 ]; then
              report_restore_drill "passed" "null" "0" "r2-immutable" "${LATEST}"
            else
              report_restore_drill "failed" "null" "0" "r2-immutable" "${LATEST}" "empty_object"
              exit 1
            fi
          else
            report_restore_drill "failed" "null" "0" "r2-immutable" "" "no_secrets_archive"
            exit 1
          fi

  notify-failure:
    name: Notify drill failure
    runs-on: ubuntu-latest
    needs: [restore-postgres, secrets-integrity]
    if: failure()
    steps:
      - name: Post Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "${TELEGRAM_BOT_TOKEN:-}" ] && { echo "::warning::no token"; exit 0; }
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🔴 Drill mensuel restauration ÉCHEC — run ${{ github.run_id }}" \
            -d "disable_web_page_preview=true"
