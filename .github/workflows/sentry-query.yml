name: Sentry query · fetch issue events (autopilot diagnostic)

# Workflow utilitaire workflow_dispatch — query Sentry SaaS API pour
# fetch les détails d'une issue + ses events + breadcrumbs.
#
# Usage Claude :
#   gh workflow run sentry-query.yml -f action=list-recent
#   gh workflow run sentry-query.yml -f action=issue-detail -f issue_id=118951810
#   gh workflow run sentry-query.yml -f action=event-detail -f issue_id=118951810
#   gh workflow run sentry-query.yml -f action=issues-by-tag -f query='tags[route]:admin'
#
# Output dump dans les step logs (gh run view --log).

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list-recent | issue-detail | event-detail | issues-by-tag'
        required: true
        default: 'list-recent'
        type: choice
        options:
          - list-recent
          - issue-detail
          - event-detail
          - issues-by-tag
      issue_id:
        description: 'Sentry issue ID (numeric, requis pour issue-detail / event-detail)'
        required: false
        default: ''
        type: string
      query:
        description: 'Query string Sentry (ex: "tags[route]:admin" pour issues-by-tag)'
        required: false
        default: ''
        type: string
      stats_period:
        description: 'Période (24h, 7d, 14d, 30d)'
        required: false
        default: '24h'
        type: choice
        options:
          - '24h'
          - '7d'
          - '14d'
          - '30d'

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate secrets
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing SENTRY_AUTH_TOKEN secret. Run: gh secret set SENTRY_AUTH_TOKEN"
            exit 1
          fi
          echo "Token OK ($(echo -n $SENTRY_AUTH_TOKEN | wc -c) chars)"

      - name: Sentry query
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG_SLUG }}
          ACTION: ${{ inputs.action }}
          ISSUE_ID: ${{ inputs.issue_id }}
          QUERY: ${{ inputs.query }}
          STATS_PERIOD: ${{ inputs.stats_period }}
        run: |
          set -euo pipefail
          ORG="${SENTRY_ORG:-world-expat}"
          PROJECT="axion-ia"
          BASE="https://sentry.io/api/0"
          AUTH="Authorization: Bearer ${SENTRY_AUTH_TOKEN}"

          case "$ACTION" in
            list-recent)
              echo "──── Recent issues (period=$STATS_PERIOD) ────"
              curl -s -H "$AUTH" "$BASE/projects/$ORG/$PROJECT/issues/?statsPeriod=$STATS_PERIOD&limit=20" \
                | jq -r '.[] | "\(.id) [\(.level)] count=\(.count) lastSeen=\(.lastSeen[0:19]) | \(.title[0:120])"'
              ;;
            issue-detail)
              if [ -z "$ISSUE_ID" ]; then echo "::error::issue_id required"; exit 1; fi
              echo "──── Issue $ISSUE_ID — HTTP status ────"
              curl -s -o /tmp/issue.json -w "HTTP %{http_code}\n" -H "$AUTH" "$BASE/issues/$ISSUE_ID/"
              echo "──── Issue $ISSUE_ID — RAW (first 4000 chars) ────"
              head -c 4000 /tmp/issue.json
              echo ""
              echo "──── Issue $ISSUE_ID — top-level keys ────"
              jq 'keys' /tmp/issue.json || echo "(not JSON or jq failed)"
              echo "──── Issue $ISSUE_ID — summary ────"
              jq -r '. as $r | "id=\($r.id // "null") shortId=\($r.shortId // "null") title=\($r.title // "null") culprit=\($r.culprit // "null") count=\($r.count // "null") userCount=\($r.userCount // "null") level=\($r.level // "null") lastSeen=\($r.lastSeen // "null") status=\($r.status // "null") platform=\($r.platform // "null")"' /tmp/issue.json || true
              ;;
            event-detail)
              if [ -z "$ISSUE_ID" ]; then echo "::error::issue_id required"; exit 1; fi
              echo "──── Latest event of issue $ISSUE_ID — HTTP status ────"
              curl -s -o /tmp/event.json -w "HTTP %{http_code}\n" -H "$AUTH" "$BASE/issues/$ISSUE_ID/events/latest/"
              echo "──── Latest event — top-level keys ────"
              jq 'keys' /tmp/event.json || echo "(not JSON or jq failed)"
              echo "──── Latest event — basic context ────"
              jq '{eventID, dateCreated, title, message, platform, culprit, location: .location, sdk: .sdk, tags: ([.tags[]? | {key, value}])}' /tmp/event.json || true
              echo "──── Latest event — request/contexts ────"
              jq '{contexts, request, user, environment}' /tmp/event.json || true
              echo "──── Latest event — entry types ────"
              jq -r '[.entries[]? | .type] | join(", ")' /tmp/event.json || true
              echo "──── Latest event — exception (first) ────"
              jq '[.entries[]? | select(.type == "exception") | .data.values[0]] | first' /tmp/event.json || true
              echo "──── Latest event — breadcrumbs (last 30) ────"
              jq '[.entries[]? | select(.type == "breadcrumbs") | .data.values[]?] | .[-30:] | map({timestamp, type, category, level, message: (.message // ""), data: (.data // {})})' /tmp/event.json || true
              echo "──── Latest event — request entry ────"
              jq '[.entries[]? | select(.type == "request") | .data] | first' /tmp/event.json || true
              echo "──── Latest event — RAW (first 8000 chars, fallback) ────"
              head -c 8000 /tmp/event.json
              echo ""
              ;;
            issues-by-tag)
              if [ -z "$QUERY" ]; then echo "::error::query required"; exit 1; fi
              echo "──── Issues matching: $QUERY ────"
              ENC_QUERY=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$QUERY")
              curl -s -H "$AUTH" "$BASE/projects/$ORG/$PROJECT/issues/?query=$ENC_QUERY&statsPeriod=$STATS_PERIOD&limit=20" \
                | jq -r '.[] | "\(.id) [\(.level)] count=\(.count) lastSeen=\(.lastSeen[0:19]) | \(.title[0:120])"'
              ;;
          esac
