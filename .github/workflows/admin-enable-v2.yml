name: Admin · enable/disable V2 globally (autopilot)

# Workflow utilitaire workflow_dispatch — flip ADMIN_V2_ENABLED côté Coolify
# (env var prod) + restart container. Permet à Will d'activer/désactiver
# globalement la refonte admin V2 sans toucher Coolify UI.
#
# Référence : src/lib/feature-flags.ts — fallback chain :
#   1. cookie admin_v2=1 (override per-user, géré client-side)
#   2. env var ADMIN_V2_ENABLED (bascule globale prod, ce workflow)
#   3. default false (legacy V1)
#
# Sécurité : workflow_dispatch only, requires manual trigger.
#
# Référence Coolify API : https://coolify.io/docs/api-reference/applications/

on:
  workflow_dispatch:
    inputs:
      value:
        description: 'Valeur ADMIN_V2_ENABLED (true = V2 visible, false = V1 legacy)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      restart:
        description: 'Restart container après set env var (true recommandé pour appliquer immédiatement)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  enable-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate secrets
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          for v in COOLIFY_API_TOKEN COOLIFY_URL COOLIFY_APP_UUID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing secret: $v"
              exit 1
            fi
          done
          echo "Secrets OK."

      - name: List current env vars
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          echo "──── Current ADMIN_V2_ENABLED state ────"
          response=$(curl -fsSL -m 15 \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/envs")
          echo "$response" | jq -r '.[] | select(.key == "ADMIN_V2_ENABLED") | "Found: key=\(.key) value=\(.value) uuid=\(.uuid // "?")"' || echo "(ADMIN_V2_ENABLED not currently set)"
          echo "──── End ────"

      - name: Upsert ADMIN_V2_ENABLED env var
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          NEW_VALUE: ${{ inputs.value }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg key "ADMIN_V2_ENABLED" --arg value "$NEW_VALUE" '{
            key: $key,
            value: $value,
            is_preview: false,
            is_literal: false,
            is_multiline: false,
            is_shown_once: false
          }')
          echo "──── PATCH attempt (update existing env var) ────"
          patch_response=$(curl -sS -m 15 -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            -w "\nHTTP=%{http_code}" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/envs")
          echo "$patch_response"
          patch_code=$(echo "$patch_response" | tail -1 | sed 's/HTTP=//')
          if [ "$patch_code" = "200" ] || [ "$patch_code" = "201" ]; then
            echo "✅ PATCH success (env var updated)."
          elif [ "$patch_code" = "404" ] || [ "$patch_code" = "422" ]; then
            echo "──── PATCH failed (env var not exists), trying POST ────"
            post_response=$(curl -sS -m 15 -X POST \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              -w "\nHTTP=%{http_code}" \
              "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/envs")
            echo "$post_response"
            post_code=$(echo "$post_response" | tail -1 | sed 's/HTTP=//')
            if [ "$post_code" = "200" ] || [ "$post_code" = "201" ]; then
              echo "✅ POST success (env var created)."
            else
              echo "::error::POST failed with HTTP $post_code"
              exit 1
            fi
          else
            echo "::error::Unexpected PATCH response: HTTP $patch_code"
            exit 1
          fi

      - name: Verify env var set (warning only — Coolify may obfuscate)
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          EXPECTED_VALUE: ${{ inputs.value }}
        run: |
          set +e
          echo "──── Verify ADMIN_V2_ENABLED state ────"
          response=$(curl -fsSL -m 15 \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/envs")
          echo "Full env vars list (ADMIN_V2_ENABLED entries) :"
          echo "$response" | jq '.[] | select(.key == "ADMIN_V2_ENABLED")' || true
          actual=$(echo "$response" | jq -r '.[] | select(.key == "ADMIN_V2_ENABLED") | .value' | head -1 | tr -d '[:space:]')
          echo "Expected: '$EXPECTED_VALUE' Actual: '$actual'"
          if [ "$actual" = "$EXPECTED_VALUE" ]; then
            echo "✅ Env var correctly set."
          else
            echo "::warning::Verify comparison failed (actual='$actual'). Coolify may obfuscate value — proceed to restart anyway."
          fi
          exit 0

      - name: Cleanup duplicate ADMIN_V2_ENABLED entries
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set +e
          response=$(curl -fsSL -m 15 \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/envs")
          # Garder le 1er match, supprimer les autres.
          uuids=$(echo "$response" | jq -r '[.[] | select(.key == "ADMIN_V2_ENABLED") | .uuid] | .[1:][]')
          if [ -n "$uuids" ]; then
            echo "Found duplicate ADMIN_V2_ENABLED entries — cleaning up extras."
            for uuid in $uuids; do
              echo "Deleting env var uuid=$uuid"
              curl -sS -m 15 -X DELETE \
                -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
                -w "HTTP=%{http_code}\n" \
                "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/envs/$uuid"
            done
          else
            echo "No duplicates to clean."
          fi
          exit 0

      - name: Restart container (deploy redeploy)
        if: inputs.restart == 'true'
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          echo "──── Triggering Coolify redeploy ────"
          # 2026-08-28 : Coolify a mis a jour son API — /api/v1/deploy est passe
          # de GET a POST. Le point d entree repond desormais 405 avec
          # {"message":"This endpoint has changed to a POST request."} sur un GET.
          # `-G` transformait --data-urlencode en parametres de requete GET ; sans lui,
          # curl envoie un POST avec les memes donnees en corps de formulaire.
          response=$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Accept: application/json" \
            --data-urlencode "uuid=${COOLIFY_APP_UUID}" \
            --data-urlencode "force=true" \
            --max-time 30 \
            "${COOLIFY_URL}/api/v1/deploy")
          echo "Coolify response: ${response}"
          deployment_uuid=$(echo "${response}" | jq -r '.deployments[0].deployment_uuid // .deployment_uuid // empty')
          if [ -n "$deployment_uuid" ]; then
            echo "Deployment queued: ${deployment_uuid}"
            echo "Track at ${COOLIFY_URL}/deployment/${deployment_uuid}"
          fi
          echo "Waiting 60s for container to come back up..."
          sleep 60
          echo "──── Smoke /api/healthz ────"
          curl -s -o /tmp/healthz.json -w "HTTP=%{http_code} time=%{time_total}s\n" https://axion-ia.com/api/healthz
          cat /tmp/healthz.json
          echo ""

      - name: SSH verify ADMIN_V2_ENABLED in container
        if: inputs.restart == 'true'
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set +e
          if [ -z "${HETZNER_SSH_KEY:-}" ]; then
            echo "::warning::HETZNER_SSH_KEY not set — skip SSH verify."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -T 8 178.105.55.15 >> ~/.ssh/known_hosts 2>/dev/null
          # Find container by COOLIFY_APP_UUID prefix
          CONTAINER=$(ssh -o BatchMode=yes root@178.105.55.15 "docker ps --format '{{.Names}}' | awk -v uuid=\"$COOLIFY_APP_UUID\" '\$1 ~ \"^\"uuid {print \$1; exit}'")
          if [ -z "$CONTAINER" ]; then
            echo "::warning::No container matching COOLIFY_APP_UUID prefix found."
            exit 0
          fi
          echo "──── docker exec $CONTAINER printenv | grep -i admin_v2 ────"
          ssh -o BatchMode=yes root@178.105.55.15 "docker exec '$CONTAINER' printenv | grep -i admin_v2 || echo '(ADMIN_V2_ENABLED not set in container env)'"
          echo "──── Container started_at ────"
          ssh -o BatchMode=yes root@178.105.55.15 "docker inspect '$CONTAINER' --format '{{.State.StartedAt}}'"
          exit 0
