name: Staging · Gate C

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.axion-ia.com
    env:
      # Audit verif-fix-deploy 2026-05-18 — GitHub Actions interdit la référence
      # directe d'un secret dans une condition `if:` (parser rejette tout le
      # workflow). On bascule la présence du secret via une env var step-level.
      HAS_COOLIFY_STAGING_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v6
      - name: Trigger Coolify webhook
        if: env.HAS_COOLIFY_STAGING_WEBHOOK == 'yes'
        run: |
          curl -fsS -X POST "${{ secrets.COOLIFY_STAGING_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ref": "${{ github.sha }}"}'
      - name: Smoke tests vs staging
        env:
          E2E_BASE_URL: https://staging.axion-ia.com
        run: |
          echo "Smoke tests stub — Sprint 22 wires real Playwright suite."
      - name: OWASP ZAP baseline
        run: echo "ZAP baseline stub — Sprint 21 wires real scan."
