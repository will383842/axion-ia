name: Coolify — créer le stockage persistant des guides (manuel)

# ═══════════════════════════════════════════════════════════════════════════════
#  POURQUOI CE WORKFLOW EXISTE
# ═══════════════════════════════════════════════════════════════════════════════
#
# Le stockage « volume » des PDF de guides (`GUIDES_RESEAU_STOCKAGE=volume`) écrit
# dans `/var/data/guides-reseau`. Sans stockage persistant monté à cet endroit, les
# fichiers disparaissent à chaque mise en ligne. Ce workflow crée ce stockage dans
# Coolify par l'API, pour ne dépendre d'aucune session ouverte dans l'interface.
#
# Type « persistent » = volume Docker nommé (PAS un dossier de l'hôte : un dossier
# de l'hôte appartient à root et le site, utilisateur 1001, ne pourrait pas y écrire).
# Un volume neuf et vide reprend, au premier démarrage, le propriétaire du dossier
# de l'image (créé pour `nextjs` dans le Dockerfile).
#
# Il n'écrit RIEN si un stockage existe déjà sur ce chemin (« déjà créé »).
# Il ne contient et ne lit AUCUN secret d'application.
#
# ⚠️ IL NE REDÉPLOIE PAS : le stockage est monté au prochain déploiement.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier la configuration
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          manque=0
          for nom in COOLIFY_API_TOKEN COOLIFY_URL COOLIFY_APP_UUID; do
            if [ -z "${!nom:-}" ]; then echo "::error::secret $nom absent"; manque=1; fi
          done
          [ "$manque" -eq 0 ] || exit 1
          echo "Configuration présente."

      - name: Créer le stockage s'il est absent
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          CHEMIN=/var/data/guides-reseau
          NOM=guides-reseau
          URL="${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/storages"

          # Le corps d'une réponse Coolify n'est JAMAIS imprimé tel quel : seuls des
          # chemins de montage (non secrets) et des compteurs sortent dans le journal.
          lire() {
            curl -sS -m 20 -w '\n%{http_code}' \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" "$URL"
          }
          compter() {
            jq --arg c "$CHEMIN" '[(.persistent_storages // [])[] | select(.mount_path == $c)] | length'
          }

          reponse=$(lire)
          code=$(printf '%s' "$reponse" | tail -n1)
          corps=$(printf '%s' "$reponse" | sed '$d')
          echo "Lecture : HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::lecture des stockages refusée ($code) : cette version de Coolify ne les expose peut-être pas par l'API"
            exit 1
          fi
          existe=$(printf '%s' "$corps" | compter)
          [[ "$existe" =~ ^[0-9]+$ ]] || { echo "::error::réponse illisible"; exit 1; }
          echo "Chemins déjà montés :"
          printf '%s' "$corps" | jq -r '(.persistent_storages // [])[] | "  " + (.mount_path // "?")'
          # Un montage de fichier ou de dossier d'hôte sur ce chemin serait une erreur de réglage.
          conflit=$(printf '%s' "$corps" | jq --arg c "$CHEMIN" '[(.file_storages // [])[] | select(.mount_path == $c)] | length')
          [[ "$conflit" =~ ^[0-9]+$ ]] || { echo "::error::réponse illisible"; exit 1; }
          if [ "$conflit" -gt 0 ]; then
            echo "::error::un montage de fichier ou de dossier d'hôte existe déjà sur $CHEMIN : à retirer à la main"
            exit 1
          fi
          if [ "$existe" -gt 0 ]; then
            echo "déjà créé"
            exit 0
          fi

          trap 'rm -f "$RUNNER_TEMP/corps.json"' EXIT
          jq -n --arg n "$NOM" --arg c "$CHEMIN" \
            '{type: "persistent", name: $n, mount_path: $c}' > "$RUNNER_TEMP/corps.json"
          code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/corps.json" "$URL")
          echo "Création : HTTP $code"
          case "$code" in
            200 | 201) ;;
            *) echo "::error::création refusée ($code)"; exit 1 ;;
          esac

          # Relire : une écriture qui rend 201 sans persister existe.
          reponse=$(lire)
          code=$(printf '%s' "$reponse" | tail -n1)
          corps=$(printf '%s' "$reponse" | sed '$d')
          [ "$code" = "200" ] || { echo "::error::relecture refusée ($code)"; exit 1; }
          trouve=$(printf '%s' "$corps" | compter)
          if ! [[ "$trouve" =~ ^[0-9]+$ ]] || [ "$trouve" -ne 1 ]; then
            echo "::error::stockage absent ou en double APRÈS création"
            exit 1
          fi
          echo "créé (monté au prochain déploiement)"
