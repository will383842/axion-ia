name: Cloudflare full purge weekly

# P2-24 audit indexation 2026-05-18 — purge weekly Cloudflare cache complet.
# Insurance contre cas où des routes statiques (logos, JS bundles vieux) ou
# 1-an cached assets restent en CDN edge avec contenu obsolète post-deploy.
# Idempotent + low-cost (CF Free tier accepte 1000 purges/24h).
#
# Schedule : Sunday 04:00 UTC (low-traffic window après backup CRM 03:00 UTC).
# Workflow_dispatch pour test manuel.
#
# Secrets requis (déjà set par autres workflows) :
#   - CLOUDFLARE_API_TOKEN : token avec permission `Zone:Cache Purge:Edit`
#   - CLOUDFLARE_ZONE_ID : zone ID axion-ia.com
#
# Si secrets absents → script fail-soft → workflow vert avec warning.

on:
  schedule:
    # Tous les dimanches 04:00 UTC (05h CEST été / 06h CET hiver).
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip purge, log only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  purge:
    name: Cloudflare full cache purge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -e
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID; do
            if [ -z "${!v:-}" ]; then
              echo "::warning::Missing secret $v — skipping purge"
              exit 0
            fi
          done
          echo "Secrets OK."

      - name: Cloudflare full purge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "::warning::Secrets absent — skip"
            exit 0
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::DRY_RUN mode — purge skipped"
            exit 0
          fi
          response=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          success=$(echo "$response" | grep -o '"success":[^,]*' | head -1)
          if echo "$success" | grep -q "true"; then
            echo "::notice::Cloudflare full purge OK"
          else
            echo "::error::Cloudflare purge failed : $response"
            exit 1
          fi
