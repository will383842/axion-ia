name: GSC Search Analytics weekly export

# Export hebdo des PERFORMANCES DE RECHERCHE Search Console dans
# `_AUDIT/search-analytics-YYYY-WW.csv`.
#
# 🔴 RENOMMÉ le 2026-08-16 — GEO-032. Ce workflow s'appelait « Crawl Stats »
# et prétendait mesurer le gate « budget de crawl < 30 % de la production ».
# Il n'a jamais exporté de données d'exploration : le script interroge
# `searchAnalytics`, dont les colonnes sont impressions/clics/CTR/position.
# Le rapport « Statistiques d'exploration » de GSC n'a pas d'API publique —
# la mesure promise était irréalisable, pas seulement absente. Pour de vraies
# données d'exploration : les journaux Caddy filtrés sur Googlebot.
#
# Schedule : lundi 08:00 UTC (créneau low-traffic + GSC API stable, données
# de la semaine N-1 finalisées).
#
# Auth : **OAuth refresh_token flow** (cohérent avec `src/server/content-gen/seo/gsc-client.ts`
# commit f2ba3ec — worker keyword-sync). Réutilise les credentials Desktop
# OAuth client + refresh long-lived setup dans la conv parallèle GCP.
#
# GH secrets requis (à copier depuis Coolify `.secrets/api-tokens.env`) :
#   - GSC_OAUTH_CLIENT_ID
#   - GSC_OAUTH_CLIENT_SECRET
#   - GSC_OAUTH_REFRESH_TOKEN
#
# GH variable requise : GSC_PROPERTY_URL (déjà set 2026-05-15).
#
# Si secrets absents → script fail-soft → workflow vert avec warning visible.
#
# Output : ARTEFACT de run (90 jours) + résumé lisible dans l'onglet Actions.
#
# 🔴 CE WORKFLOW A ÉCHOUÉ EN SILENCE PENDANT TROIS SEMAINES (2026-08-27).
# Il commitait le CSV puis faisait `git push` sur `main`. Or `main` est en
# protection stricte : le push est refusé par `GH006: Protected branch update
# failed`. L'export lui-même FONCTIONNAIT — les données étaient bien
# récupérées — mais le job mourait à la dernière étape et le rapport
# n'arrivait nulle part. Deux lundis consécutifs en `failure` (17 et 24 août),
# sans que personne ne regarde : un cron qui échoue ne réveille personne.
#
# ⛔ NE PAS RÉTABLIR LE PUSH SUR `main`, ni via un jeton à privilèges élargis.
# La protection de branche n'est pas l'obstacle à contourner, c'est la règle du
# dépôt. Et passer par une PR hebdomadaire serait pire : chaque fusion invalide
# TOUTES les PR en vol et leur coûte un cycle de gates (~35 min). Un rapport
# d'audit n'a pas à encombrer la file de livraison.

on:
  schedule:
    # Tous les lundis 08:00 UTC (09h CEST été / 10h CET hiver).
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no commit/push)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Lecture seule : ce workflow n'ecrit plus rien dans le depot. Reduire le
# perimetre du jeton est la moitie du correctif — l'autre etant de ne plus
# tenter le push du tout.
permissions:
  contents: read

jobs:
  export:
    name: GSC export → _AUDIT/search-analytics-*.csv
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run export
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_PROPERTY_URL: ${{ vars.GSC_PROPERTY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${GSC_OAUTH_REFRESH_TOKEN:-}" ]; then
            echo "::warning::GSC_OAUTH_* secrets absent — skipping export"
            exit 0
          fi
          if [ -z "${GSC_PROPERTY_URL:-}" ]; then
            echo "::warning::GSC_PROPERTY_URL var absent — defaulting to sc-domain:axion-ia.com"
          fi
          node scripts/perf/export-gsc-search-analytics.mjs

      # Le CSV part en ARTEFACT, pas dans le dépôt. Il reste téléchargeable
      # 90 jours depuis l'onglet Actions, sans toucher à `main` ni encombrer la
      # file de fusion.
      - name: Publier le CSV en artefact
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: gsc-search-analytics
          path: _AUDIT/search-analytics-*.csv
          retention-days: 90
          if-no-files-found: warn

      # 🔑 ET SURTOUT : les chiffres s'affichent DIRECTEMENT dans le résumé du
      # run. Un artefact qu'il faut télécharger pour lire n'est pas un rapport,
      # c'est une archive — et personne n'ouvre une archive chaque lundi. Le
      # résumé, lui, se lit d'un coup d'œil depuis la notification.
      - name: Résumé lisible
        if: ${{ always() && inputs.dry_run != 'true' }}
        run: |
          set -uo pipefail
          fichier=$(ls -1 _AUDIT/search-analytics-*.csv 2>/dev/null | tail -1 || true)
          if [ -z "$fichier" ]; then
            echo "### GSC — aucun export produit cette semaine" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Les secrets \`GSC_OAUTH_*\` sont-ils toujours posés ?" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          lignes=$(( $(wc -l < "$fichier") - 1 ))
          echo "### GSC — performances de recherche" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Fichier \`$(basename "$fichier")\` — $lignes lignes." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Vingt premières lignes :" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```csv' >> "$GITHUB_STEP_SUMMARY"
          head -21 "$fichier" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
