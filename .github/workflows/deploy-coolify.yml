name: Build & Deploy · GHCR + Coolify (axion-ia.com)

# Pipeline 2026-05-16 — Option F.1 (image publique GHCR).
#
# Sprint recovery 2026-05-16 : 9 deploys Coolify ont échoué la nuit du
# 2026-05-15 → 16 à cause de la saturation disque CPX42 (peak ~117 GB
# pour build SSG 17 629 routes). On bascule le build sur GitHub Actions
# (runners gratuits, ~84 GB disque) qui push l'image sur GHCR public.
# Coolify ne fait plus que pull l'image (~10 GB) → deploy ~2 min au lieu
# de 25, plus de saturation VPS.
#
# Flow :
#   git push main
#       ↓
#   GH Actions job `build` : build + push ghcr.io/<owner>/axion-ia:{sha,latest}
#       ↓
#   GH Actions job `deploy` (needs build) : POST Coolify /api/v1/deploy
#       ↓
#   Coolify pull ghcr.io/<owner>/axion-ia:latest + redeploy
#       ↓
#   GH Actions job `purge` : Cloudflare cache purge
#       ↓
#   GH Actions job `lhci` : Lighthouse CI gate post-deploy
#
# Action humaine OneTime requise :
#   1. Après 1er push réussi, rendre l'image GHCR PUBLIQUE :
#        github.com/users/<owner>/packages/container/axion-ia/settings
#        → "Change visibility" → Public
#      (Sinon Coolify ne peut pas pull sans creds.)
#   2. Reconfigurer Coolify : Application → Source → "Docker Image" type,
#      image = `ghcr.io/<owner>/axion-ia:latest`, Pull on deploy = ON.
#
# Required repo secrets :
#   COOLIFY_API_TOKEN     Sanctum token format `<id>|<plaintext>`.
#   COOLIFY_URL           e.g. `http://178.105.55.15:8000`.
#   COOLIFY_APP_UUID      Application UUID.
#   CLOUDFLARE_API_TOKEN  Zone token with Cache:Purge permission.
#   CLOUDFLARE_ZONE_ID    Zone ID for axion-ia.com.
#   (GITHUB_TOKEN auto-injected pour push GHCR.)
#
# Manual trigger : workflow_dispatch (Actions tab → Run workflow).

on:
  # Sprint 14.10.7 fix Will (2026-05-12) : le trigger `workflow_run` ne
  # se déclenchait jamais (0/50 derniers runs étaient en event=workflow_run).
  # Cause probable : bug GitHub Actions où workflow_run reste silencieusement
  # inactif quand le workflow file est ajouté après création du repo. On
  # bascule donc sur un trigger `push: branches:[main]` direct — les hooks
  # pre-push exécutent déjà tests + lint + typecheck, donc la garantie de
  # qualité est conservée.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "_AUDIT/**"
      - ".gitignore"
      - ".github/workflows/coolify-diagnose.yml"
      - ".github/workflows/coolify-zombie-cleanup.yml"
      - ".claude/**"
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Build & push image only — skip Coolify deploy + CF purge + LHCI (use for first run before Coolify reconfig)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Audit 2026-05-15 P0-01 : 8 deploys consécutifs ÉCHEC (`cancelled-by-user via
# API`). Cause : chaque POST Coolify /api/v1/deploy fait annuler par Coolify le
# deploy précédent en cours → cascade de cancellations. Correctif d'origine :
# `concurrency: { group: deploy-coolify, cancel-in-progress: false }` AU NIVEAU
# WORKFLOW (sérialisait TOUT, build de 25-90 min inclus → la file s'empilait).
#
# 2026-06-10 (Will) — concurrence SCINDÉE au niveau JOB pour regrouper les
# pushes rapprochés en un seul deploy SANS rouvrir le P0-01 :
#   - job `build`  → groupe `build-*`, cancel-in-progress: TRUE. Un push plus
#     récent annule le build obsolète en cours. AUCUN effet de bord (le build
#     ne touche jamais Coolify) → économise les builds redondants de 25-90 min.
#   - job `deploy` → groupe `deploy-coolify`, cancel-in-progress: FALSE.
#     L'étape qui POST Coolify reste SÉRIALISÉE (un POST à la fois, jamais
#     annulée) → P0-01 toujours prévenu.
# Net : N pushes rapprochés ⇒ au plus 1 build complet + 1 deploy (le plus
# récent, qui contient tout — `main` est linéaire). ⚠️ NE PAS remettre une
# `concurrency` au niveau workflow ni passer le job `deploy` à `true` (= P0-01).

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Build image Docker sur GitHub Actions + push GHCR.
  # Sprint recovery 2026-05-16 : externalise le build hors du VPS CPX42
  # qui saturait à 117 GB peak disque sur SSG 17 629 routes.
  # ───────────────────────────────────────────────────────────────────────
  build:
    name: Build & push image to GHCR
    # Concurrence build-only : un push plus récent annule ce build obsolète
    # (cf. bloc « concurrence SCINDÉE » en tête de fichier). cancel-in-progress
    # TRUE est SÛR ici — le build ne touche jamais Coolify.
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    # Audit deploy-unstuck 2026-05-18 : streak 12+ deploys ratés depuis fea4b2e
    # (last green 2026-05-17 13:40 UTC) avec pattern OOM-kill silencieux à ~38 min
    # sur ubuntu-latest 16 GB. Diagnostic D2/D3/D4 confirme peak RAM 14.8-16.2 GB
    # (next build SSG ~9 535 routes dont 6 450 villes).
    # Cycle 5 (ubuntu-latest-large 32 GB) testé : runner non-disponible sur ce
    # compte (run resté queued 10 min sans assignment). Pivot Cycle 6 sous-cas C :
    # garder ubuntu-latest + réduire SSG villes via env var BUILD_SSG_VILLES_INDEXABLE_ONLY=true
    # (cf. src/components/sections/VilleServicePageTemplate.tsx D4-QW1).
    runs-on: ubuntu-latest
    # 2026-06-05 : relevé 60 → 90. Le build SSG (~17k routes) est pile à la limite
    # 60 min et déborde selon la variance du runner (run 26999460963 annulé à 1h0m0s
    # « exceeded maximum execution time », image jamais poussée). cache-to étant
    # désactivé (peak disque), le rerun n'accélère pas. 90 min donne la marge.
    timeout-minutes: 90
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Free disk space (max headroom)
        # Ubuntu-latest démarre avec ~30 GB free. Sprint recovery 2026-05-16
        # build #5 : cleanup TRÈS agressif après échec « no space left on
        # device » sur build #4 (~38 min). On vise > 75 GB free total.
        run: |
          set -x
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/go \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/lib/jvm \
            /usr/lib/google-cloud-sdk \
            /usr/lib/firefox \
            /opt/az \
            /opt/microsoft \
            /opt/google \
            /opt/pipx \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune --all --force --volumes || true
          sudo apt-get autoremove -y --purge \
            azure-cli \
            firefox \
            google-chrome-stable \
            microsoft-edge-stable \
            mongodb-* \
            mysql-* \
            postgresql-* \
            mono-* \
            powershell || true
          sudo apt-get clean
          df -h /

      - name: Relocate Docker storage to /mnt (build headroom)
        # ubuntu-latest expose DEUX disques : / (~75 GB) et /mnt (~75 GB séparés).
        # Le pic du build Docker (statique précompressé ~5,5 GB + layers builder
        # + COPY runner) débordait la partition / MALGRÉ le cleanup ci-dessus →
        # « no space left on device » à l'assemblage de l'image runner
        # (run 27429145791, échec à 44 min sur COPY /app/.next/standalone).
        # On bascule le data-root Docker sur /mnt AVANT setup-buildx pour que le
        # buildkit (driver docker-container) et ses layers vivent sur /mnt.
        # Pur infra runner : zéro impact sur l'image, l'app ou les Web Vitals.
        run: |
          set -x
          df -h / /mnt || true
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker
          existing=$(cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          echo "$existing" | jq '. + {"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          sudo docker info | grep -i "Docker Root Dir" || true
          df -h / /mnt || true

      # Audit deploy-unstuck 2026-05-18 (S10 instrumentation) — background
      # monitor RAM + disk + load + CPU toutes les 30s. Crucial pour
      # diagnostiquer si build OOM-kill silencieusement (pattern observé sur
      # ubuntu-latest 16 GB). Log dumpé en fin de job (success ou failure).
      - name: Background memory + disk monitor (S10 instrumentation)
        run: |
          set +e
          mkdir -p /tmp
          ( while true; do
              ts=$(date -u +%H:%M:%SZ)
              mem=$(free -m | awk '/Mem:/ {printf "RAM total=%dMB used=%dMB free=%dMB available=%dMB", $2, $3, $4, $7}')
              disk=$(df -m / | awk 'NR==2 {printf "Disk used=%dMB avail=%dMB", $3, $4}')
              load=$(uptime | sed -E 's/.*load average: //')
              cpu=$(top -bn1 -d 0.5 | awk '/Cpu\(s\)/ {print $0; exit}')
              echo "[$ts] $mem | $disk | load=$load | $cpu"
              sleep 30
            done ) > /tmp/build-monitor.log 2>&1 &
          echo "MONITOR_PID=$!" >> "$GITHUB_ENV"
          echo "Monitor started (PID $!)"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Lowercase forcé (GHCR rejette le mixed-case).
          images: ghcr.io/${{ github.repository_owner }}/axion-ia
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Compute BUILD_TIME (ISO 8601 UTC)
        id: build_time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://axion-ia.com
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_CALENDLY_APPEL_URL=${{ vars.NEXT_PUBLIC_CALENDLY_APPEL_URL || 'https://calendly.com/axion-ia/appel-decouverte' }}
            BUILD_TIME=${{ steps.build_time.outputs.value }}
            BUILD_SHA=${{ github.sha }}
            SKIP_ENV_VALIDATION=true
            DATABASE_URL=postgresql://stub:stub@stub.invalid:5432/stub
            REDIS_URL=redis://stub.invalid:6379
            BUILD_SSG_VILLES_INDEXABLE_ONLY=true
          # Cache GH Actions natif (gratuit, plus rapide que registry cache).
          # Sprint recovery 2026-05-16 : cache-to mode=min (au lieu de max)
          # pour limiter le peak disque pendant l'export du cache (~10-20 GB
          # économisés). Trade-off : builds successifs moins rapides (mode
          # min cache que les layers finaux). Quand le pipeline est stable,
          # repasser à mode=max.
          #
          # Audit verif-fix-deploy 2026-05-18 : 8 deploys consécutifs failed
          # depuis fea4b2e (last success 2026-05-17 13:40 UTC). Build die at
          # ~38 min sans log flush sur step 8 = pattern OOM kill runner.
          # Hypothèse : cache restore + cache export pendant le build saturent
          # le runner 16 GB RAM. Désactivation temporaire pour valider.
          # Si succès → re-activer cache-from puis cache-to en validation.
          cache-from: type=gha
          # cache-to disabled — fix verif-fix-deploy 2026-05-18 OOM-kill investigation
          # Désactive le provenance attestation (génère 50 MB extra de
          # metadata SLSA inutile pour notre cas).
          provenance: false

      - name: Print image ref
        run: |
          echo "::notice::Image pushed : ghcr.io/${{ github.repository_owner }}/axion-ia:${{ steps.meta.outputs.version }}"
          echo "::notice::Digest : ${{ steps.build.outputs.digest }}"

      # Audit deploy-unstuck 2026-05-18 (S10 always-run) — dump du monitor
      # log même si build a fail (récupère l'historique RAM/disk avant OOM-kill).
      - name: Print monitor log (S10 always run)
        if: always()
        run: |
          if [ -n "${MONITOR_PID:-}" ]; then
            kill "$MONITOR_PID" 2>/dev/null || true
          fi
          echo "=== BUILD MONITOR LOG (last 200 lines) ==="
          tail -200 /tmp/build-monitor.log 2>/dev/null || echo "(no monitor log)"
          echo "=== FINAL STATE ==="
          free -h || true
          df -h / || true
          echo "=== CPU INFO ==="
          nproc || true
          grep -c "^processor" /proc/cpuinfo || true

  deploy:
    name: Trigger Coolify deploy
    needs: build
    # Concurrence deploy : SÉRIALISÉE (cancel-in-progress FALSE) → l'étape qui
    # POST Coolify ne tourne JAMAIS en parallèle et n'est jamais annulée →
    # correctif P0-01 préservé (cf. bloc en tête de fichier). NE PAS passer à true.
    concurrency:
      group: deploy-coolify
      cancel-in-progress: false
    # Skip deploy si workflow_dispatch + input skip_deploy=true (1er run avant
    # reconfiguration Coolify en mode "Docker Image").
    if: github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/v1/deploy
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_API_TOKEN:-}" ] || [ -z "${COOLIFY_URL:-}" ] || [ -z "${COOLIFY_APP_UUID:-}" ]; then
            echo "::error::Missing required secrets (COOLIFY_API_TOKEN, COOLIFY_URL, COOLIFY_APP_UUID). Set them via 'gh secret set'."
            exit 1
          fi
          echo "Triggering deploy on Coolify for app ${COOLIFY_APP_UUID}…"
          response=$(curl -fsSL -G \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Accept: application/json" \
            --data-urlencode "uuid=${COOLIFY_APP_UUID}" \
            --data-urlencode "force=true" \
            --max-time 30 \
            "${COOLIFY_URL}/api/v1/deploy")
          echo "Coolify response: ${response}"
          # Extract deployment_uuid for traceability in Actions logs.
          deployment_uuid=$(echo "${response}" | grep -oE '"deployment_uuid":"[^"]+"' | head -1 | cut -d'"' -f4 || true)
          if [ -n "${deployment_uuid}" ]; then
            echo "Deployment queued: ${deployment_uuid}"
            echo "Track at ${COOLIFY_URL}/deployment/${deployment_uuid}"
            echo "deployment_uuid=${deployment_uuid}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not extract deployment_uuid from response."
          fi
        id: deploy

      - name: POST /api/v1/deploy (worker BullMQ — axion-ia-worker)
        # P0 2026-06-13 : le worker BullMQ est une 2e app Coolify (Dockerfile.worker)
        # qui consomme TOUTES les files BullMQ de génération de contenu (génération, publication,
        # indexation, lifecycle…). Sans ce trigger, un push main ne redéploie QUE
        # l'app web → le code du worker reste figé en prod (les fixes worker ne
        # parviennent jamais en production). Coolify rebuild l'app worker depuis la
        # source (Dockerfile.worker) à ce POST.
        # No-op si COOLIFY_WORKER_APP_UUID absent → activation par Will :
        #   gh secret set COOLIFY_WORKER_APP_UUID --body "<uuid-app-worker>"
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_WORKER_APP_UUID: ${{ secrets.COOLIFY_WORKER_APP_UUID }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_WORKER_APP_UUID:-}" ]; then
            echo "::warning::COOLIFY_WORKER_APP_UUID non défini — redéploiement du worker IGNORÉ. Le code worker NE sera PAS mis à jour en prod. Ajoute le secret pour activer."
            exit 0
          fi
          if [ -z "${COOLIFY_API_TOKEN:-}" ] || [ -z "${COOLIFY_URL:-}" ]; then
            echo "::error::Missing COOLIFY_API_TOKEN / COOLIFY_URL."
            exit 1
          fi
          echo "Triggering deploy on Coolify for WORKER app ${COOLIFY_WORKER_APP_UUID}…"
          response=$(curl -fsSL -G \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Accept: application/json" \
            --data-urlencode "uuid=${COOLIFY_WORKER_APP_UUID}" \
            --data-urlencode "force=true" \
            --max-time 30 \
            "${COOLIFY_URL}/api/v1/deploy")
          echo "Coolify worker response: ${response}"
        id: deploy_worker

      - name: Wait for Coolify deployment to finish (max 25 min + early-fail)
        if: steps.deploy.outputs.deployment_uuid != ''
        timeout-minutes: 30
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          # Sprint Web Vitals fix 2026-05-17 — réduction timeout 60→25 min :
          # ADR 0026 cible "deploy ~2 min" (pull image GHCR + restart). Sur
          # disque sain (>20 GB free) + GHCR non throttlé, c'est < 10 min.
          # 25 min couvre une marge généreuse + permet early-fail rapide en
          # cas de zombie (vs 60 min précédent qui masquait le problème 1h).
          #
          # Bonus durcissement §7.6 du runbook deploy recovery :
          #   - Early-fail si status `queued` > 5 min consécutives (signe
          #     certain de queue gelée Coolify Horizon dispatcher)
          #   - Dump logs détaillé sur ANY failure mode (vs ancien : seulement
          #     sur `failed|cancelled-by-user`)
          #   - SSH dump disk+docker Hetzner si HETZNER_SSH_KEY présent
          DEADLINE=$((SECONDS + 1500))  # 25 min
          POLL_INTERVAL=30  # poll plus rapide pour early-fail efficace
          QUEUED_STREAK=0
          QUEUED_MAX=10  # 10 polls × 30s = 5 min queued = considéré gelé

          dump_failure_logs() {
            local response="$1"
            local reason="$2"
            echo "::error::Deployment ${reason}"
            echo "──── Coolify deployment logs (last 200 entries) ────"
            echo "${response}" \
              | jq -r '.logs | fromjson? // . | if type=="array" then .[-200:] else [] end | .[] | "[\(.order // "?")] \(.type // "?"): \(.output // "")"' \
              2>/dev/null || echo "(could not parse logs)"
            echo "──── End logs ────"
            # SSH dump si HETZNER_SSH_KEY accessible (même job depuis Setup SSH)
            if [ -n "${HETZNER_SSH_KEY:-}" ]; then
              echo "──── Hetzner state SSH dump ────"
              mkdir -p ~/.ssh
              echo "$HETZNER_SSH_KEY" > ~/.ssh/id_rsa
              chmod 600 ~/.ssh/id_rsa
              ssh-keyscan -H -T 5 178.105.55.15 >> ~/.ssh/known_hosts 2>/dev/null || true
              ssh -o BatchMode=yes -o ConnectTimeout=8 root@178.105.55.15 'echo "=== DISK ===" ; df -h / ; echo "=== DOCKER PS ===" ; docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" | head -25 ; echo "=== DOCKER DF ===" ; docker system df ; echo "=== AXION CONTAINER LOGS (last 80) ===" ; docker ps -a --format "{{.Names}}" | grep -i axion | head -3 | xargs -I {} docker logs --tail 30 {} 2>&1' 2>&1 | tail -80 || echo "(ssh failed)"
              echo "──── End SSH dump ────"
            else
              echo "(HETZNER_SSH_KEY absent — pas de SSH dump. set via: gh secret set HETZNER_SSH_KEY < ~/.ssh/id_rsa)"
            fi
          }

          while [ $SECONDS -lt $DEADLINE ]; do
            RESPONSE=$(curl -fsSL -m 15 \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_URL}/api/v1/deployments/${DEPLOYMENT_UUID}" 2>/dev/null || true)
            STATUS=$(echo "${RESPONSE}" | jq -r '.status // empty' 2>/dev/null || true)
            CREATED=$(echo "${RESPONSE}" | jq -r '.created_at // empty' 2>/dev/null || true)
            FINISHED=$(echo "${RESPONSE}" | jq -r '.finished_at // empty' 2>/dev/null || true)
            echo "[$(date +%H:%M:%S)] status=${STATUS} created=${CREATED} finished=${FINISHED} (poll=${SECONDS}s/${POLL_INTERVAL}s interval, deadline=$((DEADLINE - SECONDS))s remaining)"
            case "${STATUS}" in
              finished)
                echo "Deployment succeeded ✓ (durée totale: ${SECONDS}s)"
                exit 0
                ;;
              failed|cancelled-by-user|cancelled)
                dump_failure_logs "${RESPONSE}" "${STATUS}"
                exit 1
                ;;
              queued)
                QUEUED_STREAK=$((QUEUED_STREAK + 1))
                if [ $QUEUED_STREAK -ge $QUEUED_MAX ]; then
                  echo "::error::Deployment stuck `queued` ${QUEUED_STREAK} polls consécutives (~5 min) — Coolify queue gelée probable (cause #2 §1.5 runbook)."
                  dump_failure_logs "${RESPONSE}" "queue-stuck-5min"
                  echo "::error::Action recommandée : gh workflow run coolify-diagnose.yml -f action=cancel-stuck"
                  exit 1
                fi
                sleep $POLL_INTERVAL
                ;;
              in_progress)
                QUEUED_STREAK=0  # reset si on a vu un in_progress
                sleep $POLL_INTERVAL
                ;;
              "")
                echo "::warning::Empty status from API (retrying)"
                sleep $POLL_INTERVAL
                ;;
              *)
                echo "::warning::Unknown status '${STATUS}' (retrying)"
                sleep $POLL_INTERVAL
                ;;
            esac
          done
          echo "::error::Deployment timeout (25 min)"
          dump_failure_logs "${RESPONSE:-{}}" "timeout-25min"
          exit 1

      - name: Purge Cloudflare cache (post-deploy)
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "::warning::Skipping CF purge — secrets not set"; exit 0
          fi
          echo "Purging Cloudflare cache for zone ${CLOUDFLARE_ZONE_ID}…"
          response=$(curl -fsSL -m 30 -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache")
          echo "${response}" | grep -q '"success":true' || {
            echo "::error::CF purge failed: ${response}"
            exit 1
          }
          echo "Cloudflare cache purged ✓"

  # ───────────────────────────────────────────────────────────────────────
  # Lighthouse CI hard fail post-deploy — Audit E2E 2026-05-11 P0-CONF-17.
  # AGENTS.md déclare « Lighthouse CI gate les PR » mais `pnpm lhci` n'était
  # câblé nulle part. Cette gate :
  #   - hit la prod live (post-purge CF, donc HTML frais)
  #   - 5 URLs stratégiques (FR home, EN home, /audit, /reserver, /paris)
  #   - assertions strictes via lighthouserc.json (budgets LCP/INP/CLS/TBT)
  #   - hard fail si budgets dépassés → bloque le verdict de la pipeline
  #
  # En cas de fail isolé sans régression code (CrUX bruit, latence Hetzner),
  # workflow_dispatch permet de re-trigger après stabilisation. Si un
  # incident persistant survient, désactiver `if: success()` ici en attendant
  # le fix puis ouvrir une issue tag `lhci-flake`.
  lhci:
    name: Lighthouse CI post-deploy gate
    needs: deploy
    # Skip explicitement si deploy a été skip (workflow_dispatch + skip_deploy=true).
    # `if: success()` ne suffit pas car skipped est considéré comme success.
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install LHCI + deps
        run: pnpm install --frozen-lockfile --filter . --prod=false

      - name: Run lhci collect + assert (prod URLs)
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        # Audit A1 P2-5 (2026-05-15) — `pnpm exec lhci` au lieu de
        # `npx --yes @lhci/cli@0.15`. @lhci/cli déjà installé via
        # `pnpm install --frozen-lockfile --filter . --prod=false` ci-dessus.
        run: |
          set -euo pipefail
          # Hit la prod live (déploiement validé par steps deploy précédent).
          # `/en` retiré 2026-05-16 : EN locale désactivé (cf. AGENTS.md
          # "EN re-enable procedure"), `/en` répond 301 → /fr, ce qui faisait
          # fail le LHCI gate (SEO penalty pour URL testée qui redirect).
          # Remplacé par `/fr/interventions` = page produit stratégique.
          # Quand EN sera réactivé, restore `--url=https://axion-ia.com/en`.
          URLS=(
            --url=https://axion-ia.com/fr
            --url=https://axion-ia.com/fr/interventions
            --url=https://axion-ia.com/fr/audit
            --url=https://axion-ia.com/fr/reserver
            --url=https://axion-ia.com/fr/implantations/ile-de-france/paris
          )
          LH_SETTINGS=(--settings.preset=desktop --settings.throttlingMethod=devtools)

          # ── Warm-up anti cold-start CLS (2026-06-10) ───────────────────────
          # Juste après un deploy, le conteneur + le cache Cloudflare sont
          # froids : le tout premier chargement sert les polices web (Fraunces)
          # à froid → FOUT/swap du hero → CLS transitoire (~0.09 mesuré sur
          # /fr/audit, 0 à chaud — vérifié au navigateur). Les vrais visiteurs
          # n'en voient rien (HTML + polices servis depuis le cache CF). On fait
          # donc UNE passe navigateur jetable qui amorce conteneur + CF (HTML,
          # JS, polices), on jette son rapport, puis on MESURE à chaud. Sans ça,
          # le gate clignotait rouge ~5/7 deploys sur du bruit cold-start, ce
          # qui masquait les vraies régressions Web Vitals.
          pnpm exec lhci collect "${URLS[@]}" --numberOfRuns=1 "${LH_SETTINGS[@]}" || true
          rm -rf .lighthouseci

          # Mesure réelle (à chaud) + assertions strictes (lighthouserc.json).
          pnpm exec lhci collect "${URLS[@]}" --numberOfRuns=2 "${LH_SETTINGS[@]}"
          pnpm exec lhci assert
