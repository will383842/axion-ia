name: Content-Gen · Seed (providers + 747 keywords + content templates)

# Pipeline content-gen seed post-deploy :
#   1. Wait container restart (Coolify redeploy ~3 min)
#   2. Poll DB ready (post-migration) — via le container WEB (a le client Prisma)
#   3. Run `tsx prisma/seeds/content-gen/index.ts` via docker exec dans le
#      container WORKER (Dockerfile.worker — seul à embarquer `src/` + `tsx`)
#      → upsert ProviderConfig + CoverageDistributionProfile + AudienceMixProfile
#                + AuthorProfile + BannedPhrase + ContentTemplate + ContentGenConfig
#                + CoverageCampaign + RssSource + CaseStudy + Keyword (747 seeds)
#
# Idempotent : tous les seeds utilisent upsert. Re-run safe.
#
# ⚠️ P0-1 (audit content-gen 2026-06-15) — Le seed s'exécutait dans le container
# WEB (image standalone slim), qui NE contient PAS `src/` ni `tsx`/`pnpm` : le
# seed importe `../../../src/...` → échec silencieux (`|| echo SEED_FAILED`) →
# DB jamais amorcée → assertKbReady fait échouer tous les jobs content-gen.
# Fix : exécuter le seed dans le container WORKER (qui a src/+tsx) et FAIRE
# ÉCHOUER le job si le seed rate (plus de silence). Le seed écrit dans la même
# DB Postgres quel que soit le container → routage 100% safe.
# Pré-requis : secret `COOLIFY_WORKER_APP_UUID` + app worker Coolify up (cf. P0-2).
#
# Déclenchements :
#   - Automatique : après chaque deploy réussi de deploy-coolify.yml
#   - Manuel : GitHub Actions → Run workflow (Will trigger ad hoc)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (affiche plan, pas d'écriture DB)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

  workflow_run:
    workflows: ["Build & Deploy · GHCR + Coolify (axion-ia.com)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  seed:
    name: Seed content-gen (providers + keywords + templates)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if [ -z "${HETZNER_SSH_KEY:-}" ]; then
            echo "::error::Secret HETZNER_SSH_KEY manquant."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -T 8 178.105.55.15 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o BatchMode=yes -o ConnectTimeout=10 root@178.105.55.15 'echo SSH_OK'

      - name: Wait for container restart after deploy
        if: github.event_name == 'workflow_run'
        run: |
          echo "⏳ Attente 3 min pour que Coolify redémarre le container…"
          sleep 180
          echo "✓ Prêt."

      - name: Find axion-ia container
        id: container
        env:
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          ROWS=$(ssh -o BatchMode=yes root@178.105.55.15 \
            'docker ps --format "{{.Names}}|{{.Status}}"' 2>&1)
          NAME=$(echo "$ROWS" | awk -F'|' -v uuid="$COOLIFY_APP_UUID" \
            '$1 ~ "^"uuid {print $1; exit}')
          if [ -z "$NAME" ]; then
            echo "::error::Container $COOLIFY_APP_UUID introuvable."
            echo "$ROWS"; exit 1
          fi
          echo "✓ Container: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Pre-check Keyword count
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          echo "── Counts AVANT seed ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' node -e \
            \"try{const{PrismaClient}=require('/app/prisma/generated/client');
            const p=new PrismaClient();
            Promise.all([p.keyword.count(),
              p.providerConfig.count(),
              p.contentTemplate.count()
            ]).then(([k,pc,ct])=>{
              console.log('Keyword:',k,'| ProviderConfig:',pc,'| ContentTemplate:',ct);
              process.exit(0);
            }).catch((e)=>{console.log('pre-check skip:',e.message.slice(0,80));process.exit(0);});}
            catch(e){console.log('pre-check skip:',e.message.slice(0,60));process.exit(0);}\"" 2>&1 || true

      - name: Attendre que la DB soit prête
        if: inputs.dry_run != 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          echo "⏳ Poll DB (max 3 min)…"
          for i in $(seq 1 18); do
            READY=$(ssh -o BatchMode=yes root@178.105.55.15 \
              "docker exec '$CONTAINER' node -e \
              \"const {PrismaClient}=require('/app/prisma/generated/client');
              const p=new PrismaClient();
              p.providerConfig.count()
                .then(()=>{console.log('READY');process.exit(0)})
                .catch(()=>process.exit(1))\"" 2>/dev/null || true)
            if [ "$READY" = "READY" ]; then
              echo "✓ DB prête (tentative $i)"
              break
            fi
            echo "  [$i/18] DB pas encore prête, attente 10s…"
            sleep 10
          done

      - name: "[DRY RUN] Afficher le plan"
        if: inputs.dry_run == 'true'
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          echo "::notice::DRY_RUN — pnpm content-gen:seed (idempotent upsert)"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' ls /app/prisma/seeds/content-gen/ 2>/dev/null" 2>&1 || true

      - name: Find axion-ia WORKER container (seed target)
        id: worker_container
        if: inputs.dry_run != 'true'
        env:
          COOLIFY_WORKER_APP_UUID: ${{ secrets.COOLIFY_WORKER_APP_UUID }}
        run: |
          set -euo pipefail
          # P0-1 : le seed DOIT tourner dans le container worker (Dockerfile.worker),
          # seul à embarquer src/ + tsx. Le container web slim ne peut pas l'exécuter.
          if [ -z "${COOLIFY_WORKER_APP_UUID:-}" ]; then
            echo "::error::Secret COOLIFY_WORKER_APP_UUID manquant — impossible de seeder."
            echo "::error::Le seed content-gen exige le container worker (src/+tsx)."
            echo "::error::Active-le : gh secret set COOLIFY_WORKER_APP_UUID --body '<uuid-app-worker>' (+ app worker Coolify up, cf. P0-2)."
            exit 1
          fi
          ROWS=$(ssh -o BatchMode=yes root@178.105.55.15 \
            'docker ps --format "{{.Names}}|{{.Status}}"' 2>&1)
          NAME=$(echo "$ROWS" | awk -F'|' -v uuid="$COOLIFY_WORKER_APP_UUID" \
            '$1 ~ "^"uuid {print $1; exit}')
          if [ -z "$NAME" ]; then
            echo "::error::Container worker $COOLIFY_WORKER_APP_UUID introuvable (app worker Coolify down ou non créée — cf. P0-2)."
            echo "$ROWS"; exit 1
          fi
          echo "✓ Worker container: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Exécuter le seed content-gen (container worker)
        if: inputs.dry_run != 'true'
        env:
          WORKER_CONTAINER: ${{ steps.worker_container.outputs.name }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          echo "── Seed content-gen (providers + 747 keywords + templates) ──"
          # Exécution dans le container WORKER : tsx + src/ présents (Dockerfile.worker).
          # `set -e` côté distant → tout échec du seed remonte en exit ≠ 0 et FAIT
          # ÉCHOUER le job (plus de `|| echo SEED_FAILED` qui masquait l'échec).
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$WORKER_CONTAINER' sh -ec \
            'cd /app && node_modules/.bin/tsx prisma/seeds/content-gen/index.ts'" 2>&1
          echo "── Seed terminé avec succès ──"

      - name: Post-check Keyword count
        if: always()
        env:
          CONTAINER: ${{ steps.container.outputs.name }}
        run: |
          echo "── Counts APRÈS seed ──"
          ssh -o BatchMode=yes root@178.105.55.15 \
            "docker exec '$CONTAINER' node -e \
            \"try{const{PrismaClient}=require('/app/prisma/generated/client');
            const p=new PrismaClient();
            Promise.all([p.keyword.count(),
              p.providerConfig.count(),
              p.contentTemplate.count(),
              p.bannedPhrase.count()
            ]).then(([k,pc,ct,bp])=>{
              console.log('Keyword:',k,'| ProviderConfig:',pc,'| ContentTemplate:',ct,'| BannedPhrase:',bp);
              if (k < 700) console.log('WARNING: Keyword count <700 (expected ~747)');
              else console.log('OK: Keyword count >=700');
              process.exit(0);
            }).catch((e)=>{console.log('post-check skip:',e.message.slice(0,80));process.exit(0);});}
            catch(e){console.log('post-check skip:',e.message.slice(0,60));process.exit(0);}\"" 2>&1 || true
