# Rotation du mot de passe Redis de production.
#
# 🔑 CE QU'IL A FALLU DEUX HEURES POUR COMPRENDRE (2026-09-22).
# `PATCH /api/v1/databases/{uuid}` avec `{"redis_password": …}` répond **200 et
# n'écrit rien**. Ce n'est pas un caprice de l'API : dans le modèle
# `StandaloneRedis`, `redis_password` est un **attribut calculé en LECTURE
# SEULE** — un `Attribute` avec un `get` et pas de `set` (ligne 395) — qui va
# lire la variable d'environnement `REDIS_PASSWORD` de la ressource. La colonne
# n'existe même pas en base : une écriture directe rend
# « column "redis_password" of relation "standalone_redis" does not exist ».
# Le contrôleur, lui, liste le champ dans ses `$allowedFields` et le documente
# dans son schéma OpenAPI. **L'API expose donc un champ qu'elle ne peut
# structurellement pas écrire, et répond 200.**
#
# Quatre lancements ont cru avoir tourné le mot de passe. Aucun ne l'avait fait,
# et le troisième a mis la production en « redis: error » pendant onze minutes.
#
# 🔑 LA BONNE PORTE est `PATCH /api/v1/databases/{uuid}/envs`, qui écrit la
# variable `REDIS_PASSWORD` — celle que l'accesseur lit et que `StartRedis`
# reporte sur la ligne de commande du conteneur. Et cette porte-là se **relit** :
# le GET des variables rend leur valeur, donc l'écriture se PROUVE au lieu de se
# supposer. C'est la première fois de toute cette affaire qu'on dispose d'un
# oracle direct.
#
name: Sécurité · rotation du mot de passe Redis

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Taper exactement TOURNER pour confirmer (les e-mails et les crons seront retardés de quelques minutes)"
        required: true
        type: string
      redis_uuid:
        description: "UUID de la base Redis dans Coolify (= son nom d'hôte)"
        required: true
        default: "hdfknlij6yqebr09p379m9q6"
        type: string
      etat_de_depart:
        description: "sain = refuser de tourner si Redis ne répond pas déjà (défaut). deja-en-panne = RÉPARER un désaccord en cours."
        required: true
        default: "sain"
        type: choice
        options:
          - sain
          - deja-en-panne

permissions:
  contents: read

jobs:
  tourner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ── 1. PRÉAMBULE : tout vérifier AVANT de rien changer ──────────────
      - name: Confirmation explicite
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "TOURNER" ]; then
            echo "::error::Confirmation absente ou incorrecte. Rien n'a été modifié."
            exit 1
          fi

      - name: Les quatre accès existent
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WORKER_APP_UUID: ${{ secrets.COOLIFY_WORKER_APP_UUID }}
        run: |
          set -euo pipefail
          for v in COOLIFY_API_TOKEN COOLIFY_URL COOLIFY_APP_UUID COOLIFY_WORKER_APP_UUID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret $v absent. Rien n'a été modifié."
              exit 1
            fi
          done
          echo "Les quatre secrets sont présents."

      - name: La base Redis existe et l'API accepte de l'écrire
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          REDIS_UUID: ${{ inputs.redis_uuid }}
        run: |
          set -euo pipefail
          code=$(curl -sS -m 20 -o /tmp/db -w "%{http_code}" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${COOLIFY_URL}/api/v1/databases/${REDIS_UUID}")
          if [ "$code" != "200" ]; then
            echo "::error::La base ${REDIS_UUID} est introuvable (HTTP $code). Rien n'a été modifié."
            exit 1
          fi
          # 🔴 CE CONTRÔLE A DÉJÀ ÉTÉ FAUX DEUX FOIS, et les deux erreurs sont la
          # même erreur : chercher la preuve d'une ÉCRITURE dans une LECTURE.
          #   • run 35703761957 — exigeait « redis_password » dans la réponse GET.
          #     Une API ne rend jamais un champ secret : le workflow refusait de
          #     tourner pour une raison inexistante.
          #   • run 35720918385 — exigeait que `config_hash` bouge après le PATCH.
          #     Il ne bouge pas : cette route ne le recalcule pas. Le PATCH, lui,
          #     **avait bien écrit** (`$database->update($request->all())`,
          #     DatabasesController::update_by_uuid). La garde a donc déclaré un
          #     échec sur une écriture réussie — le pire des deux mondes, car elle
          #     a laissé le mot de passe stocké et le conteneur en désaccord.
          #
          # 🔑 La bonne preuve est ailleurs, et elle est SPÉCIFIQUE à cette API :
          # Coolify refuse tout champ hors liste blanche par un **422 « This field
          # is not allowed »**, AVANT la moindre écriture. Donc si — et seulement
          # si — on constate en direct que l'API sait dire 422 sur un nom
          # inventé, alors un 200 sur `redis_password` prouve que le champ a été
          # accepté. C'est ce que fait le canari ci-dessous. Il n'écrit rien :
          # il est rejeté par construction.
          type_base=$(jq -r '.database_type // "inconnu"' /tmp/db)
          case "$type_base" in
            *redis*) : ;;
            *) echo "::error::La base ${REDIS_UUID} est de type « $type_base », pas redis. Rien n'a été modifié."; exit 1 ;;
          esac
          code_canari=$(curl -sS -m 30 -o /tmp/canari -w "%{http_code}" -X PATCH             -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Content-Type: application/json"             -d '{"champ_qui_n_existe_pas_canari": "x"}'             "${COOLIFY_URL}/api/v1/databases/${REDIS_UUID}")
          if [ "$code_canari" != "422" ]; then
            echo "::error::Canari : un champ inventé a reçu $code_canari au lieu de 422."
            echo "::error::Cette API n'écarte donc PAS les champs inconnus, et un 200 sur"
            echo "::error::« redis_password » ne prouverait rien. Rien n'a été modifié."
            echo "::error::Réponse : $(head -c 300 /tmp/canari)"
            exit 1
          fi
          echo "Base Redis trouvée (type $type_base). Canari : l'API rend bien 422 sur un champ inconnu."

          # 🔴 PIÈGE VOISIN, lu dans StartRedis::generate_environment_variables.
          # Si la ressource Redis porte une variable « REDIS_PASSWORD » **partagée**
          # (`is_shared`), Coolify fait l'inverse de ce qu'on attend au démarrage :
          # il ÉCRASE `redis_password` avec la valeur de la variable. Notre écriture
          # serait donc défaite au restart, Redis repartirait sur un autre mot de
          # passe que celui donné aux applications, et on ne s'en apercevrait qu'à
          # la panne. On regarde AVANT.
          code_envs=$(curl -sS -m 20 -o /tmp/envs -w "%{http_code}"             -H "Authorization: Bearer ${COOLIFY_API_TOKEN}"             "${COOLIFY_URL}/api/v1/databases/${REDIS_UUID}/envs" || echo 000)
          if [ "$code_envs" = "200" ]; then
            partagee=$(jq -r '[.[] | select(.key=="REDIS_PASSWORD" and (.is_shared==true))] | length' /tmp/envs 2>/dev/null || echo 0)
            if [ "${partagee:-0}" != "0" ]; then
              echo "::error::La base porte une variable REDIS_PASSWORD PARTAGÉE. Au redémarrage,"
              echo "::error::Coolify écraserait le mot de passe qu'on vient d'écrire avec la sienne."
              echo "::error::Il faut tourner la variable partagée, pas le champ. Rien n'a été modifié."
              exit 1
            fi
            echo "Aucune variable REDIS_PASSWORD partagée : le champ fera autorité au démarrage."
          else
            echo "::notice::Liste des variables de la base indisponible (HTTP $code_envs)."
            echo "::notice::Le cas « REDIS_PASSWORD partagée » n'a pas pu être écarté d'avance ;"
            echo "::notice::il reste couvert par la vérification healthz de la dernière étape."
          fi

      - name: Santé de DÉPART (le témoin de la comparaison finale)
        env:
          ETAT_DE_DEPART: ${{ inputs.etat_de_depart }}
        run: |
          set -euo pipefail
          # 🔑 Sans cette mesure, un « redis: ok » à l'arrivée ne prouverait rien :
          # il faut savoir que c'était ok AVANT, sinon on ne sait pas si on a
          # réparé, cassé, ou rien fait du tout.
          sante=$(curl -sS -m 20 https://axion-ia.com/api/healthz || echo '{}')
          echo "healthz avant : $sante"
          etat=$(echo "$sante" | jq -r '.redis // "absent"')
          if [ "$etat" = "ok" ]; then
            echo "Redis répond avant la rotation : la comparaison finale aura un témoin."
            exit 0
          fi
          # 🔴 CETTE GARDE A BLOQUÉ SA PROPRE RÉPARATION (run 35729601528, 22/09).
          # Elle refuse de tourner un mot de passe sur un système en panne — c'est
          # juste quand on rote par hygiène, et exactement faux quand la panne EST
          # un désaccord de mot de passe : le seul remède est alors de réécrire la
          # même valeur aux trois endroits, c'est-à-dire de relancer ce workflow.
          #
          # 🔑 Une garde qui ne peut pas être levée délibérément n'est pas une
          # garde, c'est une impasse. On la lève par une DÉCLARATION explicite,
          # pas par un contournement : l'opérateur dit dans quel état il trouve le
          # système, et le journal garde cette déclaration.
          if [ "${ETAT_DE_DEPART}" = "deja-en-panne" ]; then
            echo "::warning::Redis répond « $etat » et le lancement déclare « déjà en panne »."
            echo "::warning::Mode RÉPARATION : on réécrit la même valeur aux trois endroits."
            exit 0
          fi
          echo "::error::Redis n'est PAS sain avant la rotation (« $etat »). On ne tourne pas un"
          echo "::error::mot de passe sur un système déjà en panne : on ne saurait plus quoi"
          echo "::error::attribuer à quoi. Si la panne EST le mot de passe, relancer avec"
          echo "::error::etat_de_depart = deja-en-panne."
          exit 1

      # ── 2. LE MOT DE PASSE, FABRIQUÉ ICI ────────────────────────────────
      - name: Fabriquer le nouveau mot de passe (jamais affiché)
        id: secret
        run: |
          set -euo pipefail
          # 64 caractères alphanumériques : même forme que celui de Coolify, et
          # aucun caractère qui demanderait un échappement dans une URL — un
          # arobase, un deux-points ou une barre couperait la chaîne en deux.
          #
          # 🔴 PAS DE TUYAU ICI, ET C'EST LE FOND DU CORRECTIF (run 35711230444).
          # `tr -dc … </dev/urandom | head -c 64` échoue sous `pipefail` : `head`
          # ferme le tuyau dès le 64ᵉ caractère, `tr` reçoit un « broken pipe »,
          # et le code de sortie du tuyau devient celui de `tr`. Le mot de passe
          # était pourtant CORRECTEMENT fabriqué — l'échec portait sur la
          # plomberie, pas sur le résultat.
          #
          # 🔑 `openssl rand -hex 32` rend 64 caractères hexadécimaux en une
          # seule commande : pas de tuyau, pas de signal, 256 bits d'entropie.
          nouveau=$(openssl rand -hex 32)
          if [ "${#nouveau}" -ne 64 ]; then
            echo "::error::Génération ratée (${#nouveau} caractères). Rien n'a été modifié."
            exit 1
          fi
          echo "::add-mask::$nouveau"
          echo "mdp=$nouveau" >> "$GITHUB_OUTPUT"
          echo "Mot de passe fabriqué : 64 caractères alphanumériques (masqué)."

      # ── 3. ÉCRITURE : Redis d'abord, puis les deux applications ─────────
      - name: Écrire le mot de passe — dans la VARIABLE, et le relire
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          REDIS_UUID: ${{ inputs.redis_uuid }}
          MDP: ${{ steps.secret.outputs.mdp }}
        run: |
          set -euo pipefail
          # On écrit la VARIABLE `REDIS_PASSWORD`, pas le champ `redis_password`
          # du modèle : ce dernier est un accesseur en lecture seule (voir l'en-tête
          # du fichier). C'est la variable que l'accesseur lit et que `StartRedis`
          # reporte sur la ligne de commande du conteneur.
          payload=$(jq -nc --arg v "$MDP" '{
            key: "REDIS_PASSWORD", value: $v,
            is_preview: false, is_literal: false, is_multiline: false, is_shown_once: false
          }')
          code=$(curl -sS -m 30 -o /tmp/resp -w "%{http_code}" -X PATCH             -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Content-Type: application/json"             -d "$payload" "${COOLIFY_URL}/api/v1/databases/${REDIS_UUID}/envs")
          if [ "${code:0:1}" != "2" ]; then
            # La variable n'existe peut-être pas encore : on la crée.
            code=$(curl -sS -m 30 -o /tmp/resp -w "%{http_code}" -X POST               -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Content-Type: application/json"               -d "$payload" "${COOLIFY_URL}/api/v1/databases/${REDIS_UUID}/envs")
          fi
          if [ "${code:0:1}" != "2" ]; then
            echo "::error::Écriture de REDIS_PASSWORD refusée (HTTP $code) : $(head -c 300 /tmp/resp)"
            echo "::error::Rien d'autre n'a été modifié."
            exit 1
          fi

          # 🔑 ON RELIT, ET C'EST LE PREMIER ORACLE DIRECT DE TOUTE CETTE AFFAIRE.
          # Le GET des variables rend leur valeur : on peut donc comparer ce qui
          # est stocké à ce qu'on a envoyé. Un 200 ne prouve rien — quatre
          # lancements l'ont démontré. Une relecture, si.
          # On compare des EMPREINTES : la valeur ne s'imprime jamais, et un
          # message d'erreur qui recopierait une requête SQL a déjà suffi une fois
          # à exposer un mot de passe de production.
          sleep 2
          curl -sS -m 25 -o /tmp/envs.json             -H "Authorization: Bearer ${COOLIFY_API_TOKEN}"             "${COOLIFY_URL}/api/v1/databases/${REDIS_UUID}/envs"
          stocke=$(jq -r '[.[] | select(.key == "REDIS_PASSWORD")][0].value // ""' /tmp/envs.json)
          if [ -z "$stocke" ]; then
            echo "::error::Relecture impossible : l'API ne rend pas la valeur de REDIS_PASSWORD."
            echo "::error::Clés rendues : $(jq -r '[.[].key] | join(",")' /tmp/envs.json | head -c 300)"
            echo "::error::Sans relecture on ne PROUVE pas l'écriture, et c'est exactement"
            echo "::error::l'erreur qui a coûté onze minutes de production le 22/09. On s'arrête."
            exit 1
          fi
          a=$(printf '%s' "$stocke" | sha256sum | cut -c1-12)
          b=$(printf '%s' "$MDP" | sha256sum | cut -c1-12)
          if [ "$a" != "$b" ]; then
            echo "::error::La valeur stockée ($a) n'est pas celle envoyée ($b)."
            echo "::error::L'API a répondu $code sans écrire. Rien d'autre n'a été modifié."
            exit 1
          fi
          echo "REDIS_PASSWORD écrit ET relu : empreintes identiques ($a)."

      - name: Écrire REDIS_URL dans le SITE et le WORKER
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WORKER_APP_UUID: ${{ secrets.COOLIFY_WORKER_APP_UUID }}
          REDIS_UUID: ${{ inputs.redis_uuid }}
          MDP: ${{ steps.secret.outputs.mdp }}
        run: |
          set -euo pipefail
          url="redis://default:${MDP}@${REDIS_UUID}:6379/0"
          echo "::add-mask::$url"
          # ⚠️ is_preview:false — on ne touche jamais la ligne Preview, comme
          # pour le jeton Calendly : un déploiement éphémère n'a rien à faire
          # dans le Redis de production.
          payload=$(jq -nc --arg value "$url" '{
            key: "REDIS_URL",
            value: $value,
            is_preview: false,
            is_literal: false,
            is_multiline: false,
            is_shown_once: false
          }')
          ecrire() {
            local uuid="$1" nom="$2" code
            code=$(curl -sS -m 20 -o /tmp/resp -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Content-Type: application/json" \
              -d "$payload" "${COOLIFY_URL}/api/v1/applications/${uuid}/envs")
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then echo "$nom : écrit ($code)"; return 0; fi
            code=$(curl -sS -m 20 -o /tmp/resp -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Content-Type: application/json" \
              -d "$payload" "${COOLIFY_URL}/api/v1/applications/${uuid}/envs")
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then echo "$nom : créé ($code)"; return 0; fi
            echo "::error::$nom : écriture impossible ($code) : $(head -c 300 /tmp/resp)"
            return 1
          }
          # 🔴 Les DEUX ou rien. Si la seconde échoue, on le dit très fort : le
          # système est alors dans l'état le plus dangereux — Redis a un nouveau
          # mot de passe, une seule application le connaît.
          ecrire "$COOLIFY_APP_UUID" "site"
          if ! ecrire "$COOLIFY_WORKER_APP_UUID" "worker"; then
            echo "::error::ÉTAT INCOHÉRENT : le site a la nouvelle URL, pas le worker."
            echo "::error::Relancer ce workflow immédiatement, ou corriger le worker à la main."
            exit 1
          fi

      # ── 4. APPLIQUER, puis MESURER ──────────────────────────────────────
      - name: Redémarrer Redis et redéployer les deux applications
        id: appliquer
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WORKER_APP_UUID: ${{ secrets.COOLIFY_WORKER_APP_UUID }}
          REDIS_UUID: ${{ inputs.redis_uuid }}
        run: |
          set -euo pipefail
          # 🔴 CE BLOC A DÉJÀ ÉCHOUÉ EN SILENCE (run 35728174752, 22/09). Les trois
          # appels partaient en GET, Coolify répondait **405** aux trois, et le
          # `|| true` avalait tout : rien n'a redémarré, et l'étape suivante a
          # déclaré la rotation réussie quinze secondes plus tard.
          #
          # 🔑 La réponse était DÉJÀ dans le dépôt : `deploy-coolify.yml` porte
          # depuis le 28/08 le commentaire « /api/v1/deploy est passé de GET à
          # POST … répond 405 sur un GET ». On copie donc l'appel qui marche, et
          # surtout : **plus un seul `|| true` sur un appel qui modifie**.
          echo "── Redis (Stop + Start : le mot de passe stocké est relu au démarrage)"
          code=$(curl -sS -m 30 -o /tmp/r -w "%{http_code}" -X POST             -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Accept: application/json"             "${COOLIFY_URL}/api/v1/databases/${REDIS_UUID}/restart")
          if [ "${code:0:1}" != "2" ]; then
            echo "::error::Redémarrage de Redis refusé (HTTP $code) : $(head -c 300 /tmp/r)"
            echo "::error::Le mot de passe stocké et les URL des applications ont changé,"
            echo "::error::mais RIEN n'a redémarré. Le service tourne encore sur l'ancien"
            echo "::error::mot de passe : tout fonctionne, et le prochain déploiement casserait."
            echo "::error::Relancer ce workflow dès que la cause du refus est levée."
            exit 1
          fi
          echo "restart Redis → $code"

          echo "── Applications (deploy, PAS restart : Restart ne recharge pas les variables)"
          # 🔑 La fonction n'écrit PAS son résultat sur la sortie standard, et
          # personne ne la met dans un tuyau : `x=$(f | tail -1)` rend le code de
          # sortie de `tail`, donc **zéro**, quoi qu'ait fait `f`. C'est la même
          # famille d'erreur que le `|| true` d'hier — un échec qui traverse la
          # garde sans la faire rougir.
          deployer() {
            uuid="$1"; nom="$2"
            rep=$(curl -sS -m 30 -X POST               -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Accept: application/json"               --data-urlencode "uuid=${uuid}" --data-urlencode "force=true"               "${COOLIFY_URL}/api/v1/deploy")
            du=$(printf '%s' "$rep" | grep -oE '"deployment_uuid":"[^"]+"' | head -1 | cut -d'"' -f4 || true)
            if [ -z "$du" ]; then
              echo "::error::$nom : Coolify n'a pas rendu de deployment_uuid : $(printf '%s' "$rep" | head -c 300)"
              echo "::error::Redis a redémarré avec le NOUVEAU mot de passe et $nom ne s'est pas"
              echo "::error::redéployé : ce côté-là est en panne. Relancer ce workflow."
              exit 1
            fi
            echo "$nom : déploiement $du"
            printf '%s' "$du" > "/tmp/du_$nom"
          }
          deployer "$COOLIFY_APP_UUID" "site"
          deployer "$COOLIFY_WORKER_APP_UUID" "worker"
          echo "du_site=$(cat /tmp/du_site)" >> "$GITHUB_OUTPUT"
          echo "du_worker=$(cat /tmp/du_worker)" >> "$GITHUB_OUTPUT"

      - name: Vérifier — et échouer FORT si Redis ne répond pas
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          DU_SITE: ${{ steps.appliquer.outputs.du_site }}
          DU_WORKER: ${{ steps.appliquer.outputs.du_worker }}
          REDIS_UUID: ${{ inputs.redis_uuid }}
        run: |
          set -euo pipefail
          # 🔴 LA VÉRIFICATION PRÉCÉDENTE ACCEPTAIT UN « ok » IMMÉDIAT. Elle
          # sondait `healthz` quinze secondes après avoir demandé les
          # redémarrages, et repartait au premier vert — c'est-à-dire sur les
          # conteneurs d'AVANT, qui n'avaient évidemment aucune raison d'être en
          # panne. Une mesure prise avant le changement ne mesure pas le
          # changement.
          #
          # 🔑 On attend donc que les DÉPLOIEMENTS soient terminés, puis on sonde.
          # À ce moment-là `healthz` devient un oracle honnête, et ce n'est pas
          # un hasard : les trois côtés dépendent l'un de l'autre. Si Redis a
          # redémarré sans les applications, elles présentent l'ancien mot de
          # passe et c'est rouge ; si les applications ont redémarré sans Redis,
          # elles présentent le nouveau et c'est rouge aussi. Un vert n'est
          # possible que si les trois portent la même valeur.
          attendre_deploiement() {
            du="$1"; nom="$2"
            for i in $(seq 1 60); do
              etat=$(curl -sS -m 20 -H "Authorization: Bearer ${COOLIFY_API_TOKEN}"                 "${COOLIFY_URL}/api/v1/deployments/${du}" | grep -oE '"status":"[^"]+"' | head -1 | cut -d'"' -f4 || true)
              case "${etat:-inconnu}" in
                finished) echo "$nom : déploiement terminé"; return 0 ;;
                failed|cancelled-by-user)
                  echo "::error::$nom : déploiement $etat."; return 1 ;;
                *) echo "  $nom : $etat…" ;;
              esac
              sleep 15
            done
            echo "::error::$nom : déploiement toujours pas terminé après 15 minutes."
            return 1
          }
          attendre_deploiement "$DU_SITE" "site"
          attendre_deploiement "$DU_WORKER" "worker"

          echo "Trois mesures de santé consécutives, espacées de 20 s."
          verts=0
          for i in $(seq 1 30); do
            sante=$(curl -sS -m 15 https://axion-ia.com/api/healthz || echo '{}')
            etat=$(echo "$sante" | jq -r '.redis // "injoignable"')
            echo "  essai $i : redis=$etat"
            if [ "$etat" = "ok" ]; then verts=$((verts+1)); else verts=0; fi
            if [ "$verts" -ge 3 ]; then
              echo "✅ Rotation terminée. Redis et les deux applications portent le nouveau mot de passe."
              exit 0
            fi
            sleep 20
          done
          echo "::error::L'application ne joint pas Redis de façon stable après les redéploiements."
          echo "::error::Les e-mails et les crons sont ARRÊTÉS. À faire, dans cet ordre :"
          echo "::error::  1. Coolify → application site ET worker → vérifier que REDIS_URL est identique"
          echo "::error::     dans les deux, et que son hôte est bien ${REDIS_UUID} ;"
          echo "::error::  2. Coolify → base Redis → relancer un Restart ;"
          echo "::error::  3. redéployer les DEUX applications (deploy, jamais restart) ;"
          echo "::error::  4. le plus simple : RELANCER CE WORKFLOW. Il refabrique un mot de passe"
          echo "::error::     et le réécrit aux trois endroits — il converge depuis n'importe quel"
          echo "::error::     état incohérent, y compris celui-ci."
          exit 1
