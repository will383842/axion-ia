name: CI · Gates A + B

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  # File de fusion (2026-08-18). SANS ce déclencheur, une file activée attend
  # indéfiniment des checks qui ne se lancent jamais : elle se bloque au premier
  # usage. Il s'ajoute AVANT d'activer la file, jamais après.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Audit A1 P2-4 (2026-05-15) — harmonisation Node 24 (LTS Iron oct 2025)
  # avec nightly.yml + deploy-coolify.yml + prod CPX42. Auparavant 20.18.0,
  # ce qui pouvait masquer des incompatibilités runtime entre CI et prod.
  NODE_VERSION: "24"
  PNPM_VERSION: 10.33.4

# ─────────────────────────────────────────────────────────────────────────────
# POURQUOI B, C ET D N'ATTENDENT PLUS A (2026-08-18)
#
# Les trois portaient `needs: gate-a`. Mesuré sur le run de #717 : A dure
# 16 min 49, puis C démarre et dure 32 min → 49 min de cycle. En parallèle, le
# cycle vaut max(A, C) = 32 min. Dix-sept minutes rendues à CHAQUE passage, et
# le dépôt est PUBLIC : les minutes Actions sont gratuites.
#
# Le `needs` n'était pas une dépendance de données : aucun `needs.<job>.outputs`,
# aucun artefact échangé entre les jobs. C'était de la mise en file, rien d'autre.
#
# Contrepartie assumée : quand A échoue, C et D auront tourné pour rien. En
# échange, une PR cassée rend TOUS ses défauts en une seule passe, au lieu de les
# révéler l'un après l'autre, un cycle de 49 min à la fois.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  gate-a:
    name: Gate A · per-commit
    runs-on: ubuntu-latest
    # 15 → 25 min le 2026-07-29. Ce n'est PAS du confort : le job tournait déjà
    # à 14 min sur `main` — une marge d'une minute — et a commencé à se faire
    # couper en plein vol. Le symptôme est trompeur : GitHub annule l'étape en
    # cours (`use-client justified` selon le run) et marque le job « failed »,
    # ce qui envoie chercher un défaut dans le code alors que TOUTES les
    # vérifications ont réussi. Un run coupé saute aussi les gates suivantes.
    #
    # La cause est structurelle : la suite Vitest grossit (elle a dépassé
    # 20 000 tests), et l'exécuter AVEC couverture est de loin l'étape la plus
    # longue. 25 min redonne une marge réelle sans transformer un job
    # réellement bloqué en attente interminable.
    #
    # Si ce budget redevient juste : ce n'est pas le timeout qu'il faudra
    # remonter une troisième fois, mais la couverture qu'il faudra sortir du
    # chemin critique (job dédié, non bloquant).
    timeout-minutes: 25
    steps:
      # fetch-depth: 0 requis pour gitleaks (diff commit^..HEAD).
      # Sans full history, gitleaks fail avec "ambiguous argument" sur les
      # PRs dont le premier commit a un parent absent du shallow clone
      # (audit V1 image-bank 2026-05-16 PR #14).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Required before any TypeScript step: many imports reference
      # ../prisma/generated/client which is only materialized by prisma generate.
      # Without this, tsc fails with TS2307 "Cannot find module" + cascade of
      # TS7006 implicit-any across all admin features and email templates.
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: TypeScript strict
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      # Sprint S6.3 P1-7 (2026-05-15) — coverage activé en CI (thresholds
      # vitest.config.ts:37-43 statements/branches/functions/lines 60/55/60/60).
      # Bloque la PR si la couverture descend sous les seuils. ~+20s overhead V8
      # vs `vitest run` sec, acceptable pour gate-a (~15min budget total).
      - name: Vitest (with coverage)
        run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 7
      - name: i18n parity
        run: pnpm i18n:check
      - name: Anti-SIREN grep
        run: pnpm anti-siren:check
      - name: Anti-hex grep
        run: pnpm anti-hex:check
      - name: use-client justified
        run: pnpm use-client:check
      # Refonte « Boîte de réception » 2026-07-29 — `buildAdminNav()` est un SSOT
      # de CHAÎNES : rien ne reliait ses href aux fichiers `page.tsx`. Un dossier
      # renommé laissait donc une entrée de menu vers un 404, sans que typecheck
      # ni tests ne bronchent. Ce gate résout chaque href sur le disque.
      - name: Admin nav → routes existantes
        run: pnpm admin-nav:routes-check
      # Audit 2026-05-15 P1-22 — content-gen module isolation gate (§ 4.1bis
      # master prompt). Garantit qu'aucun fichier hors zones whitelisted
      # (src/server/content-gen/**, src/app/[locale]/(admin)/[adminPrefix]/
      # content-gen/**, src/components/admin/content-gen/**, etc.) ne mentionne
      # le marqueur `content-gen` — protège la séparation modulaire qui permet
      # le rollback chirurgical V1 → V2 sans casser le reste du frontend.
      - name: Content-gen isolation check
        run: pnpm content-gen:isolation-check
      # 🔴 2026-08-24 — `qualiopi:isolation-check` existait depuis des mois et
      # n'était appelé PAR RIEN : ni ce workflow, ni un hook. Son en-tête se
      # disait pourtant « câblé dans verify:all + pre-push » — faux pour le hook,
      # et sans effet pour `verify:all`, qui n'a lui-même aucun appelant.
      # Résultat mesurable : 24 violations le 2026-07-30, 58 le 2026-08-24. La
      # garde enregistrait la dérive au lieu de l'arrêter, pendant que
      # `content-gen:isolation-check` juste au-dessus — le seul des trois câblé —
      # tenait 0 violation sur 11 268 fichiers. Une garde qu'on n'exécute pas ne
      # garde rien.
      - name: Qualiopi isolation check
        run: pnpm qualiopi:isolation-check
      # Même histoire, même jour : 31 fichiers signalés, dont 3 seulement
      # portaient un import. Les 28 autres ne faisaient que MENTIONNER le mot —
      # `.env.example` pour une ligne de config, `admin.css` pour des
      # commentaires. La garde promettait de vérifier que le module reste
      # « arrachable » d'un bloc (rollback V1 → V2) ; Will a tranché le
      # 2026-08-24 que ce scénario n'est plus prévu, donc elle surveille
      # désormais les dépendances, comme ses deux voisines.
      - name: Image-bank isolation check
        run: pnpm image-bank:isolation-check
      - name: Zod schemas have tests
        run: pnpm zod:check
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: axionia/.gitleaks.toml

  gate-b:
    name: Gate B · per-PR
    # `merge_group` doit figurer ici : en file de fusion, un job SKIPPÉ sur un
    # contexte EXIGÉ n'est pas un job vert — la file resterait bloquée dessus.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    # 45 → 75 (2026-05-29) : une fois l'ENOSPC résolu (free-disk ci-dessous), le
    # build SSG (17 928 pages) + bundle + E2E + Lighthouse dépassait de peu 45 min.
    #
    # 75 → 90 (2026-08-21) : le plafond de l'étape Playwright passe de 15 à 30 min
    # (voir son commentaire — les deux premiers runs réels ont été coupés). La
    # somme des plafonds d'étapes atteindrait sinon ~74 min sur un job à 75, et un
    # job tué en « cancelled » ne rend AUCUN résultat — c'est déjà arrivé le
    # 2026-05-30 (run 26674394530), Lighthouse jamais lancé.
    timeout-minutes: 90
    # 🔴 BASE DE DONNÉES E2E (2026-08-21) — LE HARNAIS DOIT AVOIR UNE BASE.
    #
    # Quatre specs Playwright (`a11y-admin`, `admin-nav-clic`, `admin-booking-flow`,
    # `qualiopi/vente-parcours`) commencent par un `loginAsAdmin`. Sans base semée,
    # elles se `test.skip` — et un skip n'est pas un vert, c'est une absence de preuve.
    # Pire : `ADMIN_SEED_EMAIL` / `ADMIN_SEED_PASSWORD`, qui les activent, n'étaient
    # définis DANS AUCUN FICHIER du dépôt. Ces quatre specs n'avaient donc jamais
    # exécuté une seule assertion, nulle part.
    #
    # Image alignée sur Gate D : `CREATE EXTENSION vector` est requise par la
    # migration `20260514020000_kb_v4_pgvector_embeddings`.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axion_ia_e2e
          POSTGRES_PASSWORD: ci_password_dummy
          POSTGRES_DB: axion_ia_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axion_ia_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # 🔴 2026-08-21 — SANS REDIS, LA CONNEXION ADMIN EST REFUSÉE, PAS LENTE.
      #
      # `REDIS_URL` vaut `redis://stub.invalid` au niveau du job (ADR 0026, le
      # build ne peut joindre aucun service). `src/lib/redis.ts` rend alors un
      # Proxy qui répond `null` à tout. `checkRateLimit` y voit une PANNE du
      # compteur de tentatives, et `signInAction` applique `surPanne: "refuser"` :
      #
      #     Connexion momentanément indisponible : le compteur de tentatives ne
      #     répond pas. Réessayez dans quelques minutes.
      #
      # C'est la bonne posture — un limiteur de tentatives qui ne compte plus
      # doit fermer, pas ouvrir. Mais en CI, cela refusait **toutes** les
      # connexions admin : 84 échecs sur le run 32506915097, tous lus comme des
      # délais dépassés. J'ai d'abord cru à de la lenteur et porté l'attente de
      # 15 s à 60 s — un cataplasme sur une jambe de bois. C'est le TEXTE DE
      # L'ÉCRAN, que le fixture emporte désormais dans son message d'échec, qui a
      # nommé la cause.
      #
      # 🔑 Un délai dépassé ne dit pas POURQUOI. Sans le texte visible, on
      # allonge des timeouts indéfiniment devant un refus catégorique.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    # Job-level env vars : héritées par TOUS les steps (Build + Playwright
    # webServer + Lighthouse CI). Évite de dupliquer les dummy values dans
    # chaque step et fix le ECONNREFUSED Playwright (le dev server pour
    # webServer démarre dans un sub-process Node qui hérite des env du job).
    env:
      SKIP_ENV_VALIDATION: "true"
      BULLMQ_DISABLED: "true"
      DATABASE_URL: "postgresql://stub:stub@stub.invalid:5432/stub"
      REDIS_URL: "redis://stub.invalid:6379"
      AUTH_SECRET: "ci-dummy-auth-secret-not-used-in-build-32chars-min"
      # 🔴 NextAuth v5 refuse l'hôte tant que ni `AUTH_URL` ni `AUTH_TRUST_HOST`
      # ne sont posés. Le premier run où le serveur a réellement démarré
      # (32447074166) porte **14 136** lignes
      # `UntrustedHost: Host must be trusted. URL was: http://localhost:3000/api/auth/session`.
      #
      # Sans ce drapeau, semer la base ne sert à rien : `loginAsAdmin` échoue
      # quand même, et les quatre specs de console retombent dans le silence du
      # `test.skip` — c'est-à-dire exactement l'état qu'on vient de corriger.
      #
      # Posé au niveau JOB parce que deux étapes démarrent un serveur (Playwright
      # et Lighthouse) et que les deux en ont besoin. `AUTH_URL` n'est
      # volontairement PAS posé : `AUTH_TRUST_HOST` suffit à faire confiance à
      # l'en-tête d'hôte, et une URL codée en dur au niveau du job traverserait
      # aussi l'étape `Build`.
      AUTH_TRUST_HOST: "true"
      ADMIN_URL_PREFIX: "admin-ci-build"
      STRIPE_SECRET_KEY: "sk_test_ci_dummy_not_used_in_build"
      STRIPE_PUBLISHABLE_KEY: "pk_test_ci_dummy_not_used_in_build"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_dummy_not_used_in_build"
      BACKUP_ENCRYPTION_PASSPHRASE: "ci-dummy-backup-pass-not-used-in-build"
      IP_HASH_SALT: "ci-dummy-ip-hash-salt-not-used-in-build-32chars"
      PII_ENCRYPTION_KEY: "ci-dummy-pii-encryption-key-not-used-in-build-32"
      NEXT_PUBLIC_SITE_URL: "https://axion-ia.com"
      NEXT_PUBLIC_APP_ENV: "production"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same rationale as gate-a: prisma client must exist before build/test
      # steps that import @prisma/client / generated types.
      - name: Generate Prisma client
        run: pnpm prisma:generate
      # ORDRE DES ÉTAPES — RÉVISÉ LE 2026-08-21, ET L'ORDRE EST LA CORRECTION.
      #
      #   1. Install Playwright browsers EN PREMIER (résout la dépendance chrome
      #      exigée par puppeteer-core de size-limit pour mesurer DevTools).
      #   2. Build — `next build --webpack`, sur les stubs DATABASE/REDIS du job.
      #   3. Bundle size (`size-limit` seul : il LIT `.next/static`, il n'y touche pas).
      #   4. Garde : `.next/BUILD_ID` existe encore. BLOQUANTE.
      #   5. Playwright suite — `pnpm start`, donc a besoin du build de l'étape 2.
      #
      # ⚠️ 2026-08-24 — LES ÉTAPES 6 ET 7 N'EXISTENT PLUS. « Lighthouse CI » et
      # « Bundle delta vs main » ont été retirées : la première mesurait le
      # runner (11 URL en faute sur 11, quand la prod passe propre), la seconde
      # ne pouvait pas aboutir (build de 8 min sous un cap de 6) et détruisait
      # `.next`. Le pavé qui remplace les deux, en fin de job, porte les mesures.
      # L'ordre reste néanmoins la correction : rien de ce qui écrit dans `.next`
      # ne doit passer devant ce qui le lit.
      #
      # L'ordre précédent plaçait le 7 en position 3. Conséquence mesurée sur le
      # run 32443013208 : `.next` détruit à 03:31:24, et les 237 tests Playwright
      # partis à 03:34:52 contre un serveur qui n'a jamais démarré — 209 échecs,
      # 17 skipped, 11 non joués, ZÉRO passé. Idem pour Lighthouse à 03:40.
      # Reproduit à l'identique sur le run 32440227474.
      #
      # ⚠️ Les commentaires qui accompagnaient ces deux étapes attribuaient l'échec
      # à des causes qui n'existaient pas — « bugs UI réels pas fixés » d'un côté,
      # « le serveur ne bind pas sur loopback en CI » de l'autre. Un gate
      # `continue-on-error` ne dit pas seulement « je ne bloque pas » : il dit
      # « personne ne lit mon résultat », et c'est ainsi qu'un motif inventé tient
      # des mois. Avant de rendre un de ces steps strict, LIRE SON COMPTE DE TESTS.
      # Free disk space avant le build SSG — le runner ubuntu-latest démarre à
      # ~14 GB free, insuffisant depuis les données villes (build + copie
      # standalone .next saturait le disque → « ENOSPC: no space left on device »).
      # Même cleanup que deploy-coolify.yml. (Fix 2026-05-29, aligné PR #45.)
      - name: Free disk space (max headroom)
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/lib/jvm \
            /usr/lib/google-cloud-sdk \
            /usr/lib/firefox \
            /opt/az \
            /opt/microsoft \
            /opt/pipx || true
          # NB : on NE supprime PAS /opt/google — il contient Google Chrome dont
          # `size-limit` (estimo/puppeteer) a besoin pour mesurer le JS au step
          # « Bundle size ». Les suppressions ci-dessus libèrent déjà ~15 GB.
          sudo apt-get clean || true
          df -h /
      - name: Install Playwright browsers (avant build pour chrome dep)
        run: pnpm exec playwright install --with-deps chromium
      # ENOSPC fix 2026-06-21 : la sortie SSG (~18k pages) + la copie `.next/standalone`
      # (qui DUPLIQUE `.next/server`) dépassent les ~15 GB libérés sur `/` (cause du
      # « ENOSPC: no space left on device » à la copie standalone, build pourtant
      # « ✓ Compiled successfully »). On relocalise `.next` sur le 2e disque `/mnt`
      # (~65 GB libres) — symlink transparent pour `next build`. Même philosophie que
      # le data-root `/mnt` de deploy-coolify.yml.
      # IMPORTANT : on utilise un BIND MOUNT, pas un symlink. Un `ln -s .next →
      # /mnt/...` met `.next` HORS de l'arbre repo → Node ne résout plus
      # `node_modules` (racine repo) quand `next build` exécute les routes au
      # « collect page data » (échec « Cannot find module 'argon2' » sur les routes
      # admin natives). Le bind mount garde `.next` comme vrai dossier DANS le repo
      # (résolution modules OK) tout en stockant les Go sur `/mnt` (~65 GB, espace OK).
      - name: Relocate .next to /mnt (bind mount, ENOSPC headroom)
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/axion-next
          rm -rf .next && mkdir -p .next
          sudo mount --bind /mnt/axion-next .next
          sudo chown -R "$(id -u):$(id -g)" .next
          df -h / /mnt
      - name: Build
        # `next build` DIRECT (pas `pnpm build`) pour SKIPPER le `postbuild` :
        # `scripts/precompress-static.ts` (Brotli-11 sur ~18k fichiers SSG) fait
        # dépasser le timeout Gate B, et `indexnow-ping.ts` ne doit JAMAIS tourner
        # en CI (il pingue les moteurs de recherche). La compression .br est
        # refaite au vrai build de déploiement (Dockerfile / GH Actions deploy).
        # Le Gate B ne valide QUE la compilation du build. (Fix 2026-05-29.)
        #
        # NODE_OPTIONS : le webpack compile du SSG (~18k pages) dépassait le heap
        # Node par défaut sur ubuntu-latest → « JavaScript heap out of memory »
        # (cause du Gate B rouge chronique). Env scoppé à CE step uniquement (pas
        # job-level) pour ne pas impacter Playwright/Lighthouse.
        # (Fix OOM Gate B 2026-06-14 — heap posé à 6144, aligné sur le Dockerfile ;
        # désaligné à 8192 le 2026-08-07, motif détaillé juste en dessous.)
        # 🔴 OOM Gate B 2026-08-07 — heap DÉLIBÉRÉMENT désaligné du Dockerfile.
        #
        # Constat : après +1,3 Mo de contenu pédagogique rédigé, ce build nu échoue
        # en « JavaScript heap out of memory » PENDANT LA COMPILATION (~4 min, avant
        # « Compiled successfully »), alors que Gate C — qui exécute le `docker build`
        # du Dockerfile de production, boote le conteneur et vérifie /api/healthz —
        # compile en 4,2 min et passe, au MÊME heap de 6144, sur les MÊMES routes
        # (`BUILD_SSG_VILLES_INDEXABLE_ONLY=true` des deux côtés).
        #
        # Pourquoi on ne remonte PAS le Dockerfile en écho : il est à 6144 parce
        # qu'à 8192, BuildKit se faisait OOM-killer SILENCIEUSEMENT à l'export des
        # layers (~38 min) — 8+ déploiements ratés d'affilée en mai 2026 (cf. le
        # commentaire du Dockerfile, lignes 148-162). Le budget 16 Go y est compté
        # au demi-giga près. Toucher à cette valeur rouvre un trou de production
        # pour réparer un vert de CI : le remède serait pire que le mal.
        #
        # Pourquoi ce n'est PAS un vert trompeur : les deux builds ne valident pas
        # la même chose. Gate B ne vérifie QUE la compilation ; c'est Gate C qui
        # atteste que l'artefact réellement déployé se construit, démarre et répond.
        # La fidélité au déploiement est donc portée par Gate C, aux réglages réels,
        # et elle est verte. Donner ici la marge de compilation ne masque rien.
        #
        # `NEXT_PRIVATE_WORKER_THREADS=1` reste aligné sur le Dockerfile (ligne 164) :
        # les workers parallèles de webpack tiennent chacun leur copie du graphe.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_PRIVATE_WORKER_THREADS: "1"
          # ENOSPC fix 2026-06-22 : aligné sur deploy-coolify.yml + Gate C. Le build de
          # TOUTES les villes par-service en FR ET EN dépassait /mnt à la copie
          # .next/standalone (« ENOSPC » sur /en/sites-web-augmentes/par-ville/...). On
          # build en indexable-only (~1 776 villes), comme l'artefact réellement déployé.
          # Le flag ne gate QUE VilleServicePageTemplate (pages service×ville) : les URLs
          # Lighthouse (pages HUB /implantations/<region>/<ville>) restent construites.
          BUILD_SSG_VILLES_INDEXABLE_ONLY: "true"
        run: pnpm exec next build --webpack
      # ⚠️ Le paragraphe qui suit décrit une intention de 2026-05-22 (« Bundle delta
      # + LHCI passés en STRICT ») que le fichier CONTREDIT depuis : les deux portent
      # `continue-on-error: true`. AGENTS.md a d'ailleurs été corrigé le 2026-08-17
      # sur ce point précis — aucun gate de budget ne bloque une PR. On garde le
      # texte pour la traçabilité, pas comme description de l'état.
      # 🔴 2026-08-24 — CE QUE CETTE ÉTAPE MESURE VRAIMENT, ET CE QU'ELLE A TROUVÉ.
      #
      # NON-BLOQUANT depuis le 2026-05-29. Le motif écrit alors était juste sur un
      # point (« il SOMME tous les `page-*.js` du glob vs une limite par route »)
      # et faux sur la suite : il renvoyait l'autorité per-route à Lighthouse CI,
      # qui ne l'a jamais exercée et qui est retiré depuis (voir le pavé en fin de
      # job). Personne ne mesurait donc le First Load JS par route.
      #
      # L'entrée fautive est corrigée dans `package.json` : elle s'appelle
      # désormais pour ce qu'elle est — un CLIQUET ANTI-CROISSANCE sur la somme,
      # pas un budget par route.
      #
      # ⚠️ ET ELLE A UN VRAI DÉPASSEMENT À MONTRER, resté invisible sous le
      # `continue-on-error` : le SHELL PARTAGÉ pèse **135,78 KB** pour un budget
      # de 100 KB (run 32666732630). Celui-là est honnête — cumulatif comme son
      # nom l'annonce, et dépassé de 35,78 KB. Dette ouverte, cf. `AGENTS.md`.
      #
      # 🔑 Rester en `continue-on-error` est ici un CHOIX, pas un oubli : rendre
      # l'étape bloquante aujourd'hui fermerait toutes les PR jusqu'à ce que le
      # shell repasse sous 100 KB. Le jour où il y repasse, retirer cette ligne
      # est la dernière chose à faire — et alors seulement l'étape gardera.
      - name: Poids du bundle (reporting — AUCUNE gate per-route n'existe, voir AGENTS.md)
        run: pnpm bundle:check
        continue-on-error: true
      # ⚠️ `DATABASE_URL` reste `stub.invalid` AU NIVEAU DU JOB, et ce n'est pas un
      # oubli : le contrat d'ADR 0026 veut que le BUILD tourne sur les stubs Prisma
      # (cf. AGENTS.md, « magic string stub.invalid »). Seules les étapes d'exécution
      # ci-dessous reçoivent la vraie URL, en `env:` de step. Le build reste identique
      # à celui de la production ; c'est le SERVEUR qui gagne une base.
      - name: Migrer et semer la base E2E (runtime uniquement, jamais le build)
        env:
          DATABASE_URL: "postgresql://axion_ia_e2e:ci_password_dummy@localhost:5432/axion_ia_e2e?schema=public"
          DIRECT_URL: "postgresql://axion_ia_e2e:ci_password_dummy@localhost:5432/axion_ia_e2e?schema=public"
        run: |
          set -e
          pnpm prisma migrate deploy
          PGPASSWORD=ci_password_dummy psql -h localhost -U axion_ia_e2e -d axion_ia_e2e             -f prisma/migrations_fts/0002_fts_setup.sql
          PGPASSWORD=ci_password_dummy psql -h localhost -U axion_ia_e2e -d axion_ia_e2e             -f prisma/migrations_fts/kb_fts_setup.sql
          pnpm db:seed
          pnpm qualiopi:seed
          # 🔴 2026-08-22 — LE DOSSIER EDITORIAL MANQUAIT AUSSI, exactement
          # comme le dossier Qualiopi la veille (#782).
          #
          # `console-editoriale.spec.ts` affirme « le calendrier de septembre
          # 2026 montre les 15 publications du profil ». Ce chiffre vient de
          # l'import du dossier LinkedIn du T4 — que rien ne jouait ici. Le
          # test mesurait donc une base editoriale VIDE, et le disait :
          #
          #     expected /15 publications/i to be visible
          #
          # 🔑 Le semis est ajoute plutot que le test affaibli. Un `skip` sur
          # base vide aurait rendu le critere invérifiable en CI — c'est-a-dire
          # vert sans rien prouver, ce que ce depot passe son temps a corriger.
          #
          # Effet de bord VOULU : la chaine d'amorcage editorial (referentiels
          # + import + idempotence) s'execute a chaque PR. Elle n'avait jamais
          # tourne ailleurs que sur une machine de developpement.
          pnpm editorial:seed
          pnpm editorial:import --source tests/fixtures/editorial/linkedin-q4
          # 🔴 2026-08-21 — LE DOSSIER DE DÉMONSTRATION MANQUAIT, ET LES PARCOURS
          # LE DISAIENT.
          #
          # `qualiopi:seed` pose les données de RÉFÉRENCE (grille, indicateurs,
          # barèmes). Il ne crée aucun dossier : ni client, ni session réalisée,
          # ni attestation. Les sept parcours de la phase 6 en ont besoin — et
          # dès qu'ils ont pu s'exécuter en CI, ils l'ont nommé sans ambiguïté :
          #
          #     session AXI-SES-DEMO-001 introuvable dans la liste
          #     aucun client en base — `pnpm qualiopi:seed-demo` incomplet
          #
          # 🔑 C'est exactement ce qu'on attend d'un parcours : qu'il dise ce qui
          # lui manque, au lieu de se sauter en silence. Les quatre écrans de
          # facturation qui expiraient dans `admin-nav-clic` relevaient
          # probablement de la même cause — aucune facture à afficher.
          pnpm qualiopi:seed-demo
      # 🔴 GARDE (2026-08-21) — LE BUILD DE PRODUCTION DOIT SURVIVRE JUSQU'ICI.
      #
      # Playwright (`pnpm start`) et Lighthouse (`next start -H 0.0.0.0`) démarrent
      # tous deux un serveur de PRODUCTION : sans `.next/BUILD_ID`, Next refuse de
      # démarrer et TOUT ce qui suit échoue — ERR_CONNECTION_REFUSED côté Playwright,
      # CHROME_INTERSTITIAL_ERROR côté Lighthouse.
      #
      # C'est exactement ce qui se passait : `andresz1/size-limit-action` relançait
      # `pnpm run build` DANS LE MÊME RÉPERTOIRE, sans `NODE_OPTIONS` — donc vidait
      # `.next` puis mourait en « JavaScript heap out of memory » (4 Go par défaut,
      # là où le step Build en réclame 8). Mesuré sur le run 32443013208 :
      # `.next` complet à 03:31:22, détruit à 03:31:24, OOM à 03:33:55, et à 03:34:52
      # les 237 tests Playwright partaient sur un serveur mort — 209 échecs,
      # 17 skipped, 11 non joués, ZÉRO passé. L'étape a été déplacée en fin de job.
      #
      # Cette assertion rougit à l'endroit où le build disparaît, pas trois étapes
      # plus loin sous un diagnostic inventé. Elle est VOLONTAIREMENT bloquante :
      # une garde qui ne peut pas rougir ne garde rien.
      - name: Prouver que le build de production a survécu
        run: |
          if [ ! -f .next/BUILD_ID ]; then
            echo "::error::.next/BUILD_ID absent — une étape précédente a détruit le build de production. Playwright et Lighthouse ne mesureraient rien."
            ls -la .next || true
            exit 1
          fi
          echo "BUILD_ID présent :"
          cat .next/BUILD_ID
      - name: Playwright suite
        # 🔑 Les identifiants sont ceux que `prisma/seed.ts` crée réellement
        # (`admin@axion-ia.com` / `AdminAxion2026!`). Les valeurs par défaut du
        # fixture — `admin@axion-ia.local` / `ChangeMe!2026Axion` — ne
        # correspondaient à AUCUN compte semé : les recopier n'aurait pas suffi.
        env:
          DATABASE_URL: "postgresql://axion_ia_e2e:ci_password_dummy@localhost:5432/axion_ia_e2e?schema=public"
          DIRECT_URL: "postgresql://axion_ia_e2e:ci_password_dummy@localhost:5432/axion_ia_e2e?schema=public"
          ADMIN_SEED_EMAIL: "admin@axion-ia.com"
          ADMIN_SEED_PASSWORD: "AdminAxion2026!"
          # Redis RÉEL pour ce step seulement — le job garde `stub.invalid`,
          # que le BUILD exige (ADR 0026). Sans lui, le compteur de tentatives
          # de connexion ne répond pas et `signInAction` refuse toute connexion
          # admin par sécurité : voir le commentaire du service `redis`.
          REDIS_URL: "redis://localhost:6379"
          # 🔴 2026-08-22 — SANS CE DRAPEAU, QUATRE ÉCRANS N'ÉTAIENT PAS COUVERTS.
          #
          # `admin-nav-clic` rendait « 4 entrée(s) de navigation en panne »,
          # toutes sous `/qualiopi/facturation`, toutes en « locator.waitFor:
          # Timeout 15000ms ». Ce n'était pas une panne : le hub facturation est
          # derrière `FACTURATION_HUB_ENABLED` (rollout progressif, cf.
          # `src/server/qualiopi/config/flag.ts`), et les pages appellent
          # `notFound()`.
          #
          # 🔑 POURQUOI ÇA RESSEMBLAIT À UN DÉLAI ET PAS À UN 404 : le dossier
          # porte un `loading.tsx`. La réponse commence donc à être diffusée —
          # statut 200 déjà parti — et `notFound()` ne fait que remplacer la
          # suite du flux. Le test voyait 200, puis attendait un `<h1>` qui ne
          # viendrait jamais. C'est exactement le cas que son propre commentaire
          # anticipait ; il lui manquait de le NOMMER.
          #
          # La nav liste ces entrées même drapeau baissé — décision de rollout
          # explicite et documentée (« c'est la PAGE qui gate »). On ne la touche
          # pas : on lève le drapeau EN CI, pour que les quatre écrans soient
          # réellement traversés au lieu d'être comptés en panne.
          FACTURATION_HUB_ENABLED: "true"
        # ✅ 2026-08-23 — `continue-on-error` RETIRÉ. CE GATE PEUT ENFIN ROUGIR.
        #
        # Trajectoire mesurée, run par run :
        #
        #     avant     0 passés / 237 — le harnais ne mesurait RIEN (`.next` détruit)
        #     32520282915   206 / 19   — 1er relevé avec Redis
        #     32525749387   210 / 17   — après `qualiopi:seed-demo`
        #     32598142374   224 /  3   — après instruction des dix-sept
        #
        # Les trois derniers étaient un seul et même artefact, et c'est
        # l'INSTRUMENT qui l'a nommé, pas le raisonnement : une fois que le
        # message d'échec a porté le type de requête et sa chaîne de
        # redirection, il a dit `type=fetch, redirigée depuis …?_rsc=…`.
        # Un prefetch RSC traversant la garde Edge, dont Chromium upgradait la
        # cible. Corrigé dans `src/lib/csp.ts` (bouclage seulement).
        #
        # ⚠️ CE RETRAIT EST IRRÉVERSIBLE EN PRATIQUE : `Gate B · per-PR` est un
        # contexte EXIGÉ par la protection de `main`, avec `strict: true`. Un
        # rouge ici bloque 100 % des PR, pas seulement la sienne. C'est
        # exactement ce qu'on veut d'une garde — et exactement pourquoi il ne
        # fallait pas le faire avant d'avoir le zéro.
        # 🔴 `--grep-invert @baseline` — la suite `admin-baseline-screenshots`
        # se déclare OPT-IN dans son propre en-tête :
        #
        #     Tag `@baseline` : opt-in. Les suites smoke par défaut ne lancent
        #     pas ces tests. Pour exécuter :
        #       pnpm exec playwright test --grep "@baseline" --update-snapshots
        #
        # L'intention était écrite ; le câblage manquait. Gate B l'exécutait, et
        # ses douze tests échouaient tous sur « A snapshot doesn't exist » —
        # aucune capture de référence n'étant versionnée, et pour cause : elles
        # seraient prises sur le poste d'un développeur, avec ses polices, pour
        # être comparées sur un runner Linux.
        #
        # 🔑 Douze rouges permanents sans rapport avec un défaut, c'est douze
        # bonnes raisons de ne jamais rendre ce gate bloquant. La règle est
        # générale : une suite qui se déclare facultative doit l'ÊTRE, ou cesser
        # de le dire.
        #
        # Garde : `tests/unit/ci/suite-facultative-non-executee.spec.ts`.
        run: pnpm test:e2e --project=chromium --grep-invert "@baseline"
        # 🔴 15 → 30 (2026-08-21). Les DEUX premiers runs où la suite a réellement
        # tourné ont été COUPÉS par ce plafond, pas terminés :
        #   run 32447074166 — 04:39:06 → 04:54:30 = 15 min 24 s
        #   run 32449266900 — 05:19:04 → 05:34:17 = 15 min 13 s
        # Un plafond atteint à la seconde près sur deux runs consécutifs n'est pas
        # une coïncidence. Les 15 min tenaient tant que les 237 tests échouaient
        # en quelques secondes sur un serveur mort ; ils ne tiennent plus dès que
        # les tests s'exécutent — `auditerPage` fait un `networkidle`, une passe
        # axe-core et quatre mesures de viewport par route, sur 119 routes.
        #
        # ⚠️ Conséquence à retenir : les comptes d'échecs lus sur ces deux runs
        # sont PARTIELS. Un `continue-on-error` transforme un dépassement de délai
        # en « success », et un relevé fait sur une suite tronquée ressemble
        # exactement à un relevé complet.
        timeout-minutes: 30
      # ═══════════════════════════════════════════════════════════════════
      # 🔴 2026-08-24 — DEUX ÉTAPES RETIRÉES ICI, ET C'EST UNE MESURE QUI LE DIT
      # ═══════════════════════════════════════════════════════════════════
      #
      # Il y avait à cet endroit « Lighthouse CI » (13 min) et « Bundle delta vs
      # main » (3 min). Seize minutes sur les trente-sept du job. Ni l'une ni
      # l'autre ne produisait un signal exploitable — mesuré sur le run
      # 32666732630, PAS supposé.
      #
      # ── « Lighthouse CI » mesurait le RUNNER, pas le produit ─────────────
      #
      # Elle échouait sur 11 URL sur 11, toujours sur les mêmes métriques :
      # FCP 7,2 s, LCP 11,5 s, Speed Index 7,2 s, TBT 357 ms, performance 0,50.
      # Au même moment, le lhci POST-DEPLOY sur l'URL prod LIVE
      # (`deploy-coolify.yml`, job `lhci`, run 32668725236) ne rendait AUCUN
      # échec — un seul avertissement, `interaction-to-next-paint / auditRan`,
      # qui ne se mesure pas en laboratoire et n'a rien à voir.
      #
      # 🔑 Une gate qui déclare TOUTES ses cibles en faute pendant que la même
      # mesure passe propre en production ne mesure pas ses cibles. Elle
      # mesurait un runner à 2 cœurs, chauffé par les 8 min de Playwright qui la
      # précèdent immédiatement, sous quatre workers.
      #
      # Le commentaire qu'elle portait annonçait le plan : « on laisse le step en
      # REPORTING pour CE passage : il faut d'abord voir ce qu'il mesure une fois
      # qu'il mesure vraiment quelque chose ». C'est fait, on a vu, on tranche.
      #
      # ⚠️ Le contrôle Web Vitals qui fait foi reste — et était DÉJÀ — le lhci
      # post-deploy sur l'URL prod live. `AGENTS.md` le dit depuis le 2026-08-17.
      # `lighthouserc.json` est conservé pour un usage manuel (`pnpm lhci:autorun`)
      # mais n'est plus joué par aucun workflow.
      #
      # ── « Bundle delta vs main » ne pouvait PAS aboutir ──────────────────
      #
      # `size-limit-action` relance un `pnpm run build` complet pour comparer à
      # `main`. Le step Build de ce même job prend 8 min. L'action portait
      # `timeout-minutes: 6`. Elle n'avait donc pas le temps de finir un seul des
      # deux builds qu'elle doit faire — indépendamment de l'OOM à ~4 Go qui la
      # tuait d'abord (faute de la marge de heap du step Build). Sur le run
      # 32666732630 : morte à 3 min, `FATAL ERROR: … heap out of memory`.
      #
      # 🔑 Un cap de 6 min sur un travail de 8 min n'est pas un garde-fou, c'est
      # une garantie d'échec. Et cette étape DÉTRUISAIT `.next` en partant : elle
      # a déjà fait mesurer le vide à Playwright et Lighthouse (run 32443013208,
      # 209 échecs, zéro passé). Le risque disparaît avec elle.
      #
      # ── CE QUI RESTE, ET CE QUI N'EST PLUS MESURÉ DU TOUT ────────────────
      #
      # Reste : `pnpm bundle:check` (étape « Poids du bundle », plus haut, 0 min)
      # et la garde bloquante `.next/BUILD_ID`.
      #
      # ⛔ N'EST MESURÉ PAR AUCUNE GATE : le **First Load JS par route** (cible
      # AGENTS.md ≤ 75 KB gz). `size-limit` ne sait pas exprimer un budget par
      # route sur un glob — il SOMME. La doctrine renvoyait la question à
      # Lighthouse ; Lighthouse n'y répondait pas. Le trou est réel, il est
      # documenté dans `AGENTS.md`, et il se comble à la main
      # (`next build --experimental-build-mode compile`, ~2 min).
      # ═══════════════════════════════════════════════════════════════════
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-b-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            lhci/
          retention-days: 7

  gate-c-docker:
    # Boots the production Dockerfile end-to-end against ephemeral Redis +
    # Postgres and verifies /api/healthz returns 200. Catches issues that
    # `pnpm build` alone cannot: Dockerfile regressions, eager-init crashes
    # at container start, missing env vars, healthcheck mis-config, etc.
    #
    # NOTE 2026-05-10: marked continue-on-error because the smoke build
    # currently fails on Zod env validation at `next build` time — the
    # smoke step doesn't pass all required env (DATABASE_URL etc.). This
    # is a CI-only issue (real Coolify build supplies all env). Gate-c
    # should not block deploys until it gets a proper env fixture.
    # TODO follow-up: pass full mock env (e.g. via `--build-arg` or a
    # .env.smoke file) so this gate can re-enable as required.
    # ─────────────────────────────────────────────────────────────────────────
    # 🔴 GATE C N'EST PLUS UN CONTEXTE EXIGÉ (2026-08-18) — ET POURQUOI
    #
    # Ce job porte `continue-on-error: true` (plus bas, posé le 2026-05-10 : le
    # smoke build échoue sur la validation Zod faute d'env complet). Il ne PEUT
    # donc pas rougir. Mesuré sur les 25 runs précédant le 2026-08-18 :
    # 15 succès, 3 annulés, 1 skippé, ZÉRO échec.
    #
    # Il restait pourtant exigé par la protection de `main`, et il dure ~32 min.
    # C'était donc, à lui seul, le PLAFOND de chaque cycle : avec `strict: true`,
    # chaque fusion périme les PR restantes et fait repayer ce cycle. Retiré des
    # contextes exigés, le cycle tombe de ~32 min à ~20 min.
    #
    # Le retirer ne perd AUCUNE sécurité : un contrôle qui ne peut pas échouer
    # ne protège de rien. Le job continue de tourner et de journaliser.
    #
    # ⚠️ COUPLAGE À NE PAS PERDRE. Le jour où quelqu'un donne à ce job sa
    # fixture d'env complète et RETIRE le `continue-on-error`, il redevient un
    # vrai garde-fou — et il faut alors le REMETTRE dans les contextes exigés de
    # la protection de `main`, sinon il rougira sans jamais rien bloquer.
    # ─────────────────────────────────────────────────────────────────────────
    name: Gate C · Docker smoke test
    runs-on: ubuntu-latest
    # 30 → 60 (2026-06-02) : une fois l'ENOSPC réglé (step free-disk ci-dessus),
    # le `docker build` complet (compile + 18k pages SSG ~12min + copie standalone
    # + export image) + boot conteneur + healthcheck dépasse 30 min → le job était
    # cancelled par timeout alors que le build réussissait. 60 min laisse la marge
    # (cf. gate-b à 75). Permet enfin à Gate C de valider le boot du conteneur.
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      # Free disk space avant le `docker build` SSG (17,9k pages) — le runner
      # ubuntu-latest démarre à ~14 GB libres, insuffisant : le build + la copie
      # standalone .next saturaient le disque (« ENOSPC: no space left on device »),
      # ce qui faisait échouer ce smoke test EN PERMANENCE à l'étape build, avant
      # même de booter le conteneur (donc 0 signal réel). Même cleanup que gate-b ;
      # ici on retire EN PLUS /opt/google (Chrome, inutile sans size-limit) et on
      # prune les images Docker pré-installées — inséré avant le pull de Redis pour
      # que le prune soit sans risque. (Fix Gate C 2026-06-02 — ENOSPC chronique.)
      - name: Free disk space (max headroom)
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/lib/jvm \
            /usr/lib/google-cloud-sdk \
            /usr/lib/firefox \
            /opt/google \
            /opt/az \
            /opt/microsoft \
            /opt/pipx || true
          sudo apt-get clean || true
          docker image prune -af || true
          df -h /

      # ENOSPC fix 2026-06-21 : le `docker build` (compile + 18k pages SSG + copie
      # standalone + export image) sature `/` malgré le free-disk → on déplace le
      # data-root Docker sur le 2e disque `/mnt` (~65 GB), comme deploy-coolify.yml.
      # DOIT précéder tout `docker run`/`docker build` (sinon images sur l'ancien root).
      - name: Relocate Docker data-root to /mnt (ENOSPC headroom)
        run: |
          df -h / /mnt
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          sleep 3
          docker info | grep -i "docker root dir" || true
          df -h / /mnt

      - name: Generate ephemeral test secrets
        id: secrets
        run: |
          echo "auth_secret=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "backup_pass=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "redis_pass=$(openssl rand -hex 24)" >> "$GITHUB_OUTPUT"
          # Secrets factices éphémères pour la validation Zod prod (src/env.ts).
          # IP_HASH_SALT min 32 → hex 24 = 48 chars ✓.
          # PII_ENCRYPTION_KEY regex /^[0-9a-fA-F]{64}$/ → hex 32 = 64 chars EXACT.
          echo "ip_hash_salt=$(openssl rand -hex 24)" >> "$GITHUB_OUTPUT"
          echo "pii_key=$(openssl rand -hex 32)" >> "$GITHUB_OUTPUT"

      - name: Start ephemeral Redis on host network
        run: |
          docker run -d --name redis-smoke --network host \
            redis:7-alpine \
            redis-server --requirepass "${{ steps.secrets.outputs.redis_pass }}"
          for i in $(seq 1 20); do
            if docker exec redis-smoke redis-cli -a '${{ steps.secrets.outputs.redis_pass }}' PING 2>/dev/null | grep -q PONG; then
              echo "redis ready"; break
            fi
            sleep 1
          done

      - name: Build production Dockerfile
        run: |
          # SKIP_ENV_VALIDATION + stubs DB/Redis au BUILD (contrat AGENTS.md,
          # identique à deploy-coolify.yml) : le SSG ne dispose pas des secrets
          # prod au build, et la DB/Redis stub.invalid court-circuite les appels
          # Prisma/Redis au build. La VRAIE validation env tourne au runtime
          # (étape « Run container » ci-dessous, avec les 8 secrets factices).
          # BUILD_SSG_VILLES_INDEXABLE_ONLY=true : ALIGNÉ sur deploy-coolify.yml:250.
          # Sans ce flag, le SSG pré-rendait les ~6 450 villes COMPLÈTES → `.next/server`
          # gonflé, puis la copie `.next/standalone` (qui DUPLIQUE `.next/server`) saturait
          # même les ~65 GB de /mnt → « ENOSPC: no space left on device » au copyfile
          # (échec chronique Gate C, ex. saint-pryve-saint-mesmin.segments). Le déploiement
          # réel build de toute façon en indexable-only (~1 776 villes) : le smoke test doit
          # valider le MÊME artefact (Dockerfile + boot + healthz), pas une SSG plus large.
          # (Fix ENOSPC Gate C 2026-06-22.)
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL=https://smoke.test \
            --build-arg NEXT_PUBLIC_APP_ENV=production \
            --build-arg SKIP_ENV_VALIDATION=true \
            --build-arg DATABASE_URL=postgresql://stub:stub@stub.invalid:5432/stub \
            --build-arg REDIS_URL=redis://stub.invalid:6379 \
            --build-arg BULLMQ_DISABLED=true \
            --build-arg BUILD_SSG_VILLES_INDEXABLE_ONLY=true \
            -t axion-ia:smoke .

      - name: Run container with smoke env
        run: |
          # Runtime : NODE_ENV=production SANS SKIP_ENV_VALIDATION → la validation
          # Zod (src/env.ts prodRequired) tourne réellement au boot. C'est l'intérêt
          # du smoke test : détecter toute régression « env requis manquant ».
          # Les 8 secrets sont des FACTICES éphémères (jamais les vrais — fuite CI).
          # Contraintes Zod réelles (src/env.ts) : AUTH_SECRET≥32, ADMIN_URL_PREFIX≥16,
          # BACKUP≥32, IP_HASH_SALT≥32, PII = 64 hex exact, STRIPE_SECRET sk_test_*,
          # STRIPE_PUBLISHABLE pk_test_*, STRIPE_WEBHOOK whsec_* (≥20).
          # DATABASE_URL=stub.invalid (proxy Prisma court-circuit) + BULLMQ_DISABLED
          # (pas de worker au boot) ; healthz est DB/Redis-free.
          docker run -d --name axion-ia-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e HOSTNAME=0.0.0.0 \
            -e NEXT_PUBLIC_SITE_URL=https://smoke.test \
            -e NEXT_PUBLIC_APP_ENV=production \
            -e NEXT_PUBLIC_DEFAULT_LOCALE=fr \
            -e AUTH_SECRET='${{ steps.secrets.outputs.auth_secret }}' \
            -e ADMIN_URL_PREFIX=admin-smoke-test-1234 \
            -e STRIPE_SECRET_KEY=sk_test_smoke_ci_ephemeral \
            -e STRIPE_PUBLISHABLE_KEY=pk_test_smoke_ci_ephemeral \
            -e STRIPE_WEBHOOK_SECRET=whsec_smoke_ci_ephemeral \
            -e BACKUP_ENCRYPTION_PASSPHRASE='${{ steps.secrets.outputs.backup_pass }}' \
            -e IP_HASH_SALT='${{ steps.secrets.outputs.ip_hash_salt }}' \
            -e PII_ENCRYPTION_KEY='${{ steps.secrets.outputs.pii_key }}' \
            -e DATABASE_URL=postgresql://stub:stub@stub.invalid:5432/stub \
            -e BULLMQ_DISABLED=true \
            -e REDIS_URL='redis://default:${{ steps.secrets.outputs.redis_pass }}@localhost:6379/0' \
            axion-ia:smoke

      - name: Wait for Docker HEALTHCHECK to pass (max 5 min)
        run: |
          for i in $(seq 1 60); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' axion-ia-smoke 2>/dev/null || echo unknown)
            echo "[$i/60] container health: $STATUS"
            if [ "$STATUS" = healthy ]; then exit 0; fi
            if [ "$STATUS" = unhealthy ]; then echo '::error::container went unhealthy'; exit 1; fi
            sleep 5
          done
          echo '::error::timeout waiting for healthy'
          exit 1

      - name: Verify /api/healthz returns 200 + status:ok
        run: |
          set -e
          BODY=$(curl -fsS --max-time 10 http://localhost:3000/api/healthz)
          echo "$BODY"
          echo "$BODY" | grep -q '"status":"ok"'

      - name: Container logs (always)
        if: always()
        run: |
          echo "=== axion-ia-smoke logs (last 200) ==="
          docker logs --tail 200 axion-ia-smoke 2>&1 || true
          echo "=== redis-smoke logs (last 50) ==="
          docker logs --tail 50 redis-smoke 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f axion-ia-smoke 2>/dev/null || true
          docker rm -f redis-smoke 2>/dev/null || true

  gate-d-migration:
    # Audit A7 (2026-05-15) follow-up P1-1 : applique séquentiellement TOUTES les
    # migrations Prisma sur un Postgres pgvector ephemère pour attraper les
    # régressions DDL avant prod (duplicate CREATE TYPE/TABLE, FK orpheline,
    # type cast incompat, RENAME index sur source manquante, etc.).
    #
    # Aurait attrapé le P0-1 duplicate KeywordTracking dans `add_content_gen_core`
    # qui restait dormant jusqu'au 1er `migrate deploy` Coolify.
    #
    # Image `pgvector/pgvector:pg16` requise pour la migration
    # `20260514020000_kb_v4_pgvector_embeddings` (`CREATE EXTENSION vector`).
    # FTS raw SQL (`prisma/migrations_fts/`) appliqué après migrate deploy pour
    # détecter aussi les régressions FTS GIN + trgm.
    name: Gate D · Prisma migrate deploy (DB fresh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axion_ia_ci
          POSTGRES_PASSWORD: ci_password_dummy
          POSTGRES_DB: axion_ia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axion_ia_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://axion_ia_ci:ci_password_dummy@localhost:5432/axion_ia_ci?schema=public
      DIRECT_URL: postgresql://axion_ia_ci:ci_password_dummy@localhost:5432/axion_ia_ci?schema=public
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Wait for Postgres ready
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U axion_ia_ci >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::postgres not ready after 30s"; exit 1
      - name: Verify pgvector extension available
        run: |
          PGPASSWORD=ci_password_dummy psql -h localhost -U axion_ia_ci -d axion_ia_ci \
            -c "SELECT default_version FROM pg_available_extensions WHERE name = 'vector';" \
            | grep -E "[0-9]+\.[0-9]+" || (echo "::error::pgvector not available"; exit 1)
      - name: Apply all Prisma migrations (fresh DB)
        run: pnpm prisma migrate deploy
      # 🔴 `fr_unaccent` AVANT les fichiers FTS, sinon rien ne s'applique.
      #
      # `0002_fts_setup.sql` dit lui-meme d'ou vient cette configuration :
      # « creee par docker/postgres/init.sql a l'init du conteneur ». Vrai en
      # local et en production ; FAUX ici, ou le journal du service affiche
      # `ignoring /docker-entrypoint-initdb.d/*`.
      #
      # Consequence, restee invisible jusqu'au 2026-08-22 : chaque instruction
      # citant `fr_unaccent` echouait, et `psql` SANS `ON_ERROR_STOP` sort en 0
      # meme apres une erreur. La gate etait donc verte en n'appliquant rien.
      # C'est `ON_ERROR_STOP=1`, ajoute juste en dessous, qui l'a revele.
      #
      # On rejoue donc l'init du conteneur, pour que la gate mesure la MEME
      # base que la production — et non une base a laquelle il manque la
      # moitie de sa configuration.
      - name: Apply container init (extensions + fr_unaccent)
        run: |
          set -e
          PGPASSWORD=ci_password_dummy psql -h localhost -U axion_ia_ci -d axion_ia_ci \
            -v ON_ERROR_STOP=1 -f docker/postgres/init.sql
          PGPASSWORD=ci_password_dummy psql -h localhost -U axion_ia_ci -d axion_ia_ci \
            -tAc "SELECT cfgname FROM pg_ts_config WHERE cfgname = 'fr_unaccent';" \
            | grep -q fr_unaccent \
            || (echo "::error::fr_unaccent absente apres init"; exit 1)

      # La gate applique TOUS les fichiers du dossier, par boucle — comme le
      # fait `scripts/docker-entrypoint.sh` au boot de production.
      #
      # Avant, deux fichiers etaient nommes en dur. Un troisieme est arrive
      # (`editorial_fts.sql`) sans que la gate le voie : elle validait donc un
      # schema FTS qui n'etait PAS celui que la prod applique. C'est le §1 du
      # protocole — « une gate qui mesurait un fichier de configuration pendant
      # que le conteneur tournait avec une autre valeur ». Signale par la passe
      # 2 de la verification de la console editoriale.
      #
      # La boucle est volontairement identique a celle de l'entrypoint : le
      # prochain fichier FTS sera couvert sans que personne ait a y penser.
      - name: Apply FTS raw migrations post Prisma
        run: |
          set -e
          shopt -s nullglob
          fichiers=(prisma/migrations_fts/*.sql)
          if [ ${#fichiers[@]} -eq 0 ]; then
            echo "::error::aucun fichier dans prisma/migrations_fts/"; exit 1
          fi
          for sql in "${fichiers[@]}"; do
            echo "[fts] $sql"
            PGPASSWORD=ci_password_dummy psql -h localhost -U axion_ia_ci -d axion_ia_ci \
              -v ON_ERROR_STOP=1 -f "$sql"
          done
      - name: Verify _prisma_migrations table healthy
        run: |
          PGPASSWORD=ci_password_dummy psql -h localhost -U axion_ia_ci -d axion_ia_ci \
            -c "SELECT migration_name, finished_at IS NOT NULL AS finished, rolled_back_at IS NULL AS not_rolled_back FROM _prisma_migrations ORDER BY started_at;"
          ROLLED=$(PGPASSWORD=ci_password_dummy psql -h localhost -U axion_ia_ci -d axion_ia_ci -tAc "SELECT COUNT(*) FROM _prisma_migrations WHERE rolled_back_at IS NOT NULL;")
          if [ "$ROLLED" != "0" ]; then
            echo "::error::at least one migration rolled back ($ROLLED)"; exit 1
          fi
          UNFINISHED=$(PGPASSWORD=ci_password_dummy psql -h localhost -U axion_ia_ci -d axion_ia_ci -tAc "SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NULL;")
          if [ "$UNFINISHED" != "0" ]; then
            echo "::error::at least one migration unfinished ($UNFINISHED)"; exit 1
          fi
      - name: Sanity smoke — schema reachable via Prisma client
        env:
          NODE_ENV: production
        run: |
          node --experimental-vm-modules -e "
          const { PrismaClient } = require('./prisma/generated/client');
          const p = new PrismaClient();
          (async () => {
            await p.\$queryRaw\`SELECT 1\`;
            const counts = await Promise.all([
              p.contentGenJob.count(),
              p.coverageCampaign.count(),
              p.providerConfig.count(),
              p.authorProfile.count(),
              p.keywordTracking.count(),
              p.knowledgeEntry.count(),
            ]);
            console.log('counts (should all be 0 on fresh DB):', counts);
            const allZero = counts.every(n => n === 0);
            if (!allZero) { console.error('::error::expected zero rows on fresh DB'); process.exit(1); }
            await p.\$disconnect();
          })().catch(err => { console.error('::error::', err.message); process.exit(1); });
          "

      # ── T0 — volumétrie (plan de tenue à la charge, § T0) ─────────────────
      #
      # 🔴 Pourquoi ici, et pas dans un job à part : Gate D est le SEUL endroit
      # du dépôt qui dispose d'un Postgres migré à neuf. Un job dédié devrait
      # réinstaller les dépendances et re-migrer pour la même chose — quinze
      # minutes de CI pour recréer ce qui existe déjà trois lignes plus haut.
      #
      # La vérification « zéro ligne sur base fraîche » ci-dessus tourne AVANT :
      # on ne seede qu'après l'avoir passée, sinon la fixture la ferait échouer.
      - name: Fixture volumétrique (1 200 sessions, 8 000 inscriptions)
        run: pnpm volumetrie:seed
      - name: Mesure des surfaces admin au volume cible
        # Rouge si une liste admin n'a pas de baseline committée, ou si elle est
        # plus lente que son budget. C'est l'exigence du plan T0 : « la CI refuse
        # un merge touchant les listes admin si aucune baseline volumétrique
        # n'est committée ». Le journal imprime les valeurs à committer.
        run: pnpm volumetrie:mesure
