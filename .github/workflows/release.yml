name: Release · Gate E

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Production release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://axion-ia.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          # Audit A1 P2-4 (2026-05-15) — aligné Node 24 (LTS Iron) avec
          # nightly + deploy-coolify + ci. Évite drift CI vs prod.
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production
        run: pnpm build
      - name: Trigger Coolify production webhook
        if: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK != '' }}
        run: |
          curl -fsS -X POST "${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ref": "${{ github.ref_name }}"}'
      - name: Smoke prod
        run: echo "Prod smoke stub — Sprint 22."
      - name: Notify Telegram
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=Axion-IA release ${{ github.ref_name }} deployed"
