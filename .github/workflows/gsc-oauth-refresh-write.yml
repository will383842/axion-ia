name: GSC OAuth · Régénérer token write scope

# Workflow en 2 passes pour obtenir un refresh_token GSC avec scope webmasters (write).
#
# Étape 1 - mode=generate :
#   Affiche l'URL d'autorisation Google dans les logs.
#   L'utilisateur visite l'URL, autorise, et copie le code depuis l'URL de redirection localhost.
#
# Étape 2 - mode=exchange (code=XXX) :
#   Échange le code contre un refresh_token write.
#   Met à jour le secret GH GSC_OAUTH_REFRESH_TOKEN automatiquement.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "generate (afficher URL) ou exchange (échanger le code)"
        required: true
        type: choice
        options:
          - generate
          - exchange
      code:
        description: "Code Google (seulement pour mode exchange)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  oauth:
    name: GSC OAuth write scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate secrets
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
        run: |
          for v in GSC_OAUTH_CLIENT_ID GSC_OAUTH_CLIENT_SECRET; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing secret $v"
              exit 1
            fi
          done

      # -- MODE GENERATE --------------------------------------------------
      - name: Generate authorization URL
        if: ${{ github.event.inputs.mode == 'generate' }}
        env:
          CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
        run: |
          SCOPE="https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fwebmasters"
          REDIRECT="http%3A%2F%2Flocalhost"
          URL="https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT}&scope=${SCOPE}&access_type=offline&prompt=consent&response_type=code"
          echo ""
          echo "=== VISITEZ CETTE URL DANS VOTRE NAVIGATEUR ==="
          echo "$URL"
          echo "================================================"
          echo ""
          echo "Apres autorisation, copiez le code depuis l'URL localhost/?code=..."

      # -- MODE EXCHANGE --------------------------------------------------
      - name: Exchange code for refresh token
        if: ${{ github.event.inputs.mode == 'exchange' }}
        env:
          CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          CODE: ${{ github.event.inputs.code }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${CODE:-}" ]; then
            echo "::error::Vous devez fournir le code Google (input 'code')"
            exit 1
          fi

          RESPONSE=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            --data-urlencode "code=${CODE}" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "redirect_uri=http://localhost" \
            --data-urlencode "grant_type=authorization_code")

          echo "Response recu (masque): $(echo "$RESPONSE" | sed 's/"refresh_token":"[^"]*"/"refresh_token":"***"/g')"

          REFRESH_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('refresh_token',''))" 2>/dev/null || echo "")

          if [ -z "${REFRESH_TOKEN:-}" ]; then
            echo "::error::Echec - pas de refresh_token dans la reponse"
            echo "Reponse complete: $RESPONSE"
            exit 1
          fi

          echo "Refresh token obtenu (${#REFRESH_TOKEN} chars)"

          # Chiffrer le secret avec la cle publique du repo via l'API GitHub
          pip3 install PyNaCl --quiet 2>/dev/null

          # Recuperer la cle publique du repo
          PUB_KEY_RESP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/secrets/public-key")
          echo "Public key response: $PUB_KEY_RESP"

          KEY_ID=$(echo "$PUB_KEY_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['key_id'])")
          PUB_KEY=$(echo "$PUB_KEY_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['key'])")

          # Chiffrer le token
          ENCRYPTED=$(python3 -c "
          import base64
          from nacl import encoding, public

          def encrypt(public_key_str, secret_value):
              pk = public.PublicKey(public_key_str, encoding.Base64Encoder())
              sealed = public.SealedBox(pk)
              encrypted = sealed.encrypt(secret_value.encode('utf-8'))
              return base64.b64encode(encrypted).decode('utf-8')

          import sys
          result = encrypt(sys.argv[1], sys.argv[2])
          print(result)
          " "$PUB_KEY" "$REFRESH_TOKEN")

          # Mettre à jour le secret
          HTTP_STATUS=$(curl -s -o /tmp/secret_resp.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/secrets/GSC_OAUTH_REFRESH_TOKEN" \
            -d "{\"encrypted_value\":\"$ENCRYPTED\",\"key_id\":\"$KEY_ID\"}")

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/secret_resp.json

          if [ "$HTTP_STATUS" = "201" ] || [ "$HTTP_STATUS" = "204" ]; then
            echo ""
            echo "✅ GSC_OAUTH_REFRESH_TOKEN mis a jour avec scope webmasters (write)"
          else
            echo "::error::Echec mise à jour du secret - HTTP $HTTP_STATUS"
            exit 1
          fi
