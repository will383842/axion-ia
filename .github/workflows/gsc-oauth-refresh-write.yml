name: GSC OAuth · Régénérer token write scope

# Workflow en 2 passes pour obtenir un refresh_token GSC avec scope webmasters (write).
#
# Étape 1 — mode=generate :
#   Affiche l'URL d'autorisation Google dans les logs.
#   L'utilisateur visite l'URL, autorise, et copie le code affiché par Google.
#
# Étape 2 — mode=exchange (code=XXX) :
#   Échange le code contre un refresh_token write.
#   Met à jour le secret GH GSC_OAUTH_REFRESH_TOKEN automatiquement.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "generate (afficher URL) ou exchange (échanger le code)"
        required: true
        type: choice
        options:
          - generate
          - exchange
      code:
        description: "Code Google (seulement pour mode exchange)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write   # pour gh secret set

jobs:
  oauth:
    name: GSC OAuth write scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate secrets
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
        run: |
          for v in GSC_OAUTH_CLIENT_ID GSC_OAUTH_CLIENT_SECRET; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing secret $v"
              exit 1
            fi
          done
          echo "Secrets OK"

      # ── MODE GENERATE ────────────────────────────────────────────────────────
      - name: Generate authorization URL
        if: inputs.mode == 'generate'
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
        run: |
          REDIRECT="urn%3Aietf%3Awg%3Aoauth%3A2.0%3Aoob"
          SCOPE="https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fwebmasters"
          AUTH_URL="https://accounts.google.com/o/oauth2/v2/auth?client_id=${GSC_OAUTH_CLIENT_ID}&redirect_uri=${REDIRECT}&scope=${SCOPE}&access_type=offline&prompt=consent&response_type=code"
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  ÉTAPE 1 — Visite cette URL dans ton browser :"
          echo ""
          echo "  $AUTH_URL"
          echo ""
          echo "  1. Clique 'Autoriser' sur la page Google"
          echo "  2. Google affiche un code (ex: 4/0AXxxxxxx...)"
          echo "  3. Copie ce code"
          echo "  4. Relance ce workflow avec mode=exchange + code=<le_code>"
          echo "════════════════════════════════════════════════════════"

      # ── MODE EXCHANGE ────────────────────────────────────────────────────────
      - name: Exchange code for refresh token
        if: inputs.mode == 'exchange'
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          AUTH_CODE: ${{ inputs.code }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AUTH_CODE:-}" ]; then
            echo "::error::code input requis en mode exchange"
            exit 1
          fi

          echo "── Échange du code contre un refresh_token ──"
          RESP=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=${GSC_OAUTH_CLIENT_ID}" \
            -d "client_secret=${GSC_OAUTH_CLIENT_SECRET}" \
            -d "redirect_uri=urn:ietf:wg:oauth:2.0:oob" \
            -d "code=${AUTH_CODE}" \
            -d "grant_type=authorization_code")

          REFRESH_TOKEN=$(echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if 'refresh_token' in d:
              print(d['refresh_token'])
          else:
              print('ERROR: ' + str(d), file=sys.stderr)
              exit(1)
          " 2>&1)

          if echo "$REFRESH_TOKEN" | grep -q "^ERROR"; then
            echo "::error::Échange échoué : $REFRESH_TOKEN"
            echo "Response: $RESP"
            exit 1
          fi

          echo "Refresh token obtenu (${#REFRESH_TOKEN} chars)"

          # Mise à jour automatique du secret GH
          echo "$REFRESH_TOKEN" | gh secret set GSC_OAUTH_REFRESH_TOKEN \
            --repo "${{ github.repository }}"

          echo "::notice::✅ GSC_OAUTH_REFRESH_TOKEN mis à jour avec scope webmasters (write)"
          echo "::notice::Relance maintenant le workflow gsc-submit-image-sitemaps.yml"
