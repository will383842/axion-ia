name: Banc formateurs

# Lot X1-bis du chantier « formateurs freelance » — le banc `@formateurs` dans
# SON job, avec ce que Gate B n'a pas et ne doit pas avoir :
#
#   · Postgres et Redis RÉELS (conteneurs de service) ;
#   · BullMQ ALLUMÉ — pas de `BULLMQ_DISABLED` — et le worker de production
#     (`pnpm worker`, soit `tsx src/server/queue/worker.ts`) en tâche de fond ;
#   · un PUITS SMTP (Mailpit) : le worker y remet, Mailpit garde et ne relaie
#     rien. Aucune clé d'envoi réelle n'existe dans ce job — ni identifiants
#     SMTP, ni jeton de relais, ni aucun `secrets.*` : rien ne peut sortir.
#
# L'horloge n'est jamais truquée : les passages planifiés reçoivent leur
# `maintenant` en paramètre, appelés par l'exécuteur du banc
# (`tests/e2e/fixtures/formateurs/serveur/executer.ts`), pas par les crons.
#
# ⚠️ Informatif : ce job n'est PAS un contexte requis de la protection de
# `main`, et ne touche pas Gate B (qui exclut désormais `@formateurs`, et
# n'attend rien d'ici). Il tourne sur les PR qui touchent le chantier, chaque
# nuit (appelé par `nightly.yml`) et à la demande.
#
# Antivirus : le dossier en ligne DÉPOSE des pièces (vérification 1, E08-E12),
# et un dépôt n'est accepté que sur un verdict « sain » de clamd. Un conteneur
# ClamAV officiel (bases de signatures embarquées, `freshclam` coupé : aucune
# dépendance au réseau de ClamAV) rejoint donc les services.
#
# Stockage : le contrat-cadre, sa copie (F10) et l'exemplaire contresigné (F19)
# passent par R2. Le banc démarre un stockage R2 SIMULÉ
# (`scripts/banc-formateurs/demarrer-stockage-r2.sh`) : le nom R2 du banc pointe
# vers 127.0.0.1 sur cette machine seule, avec un certificat de confiance locale ;
# le SDK S3 réel lui parle, aucun objet ne sort. Clés R2 FICTIVES.
#
# Clés : `PII_ENCRYPTION_KEY` est TIRÉE AU HASARD à chaque run (64 hexadécimaux,
# le format exigé) et `IBAN_EMPREINTE_SECRET` est fictive : le dossier refuse
# d'écrire un IBAN sans chiffrement, et une clé mal formée laisserait les données
# personnelles en clair dans la base du banc. Aucune clé n'est écrite ici.

on:
  # 2026-10-25 : plus lancé sur les PR (informatif, 5 gros jobs, saturait la file des
  # machines gratuites). Il tourne chaque nuit (nightly.yml) et à la demande :
  # gh workflow run banc-formateurs.yml --ref <branche>
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 🔑 UN JOB PAR ÉQUIPE (2026-10-15). Réunis dans un seul job, les scénarios
  # des équipes A, B et D se gênaient : une base, un Redis, un worker partagés,
  # et trois verrous d'équipe qui ne se voient pas (run 38663145178 : E02, E03,
  # E04, E27, E33, E37, E39 rouges, parfois ED5 et ED6). Chaque entrée de la
  # matrice a ses PROPRES conteneurs de service — sa base, son Redis, son puits
  # SMTP, son antivirus — et son propre worker. Le découpage vit dans
  # `scripts/banc-formateurs/groupes.mjs`, qui vérifie à chaque run que chaque
  # spec `@formateurs` appartient à un groupe et un seul.
  equipe:
    name: Banc formateurs · ${{ matrix.titre }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Une équipe rouge n'arrête pas les autres : on veut savoir laquelle.
      fail-fast: false
      matrix:
        include:
          - groupe: A
            titre: "équipe A · candidature et contrat"
            workers: 4
          - groupe: B
            titre: "équipe B · missions"
            workers: 4
          - groupe: C
            titre: "équipe C · argent"
            workers: 4
          # D bascule les interrupteurs MÈRES (E39, E40, ED5, ED6…) : un seul
          # worker Playwright, en plus de son verrou d'interrupteurs.
          - groupe: D
            titre: "équipe D · sécurité"
            workers: 1
          - groupe: socle
            titre: "socle · file et rendez-vous"
            workers: 4
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axion_ia_banc
          POSTGRES_PASSWORD: banc_password_dummy
          POSTGRES_DB: axion_ia_banc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axion_ia_banc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports:
          - 1025:1025
          - 8025:8025
      clamav:
        image: clamav/clamav:1.4.6
        env:
          CLAMAV_NO_FRESHCLAMD: "true"
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    env:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: "postgresql://axion_ia_banc:banc_password_dummy@localhost:5432/axion_ia_banc?schema=public"
      DIRECT_URL: "postgresql://axion_ia_banc:banc_password_dummy@localhost:5432/axion_ia_banc?schema=public"
      REDIS_URL: "redis://localhost:6379"
      # Le puits. Sans `SMTP_USER` / `SMTP_PASS`, le transport part sans
      # authentification ni TLS — ce qui n'est permis que hors production.
      SMTP_HOST: "localhost"
      SMTP_PORT: "1025"
      BANC_PUITS_SMTP_URL: "http://localhost:8025"
      # Dans ce job, un puits absent est une faute de câblage, pas un saut.
      BANC_FORMATEURS: "1"
      CLAMAV_HOST: "127.0.0.1"
      CLAMAV_PORT: "3310"
      IMAGE_BANK_STORAGE_PATH: "/tmp/banc-formateurs/stockage/image-bank"
      EDITORIAL_STORAGE_PATH: "/tmp/banc-formateurs/stockage/editorial"
      # Valeurs FICTIVES, les mêmes que Gate B : elles ne protègent rien de réel.
      AUTH_SECRET: "ci-dummy-auth-secret-not-used-in-build-32chars-min"
      IP_HASH_SALT: "ci-dummy-ip-hash-salt-not-used-in-build-32chars"
      IBAN_EMPREINTE_SECRET: "banc-formateurs-empreinte-iban-fictive"
      # Le stockage R2 SIMULÉ (cf. en-tête) : compte, seau et clés fictifs.
      R2_ACCOUNT_ID: "banc"
      R2_BUCKET_NAME: "banc-formateurs"
      R2_ACCESS_KEY_ID: "banc-cle-fictive"
      R2_SECRET_ACCESS_KEY: "banc-secret-fictif"
      NODE_EXTRA_CA_CERTS: "/tmp/banc-formateurs/r2/cert.pem"
      NEXT_PUBLIC_SITE_URL: "https://axion-ia.com"
      # Le banc ne charge aucune page : sans cette adresse, Playwright
      # démarrerait `pnpm start`, qui exige un build que ce job ne fait pas.
      E2E_BASE_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chaque spec du banc a son groupe
        run: node scripts/banc-formateurs/groupes.mjs verifier
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Migrer et semer la base du banc
        run: |
          set -e
          pnpm prisma migrate deploy
          PGPASSWORD=banc_password_dummy psql -h localhost -U axion_ia_banc -d axion_ia_banc -f prisma/migrations_fts/0002_fts_setup.sql
          PGPASSWORD=banc_password_dummy psql -h localhost -U axion_ia_banc -d axion_ia_banc -f prisma/migrations_fts/kb_fts_setup.sql
          pnpm db:seed
      - name: Le puits SMTP répond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8025/api/v1/info > /dev/null; then
              echo "Mailpit prêt"; exit 0
            fi
            sleep 2
          done
          echo "::error::Mailpit ne répond pas sur :8025"
          exit 1
      - name: Clé de chiffrement du banc (tirée au hasard)
        run: echo "PII_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Démarrer le stockage R2 simulé
        run: scripts/banc-formateurs/demarrer-stockage-r2.sh /tmp/banc-formateurs/r2 banc-formateurs
      - name: L'antivirus répond
        run: |
          for i in $(seq 1 60); do
            if printf 'zPING\0' | timeout 3 nc 127.0.0.1 3310 | grep -q PONG; then
              echo "clamd prêt"; exit 0
            fi
            sleep 3
          done
          echo "::error::clamd ne répond pas sur :3310"
          exit 1
      - name: Démarrer le worker (tâche de fond)
        run: |
          mkdir -p /tmp/banc-formateurs/stockage
          nohup pnpm worker > /tmp/banc-formateurs/worker.log 2>&1 &
          echo $! > /tmp/banc-formateurs/worker.pid
          for i in $(seq 1 90); do
            if grep -q "workers running" /tmp/banc-formateurs/worker.log; then
              grep -E "email-worker|workers running" /tmp/banc-formateurs/worker.log
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/banc-formateurs/worker.pid)" 2>/dev/null; then
              echo "::error::le worker est mort au démarrage"
              cat /tmp/banc-formateurs/worker.log
              exit 1
            fi
            sleep 2
          done
          echo "::error::le worker ne s'est pas déclaré prêt en 3 min"
          tail -50 /tmp/banc-formateurs/worker.log
          exit 1
      - name: Banc @formateurs
        # `--retries=0` : un banc qui ne passe qu'au troisième essai ne prouve
        # pas ce qu'il affirme. Pas de navigateur : aucun spec du banc n'ouvre
        # de page (une spec d'écran reste dans Gate B, sans le tag).
        # Un groupe vide (l'équipe C avant sa fusion) ne lance rien et le dit.
        env:
          GROUPE: ${{ matrix.groupe }}
          WORKERS_BANC: ${{ matrix.workers }}
        run: |
          set -e
          # Liste lue d'abord dans une variable : sous `set -e`, un échec du
          # script arrête l'étape (une substitution de processus le tairait).
          LISTE="$(node scripts/banc-formateurs/groupes.mjs liste "$GROUPE")"
          if [ -z "$LISTE" ]; then
            echo "::notice::banc @formateurs : aucun spec dans le groupe $GROUPE"
            exit 0
          fi
          mapfile -t FICHIERS <<< "$LISTE"
          printf '%s\n' "${FICHIERS[@]}"
          pnpm exec playwright test --project=chromium --grep "@formateurs" --retries=0 --workers="$WORKERS_BANC" "${FICHIERS[@]}"
        # Les scénarios de l'équipe A passent un par un (verrou) : ~13 min mesurées.
        timeout-minutes: 50
      - name: Journal du worker
        if: ${{ always() }}
        run: |
          kill "$(cat /tmp/banc-formateurs/worker.pid)" 2>/dev/null || true
          tail -200 /tmp/banc-formateurs/worker.log || true
      - name: Rapport et journal
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: banc-formateurs-${{ matrix.groupe }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            /tmp/banc-formateurs/worker.log
            /tmp/banc-formateurs/r2/r2.log
          retention-days: 7
          if-no-files-found: ignore

  # Le nom que la file de fusion, les autres PR et la nuit connaissent : vert
  # seulement si CHAQUE équipe l'est. `always()` : une équipe rouge doit rendre
  # ce job rouge, pas « sauté ».
  banc:
    name: Banc formateurs · file, worker, puits SMTP
    needs: equipe
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Toutes les équipes sont vertes
        env:
          RESULTAT: ${{ needs.equipe.result }}
        run: |
          echo "équipes du banc : $RESULTAT"
          test "$RESULTAT" = "success"
