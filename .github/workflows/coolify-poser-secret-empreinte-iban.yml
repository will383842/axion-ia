name: Coolify · poser IBAN_EMPREINTE_SECRET (une seule fois, site + worker)

# Crée le secret d'empreinte des IBAN (HMAC, `src/lib/iban-empreinte.ts`) avec la MÊME valeur
# sur le site et sur le worker. La valeur est générée DANS le runner, masquée, jamais affichée,
# jamais écrite ailleurs que dans Coolify.
# REFUSE si la clé existe déjà d'un côté ou de l'autre : ce secret ne doit JAMAIS être changé
# (les empreintes déjà calculées deviendraient fausses). Voir
# docs/runbooks/apporteurs-changement-iban-retour-arriere.md.
# Si le POST du worker échoue, la clé est retirée du site (retour arrière) : un nouveau run repart de zéro.
# La variable n'est lue qu'au redémarrage : redeploy=true redéploie site puis worker
# (force=true : relance la dernière image main, donc met aussi en ligne le code fusionné non déployé).

on:
  workflow_dispatch:
    inputs:
      confirmer:
        description: "Écrire exactement POSER"
        required: true
        type: string
      redeploy:
        description: "Redéployer site et worker après la pose"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: coolify-poser-secret-empreinte-iban
  cancel-in-progress: false

jobs:
  poser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Poser le secret (refus s'il existe déjà)
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WORKER_APP_UUID: ${{ secrets.COOLIFY_WORKER_APP_UUID }}
          CONFIRMER: ${{ inputs.confirmer }}
        run: |
          set -euo pipefail
          [ "$CONFIRMER" = "POSER" ] || { echo "::error::confirmer doit valoir POSER"; exit 1; }
          for v in COOLIFY_API_TOKEN COOLIFY_URL COOLIFY_APP_UUID COOLIFY_WORKER_APP_UUID; do
            [ -n "${!v:-}" ] || { echo "::error::Secret manquant : $v"; exit 1; }
          done
          CLE=IBAN_EMPREINTE_SECRET
          for pair in "site:$COOLIFY_APP_UUID" "worker:$COOLIFY_WORKER_APP_UUID"; do
            nom="${pair%%:*}"; uuid="${pair#*:}"
            n=$(curl -fsSL -m 20 -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_URL}/api/v1/applications/${uuid}/envs" | jq --arg k "$CLE" '[.[] | select(.key == $k)] | length')
            if [ "$n" != "0" ]; then
              echo "::error::$CLE existe déjà sur $nom : REFUS (ne jamais changer ce secret)"; exit 1
            fi
            echo "$nom : $CLE absent, pose possible"
          done
          VALEUR=$(openssl rand -hex 32)
          echo "::add-mask::$VALEUR"
          [ ${#VALEUR} -eq 64 ] || { echo "::error::génération ratée"; exit 1; }
          # Variable d'exécution seulement (jamais en ARG de build). Si l'API Coolify installée
          # refuse ces champs (422), on retombe sur la charge sans eux (comme coolify-drapeau.yml).
          export VALEUR
          charge() { # valeur lue dans l'environnement, jamais en argument
            jq -nc --arg key "$CLE" --argjson ext "$1" '{
              key: $key, value: env.VALEUR,
              is_preview: false, is_literal: true, is_multiline: false, is_shown_once: false
            } + (if $ext then {is_buildtime: false, is_runtime: true} else {} end)'
          }
          poster() { # $1=uuid $2=avec champs (true/false) → affiche le code HTTP, corps dans /tmp/r
            local code
            code=$(charge "$2" | curl -sS -m 20 -o /tmp/r -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Content-Type: application/json" \
              --data-binary @- "${COOLIFY_URL}/api/v1/applications/$1/envs") || code=000
            echo "$code"
          }
          uuids_cle() { # uuid de TOUTES les copies de $CLE (preview comprise) sur l'application $1 ; return 2 si lecture impossible
            local corps
            corps=$(curl -fsS -m 20 -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_URL}/api/v1/applications/$1/envs") || return 2
            printf '%s' "$corps" | jq -r --arg k "$CLE" '.[] | select(.key == $k) | .uuid' || return 2
          }
          retirer_site() {
            local liste u code echec=0
            if ! liste=$(uuids_cle "$COOLIFY_APP_UUID"); then
              echo "::error::Retour arrière site : lecture impossible. Vérifier et retirer la clé à la main AVANT tout redéploiement"; return 1
            fi
            [ -n "$liste" ] || { echo "Retour arrière : rien à retirer sur le site"; return 0; }
            for u in $liste; do
              code=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
                "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/envs/${u}") || code=000
              if [ "$code" = "200" ] || [ "$code" = "204" ]; then echo "Retour arrière site : copie retirée ($code)"
              else echo "::error::Retour arrière site IMPOSSIBLE ($code) : retirer la clé à la main AVANT tout redéploiement"; echec=1; fi
            done
            return $echec
          }
          ok() { [ "$1" = "200" ] || [ "$1" = "201" ]; }

          # 1) Site
          AVEC=true
          code=$(poster "$COOLIFY_APP_UUID" true)
          if [ "$code" = "422" ]; then
            echo "::warning::site : champs build/exécution refusés (422), nouvel essai sans eux. Vérifier dans Coolify que « Build Variable » est DÉCOCHÉE avant de redéployer"
            AVEC=false; code=$(poster "$COOLIFY_APP_UUID" false)
          fi
          if ! ok "$code"; then
            echo "::error::site : POST → $code (rien posé côté worker)"
            [ "$code" = "000" ] && { retirer_site || true; }
            exit 1
          fi
          echo "site : POST ✅ ($code)"

          # 2) Worker, même valeur ; échec → retour arrière du site
          code=$(poster "$COOLIFY_WORKER_APP_UUID" "$AVEC")
          if [ "$code" = "000" ]; then
            # Délai dépassé : la clé a peut-être été créée (forcément avec la même valeur).
            if liste=$(uuids_cle "$COOLIFY_WORKER_APP_UUID"); then
              if [ -n "$liste" ]; then echo "worker : délai dépassé mais clé bien créée → succès"; code=201; fi
            else
              echo "::error::worker : délai dépassé et lecture impossible. NE RIEN REDÉPLOYER : vérifier à la main les deux côtés"; exit 1
            fi
          fi
          if ! ok "$code"; then
            echo "::error::worker : POST → $code ; retour arrière du site"
            retirer_site || true
            exit 1
          fi
          echo "worker : POST ✅ ($code)"
          unset VALEUR

          # 3) Vérification : la clé existe des deux côtés (la valeur n'est pas relisible par ce jeton)
          for pair in "site:$COOLIFY_APP_UUID" "worker:$COOLIFY_WORKER_APP_UUID"; do
            nom="${pair%%:*}"; uuid="${pair#*:}"
            liste=$(uuids_cle "$uuid") || { echo "::error::$nom : lecture impossible pour vérifier (la pose a répondu OK)"; exit 1; }
            [ -n "$liste" ] || { echo "::error::$nom : clé introuvable après la pose"; exit 1; }
            echo "$nom : $CLE présent"
          done

      - name: Redéployer site puis worker
        if: ${{ inputs.redeploy }}
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WORKER_APP_UUID: ${{ secrets.COOLIFY_WORKER_APP_UUID }}
        run: |
          set -euo pipefail
          for pair in "site:$COOLIFY_APP_UUID" "worker:$COOLIFY_WORKER_APP_UUID"; do
            nom="${pair%%:*}"; uuid="${pair#*:}"
            r=$(curl -fsSL -X POST -m 30 \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Accept: application/json" \
              --data-urlencode "uuid=${uuid}" --data-urlencode "force=true" \
              "${COOLIFY_URL}/api/v1/deploy")
            echo "$nom : deployment_uuid=$(printf '%s' "$r" | jq -r '.deployments[0].deployment_uuid // "inconnu"' 2>/dev/null || echo inconnu)"
          done
