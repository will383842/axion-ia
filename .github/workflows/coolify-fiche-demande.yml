name: Coolify · fiche des demandes (site + worker)
# Workflow utilitaire workflow_dispatch — pose les DEUX interrupteurs non secrets de la fiche
# prospect créée depuis les demandes écrites, en Production, sur le site ET le worker :
#   - DOSSIER_FICHE_DEMANDE        : false | essai | true  (l'entrée « coupe » écrit « false »)
#   - DOSSIER_FICHE_DEMANDE_DEPUIS : date AAAA-MM-JJ (sans elle, l'étape est à l'arrêt)
# Aucune clé libre : les deux noms sont codés en dur. Voir src/features/dossier-client/fiche-demande.ts.
# Sécurité : workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode de la fiche des demandes (coupe = false)"
        required: true
        default: "coupe"
        type: choice
        options:
          - "coupe"
          - "essai"
          - "true"
      depuis:
        description: "Date d'activation AAAA-MM-JJ (seules les demandes reçues à partir d'elle sont traitées)"
        required: true
        type: string
      redeploy:
        description: "Redéployer après (Restart ne recharge pas les variables)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  poser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Valider les secrets
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WORKER_APP_UUID: ${{ secrets.COOLIFY_WORKER_APP_UUID }}
        run: |
          set -euo pipefail
          for v in COOLIFY_API_TOKEN COOLIFY_URL COOLIFY_APP_UUID COOLIFY_WORKER_APP_UUID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret manquant : $v"
              exit 1
            fi
          done
          echo "Secrets présents."

      - name: Valider les entrées
        env:
          MODE: ${{ inputs.mode }}
          DEPUIS: ${{ inputs.depuis }}
        run: |
          set -euo pipefail
          [[ "$MODE" =~ ^(coupe|essai|true)$ ]] || { echo "::error::mode : coupe, essai ou true"; exit 1; }
          [[ "$DEPUIS" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]$ ]] || { echo "::error::depuis : date AAAA-MM-JJ attendue"; exit 1; }
          echo "Entrées valides."

      - name: Lire l'état actuel
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WORKER_APP_UUID: ${{ secrets.COOLIFY_WORKER_APP_UUID }}
        run: |
          set -euo pipefail
          for pair in "site:$COOLIFY_APP_UUID" "worker:$COOLIFY_WORKER_APP_UUID"; do
            nom="${pair%%:*}"; uuid="${pair#*:}"
            echo "──── $nom ────"
            curl -fsSL -m 20 -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_URL}/api/v1/applications/${uuid}/envs" \
              | jq -r '.[] | select(.key == "DOSSIER_FICHE_DEMANDE" or .key == "DOSSIER_FICHE_DEMANDE_DEPUIS") | "\(.key) = \(.value) (preview=\(.is_preview))"' \
              || echo "(lecture impossible)"
          done

      - name: Écrire les deux variables (Production seulement)
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WORKER_APP_UUID: ${{ secrets.COOLIFY_WORKER_APP_UUID }}
          MODE: ${{ inputs.mode }}
          DEPUIS: ${{ inputs.depuis }}
        run: |
          set -euo pipefail
          # « coupe » s'écrit « false » : seul « true » allume, « essai » compte à blanc.
          if [ "$MODE" = "coupe" ]; then VALEUR_MODE="false"; else VALEUR_MODE="$MODE"; fi
          upsert() {
            local uuid="$1" nom="$2" cle="$3" valeur="$4" code payload
            payload=$(jq -nc --arg key "$cle" --arg value "$valeur" '{
              key: $key, value: $value,
              is_preview: false, is_literal: false, is_multiline: false, is_shown_once: false
            }')
            echo "──── $nom ($uuid) : $cle=$valeur ────"
            code=$(curl -sS -m 20 -o /tmp/resp -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Content-Type: application/json" \
              -d "$payload" "${COOLIFY_URL}/api/v1/applications/${uuid}/envs")
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then echo "PATCH ✅ ($code)"; return 0; fi
            echo "PATCH → $code : $(head -c 200 /tmp/resp) — tentative POST"
            code=$(curl -sS -m 20 -o /tmp/resp -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Content-Type: application/json" \
              -d "$payload" "${COOLIFY_URL}/api/v1/applications/${uuid}/envs")
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then echo "POST ✅ ($code)"; return 0; fi
            echo "::error::$nom $cle : POST → $code : $(head -c 300 /tmp/resp)"
            return 1
          }
          for app in "site:$COOLIFY_APP_UUID" "worker:$COOLIFY_WORKER_APP_UUID"; do
            upsert "${app#*:}" "${app%%:*}" DOSSIER_FICHE_DEMANDE "$VALEUR_MODE"
            upsert "${app#*:}" "${app%%:*}" DOSSIER_FICHE_DEMANDE_DEPUIS "$DEPUIS"
          done

      - name: Redéployer (POST /api/v1/deploy)
        if: ${{ inputs.redeploy == 'true' }}
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_WORKER_APP_UUID: ${{ secrets.COOLIFY_WORKER_APP_UUID }}
        run: |
          set -euo pipefail
          deploy() {
            local uuid="$1" nom="$2" r
            r=$(curl -fsSL -X POST -m 30 \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Accept: application/json" \
              --data-urlencode "uuid=${uuid}" --data-urlencode "force=true" \
              "${COOLIFY_URL}/api/v1/deploy")
            echo "$nom : $r"
          }
          deploy "$COOLIFY_APP_UUID" site
          deploy "$COOLIFY_WORKER_APP_UUID" worker
