# pgBackRest — config PITR Postgres Axion-IA (ADR 0032).
#
# Repo sur Cloudflare R2 (S3-compatible, off-provider). Chiffré côté pgBackRest.
# Les creds R2 et la passphrase de chiffrement sont injectés par ENV (jamais ici) :
#   PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS
# (pgBackRest lit toute option `xxx-yyy` depuis l'env var `PGBACKREST_XXX_YYY`.)
#
# ⚠️ archive_command côté Postgres n'est activé QU'EN PROD via l'override Coolify
# (docker-compose.override.pgbackrest.yml). Jamais dans docker-compose.production.yml
# (smoke local) ni dans l'image app GHCR — sinon WAL pile-up → saturation disque.

[global]
repo1-type=s3
repo1-s3-endpoint=__R2_ACCOUNT_ID__.r2.cloudflarestorage.com
repo1-s3-bucket=axion-ia-pgbackrest
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass → via env PGBACKREST_REPO1_CIPHER_PASS (hors fichier)

# Rétention : 4 fulls + diffs des 14 derniers jours.
repo1-retention-full=4
repo1-retention-diff=14

# WAL archiving non bloquant (évite le blocage Postgres si R2 momentanément KO).
archive-async=y
spool-path=/var/spool/pgbackrest
compress-type=zst
compress-level=6
process-max=2
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[global:archive-push]
compress-level=3

[axionia]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
